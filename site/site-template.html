<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCDAK Study Hub — Confluent Certified Developer for Apache Kafka</title>
    <style>
        :root {
            --bg: #f6f7fb;
            --panel: #ffffff;
            --panel2: #f0f2f8;
            --text: #1c2333;
            --muted: #6b7488;
            --border: #e2e6f0;
            --brand: #4f46e5;
            --brand2: #7c3aed;
            --brand-soft: #eef0ff;
            --ok: #16a34a;
            --warn: #d97706;
            --bad: #dc2626;
            --code-bg: #0f172a;
            --code-fg: #e2e8f0;
            --inline-code: #eef0ff;
            --inline-code-fg: #4338ca;
            --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 4px 14px rgba(16, 24, 40, .06);
            --hdr: 60px;
            --side: 290px;
        }

        [data-theme=dark] {
            --bg: #0b1020;
            --panel: #121933;
            --panel2: #18213f;
            --text: #e6e9f5;
            --muted: #97a0ba;
            --border: #252f52;
            --brand: #8b8bff;
            --brand2: #a78bfa;
            --brand-soft: #1c2347;
            --code-bg: #080c1a;
            --inline-code: #1f2750;
            --inline-code-fg: #b4b8ff;
            --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .35);
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: calc(var(--hdr) + 16px)
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif
        }

        a {
            color: var(--brand);
            text-decoration: none
        }

        a:hover {
            text-decoration: underline
        }

        button {
            font: inherit;
            cursor: pointer
        }

        /* ===== header ===== */
        header {
            position: fixed;
            inset: 0 0 auto 0;
            height: var(--hdr);
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 0 20px;
            z-index: 50
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 17px;
            letter-spacing: -.2px;
            color: var(--text);
            cursor: pointer;
            white-space: nowrap
        }

        .logo i {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: linear-gradient(135deg, var(--brand), var(--brand2));
            display: grid;
            place-items: center;
            color: #fff;
            font-style: normal;
            font-size: 15px
        }

        .logo small {
            display: block;
            font-weight: 500;
            font-size: 11px;
            color: var(--muted);
            margin-top: -3px
        }

        .tabs {
            display: flex;
            gap: 4px;
            margin-left: 12px;
            background: var(--panel2);
            padding: 4px;
            border-radius: 11px
        }

        .tab {
            border: 0;
            background: transparent;
            color: var(--muted);
            padding: 7px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 7px
        }

        .tab.active {
            background: var(--panel);
            color: var(--brand);
            box-shadow: var(--shadow)
        }

        .spacer {
            flex: 1
        }

        .search {
            position: relative;
            width: min(380px, 32vw)
        }

        .search input {
            width: 100%;
            padding: 9px 14px 9px 36px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--panel2);
            color: var(--text);
            font: inherit;
            outline: none
        }

        .search input:focus {
            border-color: var(--brand);
            background: var(--panel)
        }

        .search:before {
            content: "⌕";
            position: absolute;
            left: 12px;
            top: 5px;
            color: var(--muted);
            font-size: 18px
        }

        .kbd {
            position: absolute;
            right: 10px;
            top: 9px;
            font-size: 11px;
            color: var(--muted);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 0 5px
        }

        #results {
            position: absolute;
            top: 46px;
            left: 0;
            right: 0;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow);
            max-height: 70vh;
            overflow: auto;
            display: none;
            min-width: 360px
        }

        #results .r {
            display: block;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            color: var(--text)
        }

        #results .r:hover {
            background: var(--brand-soft);
            text-decoration: none
        }

        #results .r b {
            display: block;
            font-size: 13px
        }

        #results .r span {
            font-size: 12px;
            color: var(--muted)
        }

        #results mark {
            background: #fde68a;
            color: #000;
            border-radius: 3px
        }

        .iconbtn {
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            font-size: 16px
        }

        .iconbtn:hover {
            background: var(--panel2)
        }

        #menu {
            display: none
        }

        /* ===== layout ===== */
        #study {
            display: flex;
            padding-top: var(--hdr)
        }

        aside {
            position: fixed;
            top: var(--hdr);
            bottom: 0;
            left: 0;
            width: var(--side);
            background: var(--panel);
            border-right: 1px solid var(--border);
            overflow: auto;
            padding: 18px 14px 30px
        }

        aside h4 {
            margin: 18px 10px 8px;
            font-size: 11px;
            letter-spacing: .09em;
            text-transform: uppercase;
            color: var(--muted)
        }

        aside h4:first-child {
            margin-top: 0
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 10px;
            color: var(--text);
            cursor: pointer;
            border: 0;
            background: transparent;
            width: 100%;
            text-align: left
        }

        .nav:hover {
            background: var(--panel2);
            text-decoration: none
        }

        .nav.active {
            background: var(--brand-soft);
            color: var(--brand);
            font-weight: 600
        }

        .nav .n {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            background: var(--panel2);
            display: grid;
            place-items: center;
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            flex: none
        }

        .nav.active .n {
            background: var(--brand);
            color: #fff
        }

        .nav .t {
            flex: 1;
            font-size: 14px
        }

        .nav .ck {
            font-size: 13px;
            color: var(--ok);
            opacity: 0
        }

        .nav.done .ck {
            opacity: 1
        }

        .nav.extra .t {
            color: var(--muted)
        }

        .progress {
            margin: 0 10px 6px;
            font-size: 12px;
            color: var(--muted)
        }

        .bar {
            height: 7px;
            background: var(--panel2);
            border-radius: 99px;
            overflow: hidden;
            margin-top: 6px
        }

        .bar > div {
            height: 100%;
            background: linear-gradient(90deg, var(--brand), var(--brand2));
            width: 0;
            transition: width .3s
        }

        main {
            margin-left: var(--side);
            flex: 1;
            min-width: 0;
            padding: 28px 36px 80px;
            display: flex;
            gap: 36px;
            justify-content: center
        }

        article {
            width: 100%;
            min-width: 0
        }

        .toc {
            width: 230px;
            flex: none;
            position: sticky;
            top: calc(var(--hdr) + 28px);
            align-self: flex-start;
            max-height: calc(100vh - var(--hdr) - 56px);
            overflow: auto;
            font-size: 13px;
            border-left: 2px solid var(--border);
            padding-left: 14px
        }

        .toc b {
            display: block;
            font-size: 11px;
            letter-spacing: .09em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px
        }

        .toc a {
            display: block;
            color: var(--muted);
            padding: 3px 0;
            line-height: 1.35
        }

        .toc a.l3 {
            padding-left: 12px;
            font-size: 12.5px
        }

        .toc a.on {
            color: var(--brand);
            font-weight: 600
        }

        /* ===== module header ===== */
        .mhead {
            background: linear-gradient(135deg, var(--brand), var(--brand2));
            color: #fff;
            border-radius: 18px;
            padding: 26px 28px;
            margin-bottom: 26px;
            box-shadow: var(--shadow)
        }

        .mhead .crumb {
            opacity: .8;
            font-size: 12.5px;
            letter-spacing: .05em;
            text-transform: uppercase
        }

        .mhead h1 {
            margin: 6px 0 6px;
            font-size: 30px;
            letter-spacing: -.4px
        }

        .mhead p {
            margin: 0;
            opacity: .92
        }

        .meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 16px;
            align-items: center
        }

        .pill {
            background: rgba(255, 255, 255, .18);
            border-radius: 99px;
            padding: 4px 12px;
            font-size: 12.5px
        }

        .mbtn {
            background: #fff;
            color: var(--brand);
            border: 0;
            border-radius: 99px;
            padding: 6px 14px;
            font-weight: 700;
            font-size: 13px
        }

        .mbtn.done {
            background: #bbf7d0;
            color: #166534
        }

        .pager {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            margin-top: 40px
        }

        .pager button {
            flex: 1;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            padding: 14px 18px;
            border-radius: 12px;
            text-align: left
        }

        .pager button:hover {
            border-color: var(--brand);
            box-shadow: var(--shadow)
        }

        .pager small {
            display: block;
            color: var(--muted);
            font-size: 12px
        }

        .pager .next {
            text-align: right
        }

        /* ===== rendered markdown ===== */
        .md {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 10px 34px 30px;
            box-shadow: var(--shadow)
        }

        .md h1 {
            font-size: 25px;
            margin: 30px 0 10px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 8px
        }

        .md h2 {
            font-size: 21px;
            margin: 34px 0 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border)
        }

        .md h3 {
            font-size: 17px;
            margin: 26px 0 8px;
            color: var(--brand)
        }

        .md h4 {
            font-size: 15px;
            margin: 20px 0 6px
        }

        .md h1:first-child, .md h2:first-child {
            margin-top: 20px
        }

        .md p {
            margin: .7em 0
        }

        .md li {
            margin: .28em 0
        }

        .md ul, .md ol {
            padding-left: 1.4em
        }

        .md code {
            background: var(--inline-code);
            color: var(--inline-code-fg);
            padding: 1px 6px;
            border-radius: 6px;
            font: 0.88em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace
        }

        .md pre {
            position: relative;
            background: var(--code-bg);
            color: var(--code-fg);
            border-radius: 12px;
            padding: 16px 18px;
            overflow: auto;
            margin: 14px 0;
            font-size: 13px;
            line-height: 1.55
        }

        .md pre code {
            background: transparent;
            color: inherit;
            padding: 0;
            font-size: inherit
        }

        .copy {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 255, 255, .1);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, .18);
            border-radius: 7px;
            font-size: 11px;
            padding: 3px 9px;
            opacity: 0;
            transition: .15s
        }

        .md pre:hover .copy {
            opacity: 1
        }

        .md table {
            border-collapse: collapse;
            width: 100%;
            margin: 16px 0;
            font-size: 14px;
            display: block;
            overflow: auto
        }

        .md th {
            background: var(--panel2);
            text-align: left;
            font-weight: 700
        }

        .md th, .md td {
            border: 1px solid var(--border);
            padding: 8px 12px;
            vertical-align: top
        }

        .md tr:nth-child(even) td {
            background: color-mix(in srgb, var(--panel2) 45%, transparent)
        }

        .md blockquote {
            margin: 14px 0;
            padding: 10px 18px;
            border-left: 4px solid var(--brand);
            background: var(--brand-soft);
            border-radius: 0 10px 10px 0
        }

        .md img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #fff
        }

        .imgwrap {
            position: relative;
            display: inline-block;
            max-width: 100%
        }

        .imgwrap .expand {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 32px;
            height: 32px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: rgba(255, 255, 255, .92);
            color: #334155;
            font-size: 17px;
            line-height: 1;
            cursor: pointer;
            opacity: .75;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .2);
            transition: opacity .15s
        }

        .imgwrap:hover .expand, .imgwrap .expand:focus {
            opacity: 1
        }

        #imgmodal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            background: rgba(10, 12, 20, .88);
            overflow: auto;
            padding: 56px 16px 24px;
            text-align: center
        }

        #imgmodal.open {
            display: block
        }

        #imgmodal img {
            max-width: 100%;
            height: auto;
            background: #fff;
            border-radius: 8px;
            cursor: zoom-in
        }

        #imgmodal.full img {
            max-width: none;
            cursor: zoom-out
        }

        #imgmodal .close {
            position: fixed;
            top: 12px;
            right: 16px;
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 8px;
            background: rgba(255, 255, 255, .2);
            color: #fff;
            font-size: 20px;
            cursor: pointer
        }

        #imgmodal .close:hover {
            background: rgba(255, 255, 255, .35)
        }

        #imgmodal .hint {
            position: fixed;
            top: 20px;
            left: 16px;
            color: #cbd5e1;
            font-size: 13px
        }

        .md hr {
            border: 0;
            border-top: 1px solid var(--border);
            margin: 28px 0
        }

        .md strong {
            color: var(--text)
        }

        .md .hl {
            background: #fde68a;
            color: #000;
            border-radius: 3px
        }

        /* ===== home ===== */
        .hero {
            background: linear-gradient(135deg, #1e1b4b, #4f46e5 55%, #7c3aed);
            color: #fff;
            border-radius: 22px;
            padding: 40px 40px 34px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden
        }

        .hero:after {
            content: "";
            position: absolute;
            right: -60px;
            top: -60px;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .08)
        }

        .hero h1 {
            margin: 0 0 8px;
            font-size: 34px;
            letter-spacing: -.6px
        }

        .hero p {
            margin: 0;
            max-width: 620px;
            opacity: .9;
            font-size: 16px
        }

        .cta {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap
        }

        .btn {
            border: 0;
            border-radius: 11px;
            padding: 11px 20px;
            font-weight: 700;
            font-size: 14px
        }

        .btn.primary {
            background: #fff;
            color: #4338ca
        }

        .btn.ghost {
            background: rgba(255, 255, 255, .16);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, .3)
        }

        .stats {
            display: grid;
            grid-template-columns:repeat(auto-fit, minmax(135px, 1fr));
            gap: 14px;
            margin: 22px 0
        }

        .stat {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 18px;
            box-shadow: var(--shadow)
        }

        .stat b {
            font-size: 26px;
            display: block;
            letter-spacing: -.5px
        }

        .stat span {
            color: var(--muted);
            font-size: 13px
        }

        .sec {
            margin: 34px 0 14px;
            font-size: 20px;
            letter-spacing: -.3px
        }

        .sub {
            color: var(--muted);
            margin: -8px 0 16px
        }

        .grid {
            display: grid;
            grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
            gap: 14px
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 18px;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: .15s;
            position: relative
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: var(--brand)
        }

        .card .n {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            background: var(--brand-soft);
            color: var(--brand);
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 13px;
            margin-bottom: 10px
        }

        .card h3 {
            margin: 0 0 4px;
            font-size: 16px
        }

        .card p {
            margin: 0;
            font-size: 13px;
            color: var(--muted)
        }

        .card .tag {
            position: absolute;
            top: 14px;
            right: 14px;
            font-size: 11px;
            color: var(--ok);
            font-weight: 700
        }

        .card.extra {
            opacity: .78
        }

        .domain {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 14px;
            box-shadow: var(--shadow)
        }

        .domain h3 {
            margin: 0 0 12px;
            font-size: 17px;
            display: flex;
            align-items: center;
            gap: 10px
        }

        .domain h3 em {
            font-style: normal;
            background: var(--brand);
            color: #fff;
            border-radius: 8px;
            padding: 1px 9px;
            font-size: 13px
        }

        .item {
            display: flex;
            gap: 12px;
            align-items: baseline;
            justify-content: space-between;
            padding: 7px 0;
            border-top: 1px dashed var(--border);
            font-size: 14px
        }

        .item:first-of-type {
            border-top: 0
        }

        .chips {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            justify-content: flex-end
        }

        .chip {
            border: 1px solid var(--border);
            background: var(--panel2);
            color: var(--brand);
            border-radius: 99px;
            padding: 1px 9px;
            font-size: 12px;
            font-weight: 600
        }

        .chip:hover {
            background: var(--brand);
            color: #fff;
            text-decoration: none
        }

        .legend {
            font-size: 13px;
            color: var(--muted);
            margin-top: 8px
        }

        /* ===== exam view ===== */
        #exam {
            display: none;
            position: fixed;
            inset: var(--hdr) 0 0 0;
            background: var(--bg);
            flex-direction: column
        }

        .examtop {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 20px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            font-size: 14px
        }

        .examtop b {
            font-size: 15px
        }

        .examtop span {
            color: var(--muted)
        }

        .examtop a.btn {
            background: var(--brand);
            color: #fff;
            padding: 7px 14px;
            font-size: 13px
        }

        #examframe {
            flex: 1;
            width: 100%;
            border: 0;
            background: #fff
        }

        body.view-exam #study {
            display: none
        }

        body.view-exam #exam {
            display: flex
        }

        body.view-exam .search {
            visibility: hidden
        }

        /* ===== collapsible sidebar (desktop) ===== */
        aside {
            transition: transform .2s
        }

        main {
            transition: margin-left .2s
        }

        aside {
            display: flex;
            flex-direction: column
        }

        aside > * {
            flex-shrink: 0
        }

        .collapse-btn {
            position: sticky;
            bottom: -30px;
            margin: auto -14px -30px;
            width: calc(100% + 28px);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 0;
            border-top: 1px solid var(--border);
            background: var(--panel);
            color: var(--muted);
            font-size: 14px;
            text-align: left;
            cursor: pointer
        }

        .collapse-btn:hover {
            color: var(--text);
            background: var(--panel2)
        }

        .collapse-btn svg, #expand-side svg {
            width: 16px;
            height: 16px;
            flex: none
        }

        .collapse-btn .ico-expand {
            display: none
        }

        @media (min-width: 901px) {
            body.side-collapsed {
                --side: 64px
            }

            body.side-collapsed aside {
                padding: 14px 8px 30px;
                overflow-x: hidden
            }

            body.side-collapsed aside .t, body.side-collapsed aside .ck, body.side-collapsed aside .progress,
            body.side-collapsed .collapse-btn .lbl {
                display: none
            }

            body.side-collapsed aside h4 {
                font-size: 0;
                margin: 10px 14px;
                height: 0;
                border-top: 1px solid var(--border)
            }

            body.side-collapsed .nav {
                justify-content: center;
                padding: 8px 0
            }

            body.side-collapsed .nav.done .n {
                box-shadow: 0 0 0 2px var(--ok)
            }

            body.side-collapsed .collapse-btn {
                justify-content: center;
                padding: 12px 0;
                margin-left: -8px;
                margin-right: -8px;
                width: calc(100% + 16px)
            }

            body.side-collapsed .collapse-btn .ico-collapse {
                display: none
            }

            body.side-collapsed .collapse-btn .ico-expand {
                display: block
            }
        }

        @media (max-width: 900px) {
            .collapse-btn {
                display: none
            }
        }

        @media (max-width: 1180px) {
            .toc {
                display: none
            }
        }

        @media (max-width: 900px) {
            aside {
                transform: translateX(-100%);
                transition: .2s;
                z-index: 40;
                box-shadow: var(--shadow)
            }

            body.menu aside {
                transform: none
            }

            main {
                margin-left: 0;
                padding: 18px 14px 60px
            }

            #menu {
                display: block
            }

            .md {
                padding: 6px 18px 22px
            }

            .hero {
                padding: 26px 22px
            }

            .hero h1 {
                font-size: 26px
            }

            .search {
                width: auto;
                flex: 1
            }

            .logo small {
                display: none
            }
        }

        @media print {
            header, aside, .toc, .pager, .copy, .mbtn {
                display: none !important
            }

            main {
                margin: 0;
                padding: 0
            }

            #study {
                padding: 0
            }

            .md {
                border: 0;
                box-shadow: none
            }
        }
    </style>
</head>
<body>
<header>
    <button class="iconbtn" id="menu" title="Menu">☰</button>
    <div class="logo" onclick="go('home')"><i>K</i>
        <div>CCDAK Study Hub by Albi<small>Confluent Certified Developer for Apache Kafka</small></div>
    </div>
    <div class="tabs">
        <button class="tab active" id="tab-study" onclick="go('home')">📘 Study</button>
        <button class="tab" id="tab-exam" onclick="go('exam')">📝 Practice Exam</button>
    </div>
    <div class="spacer"></div>
    <div class="search"><input id="q" placeholder="Search all summaries…" autocomplete="off"><span class="kbd">/</span>
        <div id="results"></div>
    </div>
    <button class="iconbtn" id="theme" title="Toggle dark mode">🌙</button>
</header>

<div id="study">
    <aside id="side"></aside>
    <main>
        <article id="content"></article>
        <nav class="toc" id="toc"></nav>
    </main>
</div>

<section id="exam">
    <div class="examtop">
        <b>Practice Exam</b><span>Questions built from the module question files · 70% pass threshold</span>
        <div class="spacer"></div>
        <a class="btn" href="exam.html" target="_blank" rel="noopener">Open in new window ↗</a>
    </div>
    <iframe id="examframe" title="CCDAK practice exam"></iframe>
</section>

<div id="imgmodal"><span class="hint">Click image to toggle full size · Esc to close</span>
    <button class="close" title="Close">✕</button>
    <img alt=""></div>
<script id="data" type="application/json">__DATA__</script>
<script>
    const DATA = JSON.parse(document.getElementById('data').textContent);
    const M = DATA.modules, byId = Object.fromEntries(M.map(m => [m.id, m]));
    const $ = s => document.querySelector(s);
    const store = {
        get: (k, d) => {
            try {
                return JSON.parse(localStorage.getItem(k)) ?? d
            } catch (e) {
                return d
            }
        }, set: (k, v) => localStorage.setItem(k, JSON.stringify(v))
    };
    let done = store.get('ccdak_done', {});
    let currentId = null;

    /* ---------- theme ---------- */
    function setTheme(t) {
        document.documentElement.dataset.theme = t;
        $('#theme').textContent = t === 'dark' ? '☀️' : '🌙';
        store.set('ccdak_theme', t)
    }

    setTheme(store.get('ccdak_theme', 'light'));
    $('#theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    $('#menu').onclick = () => document.body.classList.toggle('menu');

    /* ---------- sidebar ---------- */
    function renderSide() {
        const core = M.filter(m => m.kind === 'core'), extra = M.filter(m => m.kind === 'extra');
        const doneCount = core.filter(m => done[m.id]).length, pct = Math.round(doneCount / core.length * 100);
        const item = m => `<button class="nav ${m.kind} ${currentId === m.id ? 'active' : ''} ${done[m.id] ? 'done' : ''}" title="${m.id}. ${m.title}" onclick="go('m/${m.id}')"><span class="n">${m.id}</span><span class="t">${m.title}</span><span class="ck">✔</span></button>`;
        $('#side').innerHTML = `
    <button class="nav ${currentId === null ? 'active' : ''}" title="Overview &amp; exam scope" onclick="go('home')"><span class="n">⌂</span><span class="t">Overview &amp; exam scope</span></button>
    <h4>Progress</h4><div class="progress">${doneCount} of ${core.length} exam modules studied<div class="bar"><div style="width:${pct}%"></div></div></div>
    <h4>Exam modules</h4>${core.map(item).join('')}
    <h4>Supplementary</h4>${extra.map(item).join('')}
    <h4>Practice</h4><button class="nav" title="Practice exam" onclick="go('exam')"><span class="n">✎</span><span class="t">Practice exam</span></button>
    <button class="collapse-btn" title="Collapse / expand sidebar" onclick="setSide(!document.body.classList.contains('side-collapsed'))"><svg class="ico-collapse" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2v12M14 8H6M10 4L6 8l4 4"/></svg><svg class="ico-expand" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2v12M6 8h8M10 4l4 4-4 4"/></svg><span class="lbl">Collapse sidebar</span></button>`;
    }

    function setSide(collapsed) {
        document.body.classList.toggle('side-collapsed', collapsed);
        store.set('ccdak_side_collapsed', collapsed)
    }

    document.body.classList.toggle('side-collapsed', !!store.get('ccdak_side_collapsed', false));

    /* ---------- views ---------- */
    function home() {
        currentId = null;
        const core = M.filter(m => m.kind === 'core'), mins = core.reduce((a, m) => a + m.minutes, 0);
        const items = DATA.domains.reduce((a, d) => a + d.items.length, 0);
        const chips = ids => ids.map(i => `<a class="chip" href="#/m/${i}" title="${byId[i].title}">${i} · ${byId[i].title}</a>`).join('');
        $('#content').innerHTML = `
  <div class="hero"><h1>CCDAK Study Hub</h1>
    <p>Condensed, interactive summaries for the Confluent Certified Developer for Apache Kafka exam — mapped to every item of the official exam scope, with a full practice exam in its own view.</p>
    <div class="cta"><button class="btn primary" onclick="go('m/${(core.find(m => !done[m.id]) || core[0]).id}')">Continue studying →</button><button class="btn ghost" onclick="go('exam')">Take practice exam</button></div></div>
  <div class="stats">
    <div class="stat"><b>${M.length}</b><span>module summaries</span></div>
    <div class="stat"><b>${DATA.domains.length}</b><span>exam domains</span></div>
    <div class="stat"><b>${items}</b><span>scope topics covered</span></div>
    <div class="stat"><b>~${Math.round(mins / 60 * 10) / 10} h</b><span>total reading time</span></div>
    <div class="stat"><b>${Object.keys(done).filter(k => byId[k] && byId[k].kind === 'core').length}/${core.length}</b><span>modules completed</span></div>
  </div>
  <h2 class="sec">Modules</h2><div class="grid">${M.map(m => `<div class="card ${m.kind}" onclick="go('m/${m.id}')">${done[m.id] ? '<span class="tag">✔ studied</span>' : ''}<div class="n">${m.id}</div><h3>${m.title}</h3><p>${m.desc}</p><p style="margin-top:8px;font-size:12px">⏱ ~${m.minutes} min read</p></div>`).join('')}</div>
  <h2 class="sec">Exam scope coverage</h2><p class="sub">Each topic from the official exam outline, with the modules that cover it.</p>
  ${DATA.domains.map(d => `<div class="domain"><h3><em>${d.n}</em>${d.title}</h3>${d.items.map(i => `<div class="item"><span>${i.text}</span><span class="chips">${chips(i.modules)}</span></div>`).join('')}</div>`).join('')}
  <p class="legend">🚫 in a heading marks material outside the exam scope. Modules 10 and 12 are supplementary.</p>`;
        $('#toc').innerHTML = '';
        renderSide();
        scrollTo(0, 0);
    }

    function module(id) {
        const m = byId[id];
        if (!m) return home();
        currentId = id;
        const i = M.indexOf(m), prev = M[i - 1], next = M[i + 1];
        $('#content').innerHTML = `
  <div class="mhead"><div class="crumb">Module ${m.id} · ${m.kind === 'core' ? 'Exam scope' : 'Supplementary'}</div><h1>${m.title}</h1><p>${m.desc}</p>
    <div class="meta"><span class="pill">⏱ ~${m.minutes} min</span><span class="pill">📁 ${m.folder}</span><button class="mbtn ${done[id] ? 'done' : ''}" id="markbtn">${done[id] ? '✔ Studied' : 'Mark as studied'}</button></div></div>
  <div class="md" id="md">${m.html}</div>
  <div class="pager">${prev ? `<button onclick="go('m/${prev.id}')"><small>← Previous</small>${prev.id}. ${prev.title}</button>` : '<span style="flex:1"></span>'}
  ${next ? `<button class="next" onclick="go('m/${next.id}')"><small>Next →</small>${next.id}. ${next.title}</button>` : `<button class="next" onclick="go('exam')"><small>Finished →</small>Take the practice exam</button>`}</div>`;
        $('#markbtn').onclick = () => {
            done[id] = !done[id];
            if (!done[id]) delete done[id];
            store.set('ccdak_done', done);
            module(id)
        };
        decorate();
        renderSide();
        scrollTo(0, 0);
    }

    function decorate() {
        const md = $('#md'), heads = [...md.querySelectorAll('h1,h2,h3')], seen = {};
        heads.forEach(h => {
            let id = h.textContent.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'section';
            seen[id] = (seen[id] || 0) + 1;
            if (seen[id] > 1) id += '-' + seen[id];
            h.id = id
        });
        $('#toc').innerHTML = '<b>On this page</b>' + heads.filter(h => h.tagName !== 'H1' || heads.length < 40).map(h => `<a href="#" data-id="${h.id}" class="${h.tagName === 'H3' ? 'l3' : ''}">${h.textContent}</a>`).join('');
        $('#toc').querySelectorAll('a').forEach(a => a.onclick = e => {
            e.preventDefault();
            document.getElementById(a.dataset.id).scrollIntoView({behavior: 'smooth'})
        });
        md.querySelectorAll('pre').forEach(pre => {
            const b = document.createElement('button');
            b.className = 'copy';
            b.textContent = 'Copy';
            b.onclick = () => {
                navigator.clipboard.writeText(pre.querySelector('code')?.innerText ?? pre.innerText);
                b.textContent = 'Copied ✔';
                setTimeout(() => b.textContent = 'Copy', 1200)
            };
            pre.appendChild(b)
        });
        md.querySelectorAll('img').forEach(img => {
            const w = document.createElement('span');
            w.className = 'imgwrap';
            img.replaceWith(w);
            w.appendChild(img);
            const b = document.createElement('button');
            b.className = 'expand';
            b.title = 'View full size';
            b.textContent = '⛶';
            b.onclick = () => openImg(img.src, img.alt);
            w.appendChild(b)
        });
        md.querySelectorAll('a[href^="http"]').forEach(a => {
            a.target = '_blank';
            a.rel = 'noopener'
        });
    }

    addEventListener('scroll', () => {
        const links = [...document.querySelectorAll('#toc a')];
        if (!links.length) return;
        let cur = links[0];
        for (const a of links) {
            const el = document.getElementById(a.dataset.id);
            if (el && el.getBoundingClientRect().top < 120) cur = a
        }
        links.forEach(a => a.classList.toggle('on', a === cur));
    }, {passive: true});

    /* ---------- exam ---------- */
    function showExam() {
        document.body.classList.add('view-exam');
        const f = $('#examframe');
        if (!f.getAttribute('src')) f.setAttribute('src', 'exam.html');
    }

    /* ---------- routing ---------- */
    function go(r) {
        location.hash = '#/' + r;
        document.body.classList.remove('menu')
    }

    function route() {
        const r = location.hash.replace(/^#\/?/, '') || 'home';
        const isExam = r === 'exam';
        document.body.classList.toggle('view-exam', isExam);
        $('#tab-exam').classList.toggle('active', isExam);
        $('#tab-study').classList.toggle('active', !isExam);
        if (isExam) return showExam();
        if (r.startsWith('m/')) module(r.slice(2)); else home();
        document.title = (currentId ? byId[currentId].title + ' · ' : '') + 'CCDAK Study Hub';
    }

    addEventListener('hashchange', route);

    /* ---------- search ---------- */
    let index = null;

    function buildIndex() {
        index = [];
        for (const m of M) {
            const doc = new DOMParser().parseFromString('<div>' + m.html + '</div>', 'text/html').body.firstChild;
            let head = m.title, buf = [];
            const flush = () => {
                if (buf.length) index.push({m, head, text: buf.join(' ')});
                buf = []
            };
            for (const el of doc.children) {
                if (/^H[1-4]$/.test(el.tagName)) {
                    flush();
                    head = el.textContent.trim()
                } else buf.push(el.textContent.replace(/\s+/g, ' '))
            }
            flush();
        }
    }

    const esc = s => s.replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));

    function search(q) {
        const box = $('#results');
        q = q.trim().toLowerCase();
        if (q.length < 2) {
            box.style.display = 'none';
            return
        }
        if (!index) buildIndex();
        const terms = q.split(/\s+/), out = [];
        for (const s of index) {
            const hay = (s.head + ' ' + s.text).toLowerCase();
            if (!terms.every(t => hay.includes(t))) continue;
            const score = terms.reduce((a, t) => a + (s.head.toLowerCase().includes(t) ? 5 : 0) + (hay.split(t).length - 1), 0);
            const p = hay.indexOf(terms[0]), full = s.head + ' — ' + s.text;
            const at = full.toLowerCase().indexOf(terms[0]);
            let snip = esc(full.slice(Math.max(0, at - 50), at + 110));
            terms.forEach(t => snip = snip.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), x => '<mark>' + x + '</mark>'));
            out.push({s, score, snip});
        }
        out.sort((a, b) => b.score - a.score);
        box.innerHTML = out.slice(0, 25).map(o => `<a class="r" href="#/m/${o.s.m.id}" data-h="${esc(o.s.head)}"><b>${o.s.m.id}. ${o.s.m.title} › ${esc(o.s.head)}</b><span>…${o.snip}…</span></a>`).join('') || '<div class="r"><span>No results</span></div>';
        box.style.display = 'block';
        box.querySelectorAll('a.r').forEach(a => a.onclick = () => {
            box.style.display = 'none';
            const h = a.dataset.h, id = a.getAttribute('href').slice(4);
            setTimeout(() => {
                const t = [...document.querySelectorAll('#md h1,#md h2,#md h3,#md h4')].find(e => e.textContent.trim() === h);
                if (t) t.scrollIntoView({behavior: 'smooth'})
            }, currentId === id ? 0 : 80);
        });
    }

    $('#q').addEventListener('input', e => search(e.target.value));
    $('#q').addEventListener('focus', e => search(e.target.value));
    document.addEventListener('click', e => {
        if (!e.target.closest('.search')) $('#results').style.display = 'none'
    });
    addEventListener('keydown', e => {
        if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
            e.preventDefault();
            $('#q').focus()
        }
        if (e.key === 'Escape') {
            $('#results').style.display = 'none';
            $('#q').blur()
        }
        if (!/INPUT|TEXTAREA/.test(document.activeElement.tagName) && currentId) {
            const i = M.findIndex(m => m.id === currentId);
            if (e.key === 'ArrowRight' && M[i + 1]) go('m/' + M[i + 1].id);
            if (e.key === 'ArrowLeft' && M[i - 1]) go('m/' + M[i - 1].id);
        }
    });
    const modal = $('#imgmodal'), modalImg = modal.querySelector('img');

    function openImg(src, alt) {
        modalImg.src = src;
        modalImg.alt = alt || '';
        modal.classList.remove('full');
        modal.classList.add('open');
        modal.scrollTop = 0;
        document.body.style.overflow = 'hidden'
    }

    function closeImg() {
        modal.classList.remove('open');
        document.body.style.overflow = ''
    }

    modalImg.onclick = () => modal.classList.toggle('full');
    modal.querySelector('.close').onclick = closeImg;
    modal.onclick = e => {
        if (e.target === modal) closeImg()
    };
    addEventListener('keydown', e => {
        if (!modal.classList.contains('open')) return;
        e.stopImmediatePropagation();
        if (e.key === 'Escape') closeImg()
    }, true);

    route();
</script>
</body>
</html>
