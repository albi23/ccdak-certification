<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCDAK Study Hub — Confluent Certified Developer for Apache Kafka</title>
    <style>
        :root {
            --bg: #f6f7fb;
            --panel: #ffffff;
            --panel2: #f0f2f8;
            --text: #1c2333;
            --muted: #6b7488;
            --border: #e2e6f0;
            --brand: #4f46e5;
            --brand2: #7c3aed;
            --brand-soft: #eef0ff;
            --ok: #16a34a;
            --warn: #d97706;
            --bad: #dc2626;
            --code-bg: #0f172a;
            --code-fg: #e2e8f0;
            --inline-code: #eef0ff;
            --inline-code-fg: #4338ca;
            --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 4px 14px rgba(16, 24, 40, .06);
            --hdr: 60px;
            --side: 290px;
        }

        [data-theme=dark] {
            color-scheme: dark;
            --bg: #0d1117;
            --panel: #161b22;
            --panel2: #21262d;
            --text: #e6edf3;
            --muted: #8b949e;
            --border: #30363d;
            --brand: #58a6ff;
            --brand2: #1f6feb;
            --brand-soft: rgba(56, 139, 253, .14);
            --ok: #3fb950;
            --warn: #d29922;
            --bad: #f85149;
            --code-bg: #0d1117;
            --code-fg: #e6edf3;
            --inline-code: rgba(110, 118, 129, .28);
            --inline-code-fg: #e6edf3;
            --shadow: 0 1px 0 rgba(1, 4, 9, .4), 0 4px 14px rgba(1, 4, 9, .45);
        }

        [data-theme=dark] header {
            background: #010409;
        }

        [data-theme=dark] aside,
        [data-theme=dark] .collapse-btn {
            background: #0d1117;
        }

        [data-theme=dark] .logo i {
            background: #21262d;
            border: 1px solid var(--border);
            color: #f0f6fc;
        }

        [data-theme=dark] .tabs {
            background: #0d1117;
            border: 1px solid var(--border);
        }

        [data-theme=dark] .tab.active {
            background: #21262d;
            color: #f0f6fc;
            box-shadow: none;
        }

        [data-theme=dark] .search input {
            background: #0d1117;
        }

        [data-theme=dark] .search input:focus {
            background: #0d1117;
            border-color: var(--brand);
        }

        [data-theme=dark] .nav.active {
            background: rgba(177, 186, 196, .12);
            color: #f0f6fc;
        }

        [data-theme=dark] .nav.active .n {
            background: #1f6feb;
            color: #fff;
        }

        [data-theme=dark] .bar > div {
            background: #238636;
        }

        [data-theme=dark] .mhead,
        [data-theme=dark] .hero {
            background: linear-gradient(135deg, #161b22 0%, #1c2430 100%);
            color: #e6edf3;
            border: 1px solid var(--border);
        }

        [data-theme=dark] .hero:after {
            background: rgba(88, 166, 255, .06);
        }

        [data-theme=dark] .mhead .crumb {
            color: var(--muted);
            opacity: 1;
        }

        [data-theme=dark] .mhead p,
        [data-theme=dark] .hero p {
            color: #c9d1d9;
            opacity: 1;
        }

        [data-theme=dark] .pill {
            background: var(--panel2);
            border: 1px solid var(--border);
            color: #c9d1d9;
        }

        [data-theme=dark] .mbtn,
        [data-theme=dark] .btn.primary {
            background: #238636;
            color: #fff;
            border: 1px solid rgba(240, 246, 252, .12);
        }

        [data-theme=dark] .mbtn:hover,
        [data-theme=dark] .btn.primary:hover {
            background: #2ea043;
        }

        [data-theme=dark] .mbtn.done {
            background: rgba(46, 160, 67, .18);
            color: #3fb950;
            border: 1px solid rgba(63, 185, 80, .4);
        }

        [data-theme=dark] .btn.ghost {
            background: #21262d;
            color: #e6edf3;
            border: 1px solid var(--border);
        }

        [data-theme=dark] .btn.ghost:hover {
            background: #30363d;
        }

        [data-theme=dark] .md pre {
            border: 1px solid var(--border);
        }

        [data-theme=dark] .md blockquote {
            border-left-color: #1f6feb;
            background: rgba(56, 139, 253, .08);
        }

        [data-theme=dark] .domain h3 em,
        [data-theme=dark] .examtop a.btn {
            background: #1f6feb;
            color: #fff;
        }

        [data-theme=dark] .chip:hover {
            background: #1f6feb;
            border-color: #1f6feb;
            color: #fff;
        }

        [data-theme=dark] #results mark,
        [data-theme=dark] .md .hl {
            background: rgba(187, 128, 9, .45);
            color: #f0f6fc;
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: calc(var(--hdr) + 16px)
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif
        }

        a {
            color: var(--brand);
            text-decoration: none
        }

        a:hover {
            text-decoration: underline
        }

        button {
            font: inherit;
            cursor: pointer
        }

        /* ===== header ===== */
        header {
            position: fixed;
            inset: 0 0 auto 0;
            height: var(--hdr);
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 0 20px;
            z-index: 50
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 17px;
            letter-spacing: -.2px;
            color: var(--text);
            cursor: pointer;
            white-space: nowrap
        }

        .logo i {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: linear-gradient(135deg, var(--brand), var(--brand2));
            display: grid;
            place-items: center;
            color: #fff;
            font-style: normal;
            font-size: 15px
        }

        .logo small {
            display: block;
            font-weight: 500;
            font-size: 11px;
            color: var(--muted);
            margin-top: -3px
        }

        .tabs {
            display: flex;
            gap: 4px;
            margin-left: 12px;
            background: var(--panel2);
            padding: 4px;
            border-radius: 11px
        }

        .tab {
            border: 0;
            background: transparent;
            color: var(--muted);
            padding: 7px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 7px
        }

        .tab.active {
            background: var(--panel);
            color: var(--brand);
            box-shadow: var(--shadow)
        }

        .spacer {
            flex: 1
        }

        .search {
            position: relative;
            width: min(380px, 32vw)
        }

        .search input {
            width: 100%;
            padding: 9px 14px 9px 36px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--panel2);
            color: var(--text);
            font: inherit;
            outline: none
        }

        .search input:focus {
            border-color: var(--brand);
            background: var(--panel)
        }

        .search:before {
            content: "⌕";
            position: absolute;
            left: 12px;
            top: 5px;
            color: var(--muted);
            font-size: 18px
        }

        .kbd {
            position: absolute;
            right: 10px;
            top: 9px;
            font-size: 11px;
            color: var(--muted);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 0 5px
        }

        #results {
            position: absolute;
            top: 46px;
            left: 0;
            right: 0;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow);
            max-height: 70vh;
            overflow: auto;
            display: none;
            min-width: 360px
        }

        #results .r {
            display: block;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            color: var(--text)
        }

        #results .r:hover {
            background: var(--brand-soft);
            text-decoration: none
        }

        #results .r b {
            display: block;
            font-size: 13px
        }

        #results .r span {
            font-size: 12px;
            color: var(--muted)
        }

        #results mark {
            background: #fde68a;
            color: #000;
            border-radius: 3px
        }

        .iconbtn {
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            font-size: 16px
        }

        .iconbtn:hover {
            background: var(--panel2)
        }

        #menu {
            display: none
        }

        /* ===== layout ===== */
        #study {
            display: flex;
            padding-top: var(--hdr)
        }

        aside {
            position: fixed;
            top: var(--hdr);
            bottom: 0;
            left: 0;
            width: var(--side);
            background: var(--panel);
            border-right: 1px solid var(--border);
            overflow: auto;
            padding: 18px 14px 30px
        }

        aside h4 {
            margin: 18px 10px 8px;
            font-size: 11px;
            letter-spacing: .09em;
            text-transform: uppercase;
            color: var(--muted)
        }

        aside h4:first-child {
            margin-top: 0
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 10px;
            color: var(--text);
            cursor: pointer;
            border: 0;
            background: transparent;
            width: 100%;
            text-align: left
        }

        .nav:hover {
            background: var(--panel2);
            text-decoration: none
        }

        .nav.active {
            background: var(--brand-soft);
            color: var(--brand);
            font-weight: 600
        }

        .nav .n {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            background: var(--panel2);
            display: grid;
            place-items: center;
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            flex: none
        }

        .nav.active .n {
            background: var(--brand);
            color: #fff
        }

        .nav .t {
            flex: 1;
            font-size: 14px
        }

        .nav .ck {
            font-size: 13px;
            color: var(--ok);
            opacity: 0
        }

        .nav.done .ck {
            opacity: 1
        }

        .nav.extra .t {
            color: var(--muted)
        }

        .progress {
            margin: 0 10px 6px;
            font-size: 12px;
            color: var(--muted)
        }

        .bar {
            height: 7px;
            background: var(--panel2);
            border-radius: 99px;
            overflow: hidden;
            margin-top: 6px
        }

        .bar > div {
            height: 100%;
            background: linear-gradient(90deg, var(--brand), var(--brand2));
            width: 0;
            transition: width .3s
        }

        main {
            margin-left: var(--side);
            flex: 1;
            min-width: 0;
            padding: 28px 36px 80px;
            display: flex;
            gap: 36px;
            justify-content: center
        }

        article {
            width: 100%;
            min-width: 0
        }

        .toc {
            width: 230px;
            flex: none;
            position: sticky;
            top: calc(var(--hdr) + 28px);
            align-self: flex-start;
            max-height: calc(100vh - var(--hdr) - 56px);
            overflow: auto;
            font-size: 13px;
            border-left: 2px solid var(--border);
            padding-left: 14px
        }

        .toc b {
            display: block;
            font-size: 11px;
            letter-spacing: .09em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px
        }

        .toc a {
            display: block;
            color: var(--muted);
            padding: 3px 0;
            line-height: 1.35
        }

        .toc a.l3 {
            padding-left: 12px;
            font-size: 12.5px
        }

        .toc a.on {
            color: var(--brand);
            font-weight: 600
        }

        /* ===== module header ===== */
        .mhead {
            background: linear-gradient(135deg, var(--brand), var(--brand2));
            color: #fff;
            border-radius: 18px;
            padding: 26px 28px;
            margin-bottom: 26px;
            box-shadow: var(--shadow)
        }

        .mhead .crumb {
            opacity: .8;
            font-size: 12.5px;
            letter-spacing: .05em;
            text-transform: uppercase
        }

        .mhead h1 {
            margin: 6px 0 6px;
            font-size: 30px;
            letter-spacing: -.4px
        }

        .mhead p {
            margin: 0;
            opacity: .92
        }

        .meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 16px;
            align-items: center
        }

        .pill {
            background: rgba(255, 255, 255, .18);
            border-radius: 99px;
            padding: 4px 12px;
            font-size: 12.5px
        }

        .mbtn {
            background: #fff;
            color: var(--brand);
            border: 0;
            border-radius: 99px;
            padding: 6px 14px;
            font-weight: 700;
            font-size: 13px
        }

        .mbtn.done {
            background: #bbf7d0;
            color: #166534
        }

        .pager {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            margin-top: 40px
        }

        .pager button {
            flex: 1;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            padding: 14px 18px;
            border-radius: 12px;
            text-align: left
        }

        .pager button:hover {
            border-color: var(--brand);
            box-shadow: var(--shadow)
        }

        .pager small {
            display: block;
            color: var(--muted);
            font-size: 12px
        }

        .pager .next {
            text-align: right
        }

        /* ===== rendered markdown ===== */
        .md {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 10px 34px 30px;
            box-shadow: var(--shadow)
        }

        .md h1 {
            font-size: 25px;
            margin: 30px 0 10px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 8px
        }

        .md h2 {
            font-size: 21px;
            margin: 34px 0 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border)
        }

        .md h3 {
            font-size: 17px;
            margin: 26px 0 8px;
            color: var(--brand)
        }

        .md h4 {
            font-size: 15px;
            margin: 20px 0 6px
        }

        .md h1:first-child, .md h2:first-child {
            margin-top: 20px
        }

        .md p {
            margin: .7em 0
        }

        .md li {
            margin: .28em 0
        }

        .md ul, .md ol {
            padding-left: 1.4em
        }

        .md code {
            background: var(--inline-code);
            color: var(--inline-code-fg);
            padding: 1px 6px;
            border-radius: 6px;
            font: 0.88em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace
        }

        .md pre {
            position: relative;
            background: var(--code-bg);
            color: var(--code-fg);
            border-radius: 12px;
            padding: 16px 18px;
            overflow: auto;
            margin: 14px 0;
            font-size: 13px;
            line-height: 1.55
        }

        .md pre code {
            background: transparent;
            color: inherit;
            padding: 0;
            font-size: inherit
        }

        .copy {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 255, 255, .1);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, .18);
            border-radius: 7px;
            font-size: 11px;
            padding: 3px 9px;
            opacity: 0;
            transition: .15s
        }

        .md pre:hover .copy {
            opacity: 1
        }

        .md table {
            border-collapse: collapse;
            width: 100%;
            margin: 16px 0;
            font-size: 14px;
            display: block;
            overflow: auto
        }

        .md th {
            background: var(--panel2);
            text-align: left;
            font-weight: 700
        }

        .md th, .md td {
            border: 1px solid var(--border);
            padding: 8px 12px;
            vertical-align: top
        }

        .md tr:nth-child(even) td {
            background: color-mix(in srgb, var(--panel2) 45%, transparent)
        }

        .md blockquote {
            margin: 14px 0;
            padding: 10px 18px;
            border-left: 4px solid var(--brand);
            background: var(--brand-soft);
            border-radius: 0 10px 10px 0
        }

        .md img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #fff
        }

        .imgwrap {
            position: relative;
            display: inline-block;
            max-width: 100%
        }

        .imgwrap .expand {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 32px;
            height: 32px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: rgba(255, 255, 255, .92);
            color: #334155;
            font-size: 17px;
            line-height: 1;
            cursor: pointer;
            opacity: .75;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .2);
            transition: opacity .15s
        }

        .imgwrap:hover .expand, .imgwrap .expand:focus {
            opacity: 1
        }

        #imgmodal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            background: rgba(10, 12, 20, .88);
            overflow: auto;
            padding: 56px 16px 24px;
            text-align: center
        }

        #imgmodal.open {
            display: block
        }

        #imgmodal img {
            max-width: 100%;
            height: auto;
            background: #fff;
            border-radius: 8px;
            cursor: zoom-in
        }

        #imgmodal.full img {
            max-width: none;
            cursor: zoom-out
        }

        #imgmodal .close {
            position: fixed;
            top: 12px;
            right: 16px;
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 8px;
            background: rgba(255, 255, 255, .2);
            color: #fff;
            font-size: 20px;
            cursor: pointer
        }

        #imgmodal .close:hover {
            background: rgba(255, 255, 255, .35)
        }

        #imgmodal .hint {
            position: fixed;
            top: 20px;
            left: 16px;
            color: #cbd5e1;
            font-size: 13px
        }

        .md hr {
            border: 0;
            border-top: 1px solid var(--border);
            margin: 28px 0
        }

        .md strong {
            color: var(--text)
        }

        .md .hl {
            background: #fde68a;
            color: #000;
            border-radius: 3px
        }

        /* ===== home ===== */
        .hero {
            background: linear-gradient(135deg, #1e1b4b, #4f46e5 55%, #7c3aed);
            color: #fff;
            border-radius: 22px;
            padding: 40px 40px 34px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden
        }

        .hero:after {
            content: "";
            position: absolute;
            right: -60px;
            top: -60px;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .08)
        }

        .hero h1 {
            margin: 0 0 8px;
            font-size: 34px;
            letter-spacing: -.6px
        }

        .hero p {
            margin: 0;
            max-width: 620px;
            opacity: .9;
            font-size: 16px
        }

        .cta {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap
        }

        .btn {
            border: 0;
            border-radius: 11px;
            padding: 11px 20px;
            font-weight: 700;
            font-size: 14px
        }

        .btn.primary {
            background: #fff;
            color: #4338ca
        }

        .btn.ghost {
            background: rgba(255, 255, 255, .16);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, .3)
        }

        .stats {
            display: grid;
            grid-template-columns:repeat(auto-fit, minmax(135px, 1fr));
            gap: 14px;
            margin: 22px 0
        }

        .stat {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 18px;
            box-shadow: var(--shadow)
        }

        .stat b {
            font-size: 26px;
            display: block;
            letter-spacing: -.5px
        }

        .stat span {
            color: var(--muted);
            font-size: 13px
        }

        .sec {
            margin: 34px 0 14px;
            font-size: 20px;
            letter-spacing: -.3px
        }

        .sub {
            color: var(--muted);
            margin: -8px 0 16px
        }

        .grid {
            display: grid;
            grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
            gap: 14px
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 18px;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: .15s;
            position: relative
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: var(--brand)
        }

        .card .n {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            background: var(--brand-soft);
            color: var(--brand);
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 13px;
            margin-bottom: 10px
        }

        .card h3 {
            margin: 0 0 4px;
            font-size: 16px
        }

        .card p {
            margin: 0;
            font-size: 13px;
            color: var(--muted)
        }

        .card .tag {
            position: absolute;
            top: 14px;
            right: 14px;
            font-size: 11px;
            color: var(--ok);
            font-weight: 700
        }

        .card.extra {
            opacity: .78
        }

        .domain {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 14px;

<script id="data" type="application/json">{"modules": [{"id": "1", "folder": "1.broker", "title": "Broker", "desc": "Brokers, replication, ISR, retention, KRaft, request lifecycle", "kind": "core", "html": "<h1>Kafka Broker Overview<\/h1>\n<blockquote>\n<p><strong>Updated for Apache Kafka 4.2 (KRaft mode only)<\/strong>\nSource: kafka.apache.org/42 | Kafka: The Definitive Guide 2nd Edition<\/p>\n<p>⚠️ ZooKeeper has been completely removed in Kafka 4.0+. Only KRaft mode is supported.<\/p>\n<\/blockquote>\n<hr />\n<h2>What Is a Kafka Broker?<\/h2>\n<p>A Kafka Broker is a server in a Kafka cluster that hosts topic partitions and processes client read/write requests. Brokers are responsible for storing published data according to configured retention policies. Together, brokers form a scalable, fault-tolerant distributed system.<\/p>\n<p>In <strong>Kafka 4.2 (KRaft mode)<\/strong>, each server node can play one or more roles defined by <code>process.roles<\/code>:<\/p>\n<ul>\n<li><code>broker<\/code> — handles client produce/consume requests and stores data<\/li>\n<li><code>controller<\/code> — manages cluster metadata, leader election, and broker registration<\/li>\n<li><code>broker,controller<\/code> — combined mode (development only, NOT recommended for production)<\/li>\n<\/ul>\n<hr />\n<h2>Essential Broker Configurations (Kafka 4.2 / KRaft)<\/h2>\n<p><strong>Source:<\/strong> kafka.apache.org/42/configuration/broker-configs/<\/p>\n<p>The following configurations are <strong>required<\/strong> in KRaft mode:<\/p>\n<table>\n<thead>\n<tr>\n<th>Configuration<\/th>\n<th>Description<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>node.id<\/code><\/td>\n<td>Unique integer ID for this broker/controller node. Replaces <code>broker.id<\/code>.<\/td>\n<\/tr>\n<tr>\n<td><code>process.roles<\/code><\/td>\n<td>Roles for this node: <code>broker<\/code>, <code>controller<\/code>, or <code>broker,controller<\/code>.<\/td>\n<\/tr>\n<tr>\n<td><code>log.dirs<\/code><\/td>\n<td>Directories where log data is stored.<\/td>\n<\/tr>\n<tr>\n<td><code>controller.quorum.bootstrap.servers<\/code><\/td>\n<td>List of controller nodes for the KRaft quorum.<\/td>\n<\/tr>\n<tr>\n<td><code>controller.listener.names<\/code><\/td>\n<td>Listener names used by the controller quorum.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Important Broker Properties<\/h2>\n<h3><code>default.replication.factor<\/code><\/h3>\n<ul>\n<li><strong>Default<\/strong>: 1 (recommended: ≥ 3 in production)<\/li>\n<li><strong>Description<\/strong>: Default number of replicas for automatically created topics.<\/li>\n<li><strong>Trade-offs<\/strong>: Higher replication increases fault tolerance but adds network and storage overhead.<\/li>\n<li><strong>Recommendation<\/strong>: Always set ≥ 3 in production. Never exceed the number of brokers.<\/li>\n<\/ul>\n<h3><code>num.partitions<\/code><\/h3>\n<ul>\n<li><strong>Default<\/strong>: 1<\/li>\n<li><strong>Description<\/strong>: Default number of partitions per topic when auto-created.<\/li>\n<li><strong>Trade-offs<\/strong>: More partitions = higher parallelism, but increases controller and client metadata overhead.<\/li>\n<li><strong>Note<\/strong>: ⚠️ &quot;Too many partitions can increase overhead on broker performance&quot; — NOT ZooKeeper (removed in Kafka 4.x).<\/li>\n<\/ul>\n<h3><code>min.insync.replicas<\/code><\/h3>\n<ul>\n<li><strong>Default<\/strong>: 1<\/li>\n<li><strong>Description<\/strong>: Minimum number of in-sync replicas that must acknowledge a write when <code>acks=all<\/code>.<\/li>\n<li><strong>Trade-offs<\/strong>: Higher value increases durability but may impact write latency.<\/li>\n<li><strong>Recommendation<\/strong>: Set to 2 for production. Combine with <code>acks=all<\/code> and <code>replication.factor=3<\/code>.<\/li>\n<\/ul>\n<h3><code>unclean.leader.election.enable<\/code><\/h3>\n<ul>\n<li><strong>Default<\/strong>: false<\/li>\n<li><strong>Description<\/strong>: Allows an out-of-sync replica to become leader when no ISR members are available.<\/li>\n<li><strong>Trade-offs<\/strong>: <code>true<\/code> increases availability but risks <strong>data loss<\/strong>. <code>false<\/code> prioritizes consistency.<\/li>\n<li><strong>Recommendation<\/strong>: Keep <code>false<\/code> in production. Use only as emergency recovery measure.<\/li>\n<\/ul>\n<h3><code>num.replication.fetchers<\/code><\/h3>\n<ul>\n<li><strong>Default<\/strong>: 1<\/li>\n<li><strong>Description<\/strong>: Number of threads used by follower replicas to fetch data from the leader.<\/li>\n<li><strong>Trade-offs<\/strong>: Increasing improves replication throughput at the cost of higher CPU usage.<\/li>\n<\/ul>\n<h3><code>replica.fetch.max.bytes<\/code><\/h3>\n<ul>\n<li><strong>Default<\/strong>: 1048576 (1 MB)<\/li>\n<li><strong>Description<\/strong>: Maximum bytes a replica fetches from the leader in a single request.<\/li>\n<li><strong>Trade-offs<\/strong>: Larger values improve replication throughput but increase memory usage.<\/li>\n<\/ul>\n<h3><code>advertised.listeners<\/code><\/h3>\n<ul>\n<li><strong>Default<\/strong>: Depends on setup<\/li>\n<li><strong>Description<\/strong>: Hostname and port the broker advertises to producers, consumers, and other brokers. In KRaft mode, addresses are published to and managed by the controller.<\/li>\n<li><strong>Trade-offs<\/strong>: Must be set correctly — clients use this to connect. Critical in cloud/NAT environments.<\/li>\n<\/ul>\n<h3><code>log.dirs<\/code><\/h3>\n<ul>\n<li><strong>Default<\/strong>: <code>/tmp/kafka-logs<\/code><\/li>\n<li><strong>Description<\/strong>: Directories where partition log data is stored. Multiple directories spread I/O across disks.<\/li>\n<li><strong>Trade-offs<\/strong>: Adequate disk space and I/O performance are critical. New partitions assigned round-robin across configured directories.<\/li>\n<\/ul>\n<h3><code>auto.create.topics.enable<\/code><\/h3>\n<ul>\n<li><strong>Default<\/strong>: true<\/li>\n<li><strong>Description<\/strong>: Allows automatic topic creation when a producer/consumer accesses a non-existent topic.<\/li>\n<li><strong>Trade-offs<\/strong>: Convenient for development but may lead to unintentional topic creation in production.<\/li>\n<li><strong>Note<\/strong>: Original summary used <code>auto.create.topic.enable<\/code> — correct property name is <code>auto.create.topics.enable<\/code>.<\/li>\n<\/ul>\n<h3><code>log.retention.hours<\/code> / <code>log.retention.bytes<\/code> / <code>log.segment.bytes<\/code><\/h3>\n<ul>\n<li><strong>Defaults<\/strong>: 168 hours (7 days) / -1 (unlimited) / 1073741824 (1 GB)<\/li>\n<li><strong>Description<\/strong>: Control retention policy by time, size, and segment size respectively.<\/li>\n<li><strong>Priority<\/strong>: <code>log.retention.ms<\/code> &gt; <code>log.retention.minutes<\/code> &gt; <code>log.retention.hours<\/code><\/li>\n<li><strong>Trade-offs<\/strong>: Balance between disk usage and data availability.<\/li>\n<\/ul>\n<h3><code>log.retention.check.interval.ms<\/code><\/h3>\n<ul>\n<li><strong>Default<\/strong>: 300000 (5 minutes)<\/li>\n<li><strong>Description<\/strong>: Frequency at which the log cleaner checks for segments eligible for deletion.<\/li>\n<li><strong>Trade-offs<\/strong>: More frequent checks improve timeliness of cleanup at a slight CPU cost.<\/li>\n<\/ul>\n<h3><code>broker.session.timeout.ms<\/code><\/h3>\n<ul>\n<li><strong>Default<\/strong>: 18000 ms (18 seconds) — increased from 6s in Kafka 2.5+<\/li>\n<li><strong>Description<\/strong>: In KRaft mode, the time before the controller considers a broker offline if no heartbeat is received.<\/li>\n<li><strong>Trade-offs<\/strong>: Higher value reduces false positives (GC pauses, network blips) but increases detection latency.<\/li>\n<\/ul>\n<h3><code>log.flush.interval.messages<\/code> / <code>log.flush.interval.ms<\/code><\/h3>\n<ul>\n<li><strong>Defaults<\/strong>: Long.MAX_VALUE / null<\/li>\n<li><strong>Description<\/strong>: Control frequency of fsync to disk by message count or time interval.<\/li>\n<li><strong>Trade-offs<\/strong>: Lower values increase durability but <strong>severely impact performance<\/strong>.<\/li>\n<li><strong>Recommendation<\/strong>: ⚠️ Do NOT configure these. Rely on <strong>replication<\/strong> (<code>acks=all<\/code>, <code>min.insync.replicas=2<\/code>) for durability. Let the OS manage page cache flushing.<\/li>\n<\/ul>\n<hr />\n<h2>Partition Management<\/h2>\n<ul>\n<li><strong>Basics<\/strong>: A Kafka topic is divided into one or more partitions distributed across brokers.<\/li>\n<li><strong>Replication Factor<\/strong>: Each partition has N replicas. One is the leader, the rest are followers.<\/li>\n<li><strong>Immutability and Ordering<\/strong>: Data written to a partition is immutable. Kafka guarantees <strong>order within a partition<\/strong> but NOT across partitions.<\/li>\n<li><strong>Partition count<\/strong>: Can only be <strong>increased<\/strong>, never decreased.<\/li>\n<li><strong>Preferred Replica<\/strong>: The first replica in the replica list is the &quot;preferred leader&quot;. Kafka attempts to restore leadership to preferred replicas (<code>auto.leader.rebalance.enable=true<\/code>).<\/li>\n<\/ul>\n<hr />\n<h2>Segment Management<\/h2>\n<ul>\n<li><strong>Partition Segments<\/strong>: Partitions are subdivided into segment files (log files) stored on disk.<\/li>\n<li><strong>Segment Size and Roll<\/strong>: Controlled by <code>log.segment.bytes<\/code> (default: 1 GB) and <code>log.roll.ms<\/code>/<code>log.roll.hours<\/code>.<\/li>\n<li><strong>Active Segment<\/strong>: The segment currently being written to. It is <strong>never deleted<\/strong> — even if retention policy applies.<\/li>\n<li><strong>Indexes<\/strong>: Each segment has an offset index and a timestamp index for efficient message lookup.<\/li>\n<\/ul>\n<pre><code>Implication for retention:\n  log.retention.ms = 7 days\n  Topic receives 100 MB/day → segment fills in ~10 days\n  Actual retention ≈ 17 days (10 days to fill + 7 days retention)\n  because retention only applies to CLOSED segments!\n<\/code><\/pre>\n<hr />\n<h2>Log Retention and Cleanup<\/h2>\n<h3>Retention Policies<\/h3>\n<table>\n<thead>\n<tr>\n<th>Policy<\/th>\n<th>Description<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>delete<\/code> (default)<\/td>\n<td>Removes old segments when time or size limit is reached.<\/td>\n<\/tr>\n<tr>\n<td><code>compact<\/code><\/td>\n<td>Retains only the latest value per key. Uses tombstone records (null value) to delete keys.<\/td>\n<\/tr>\n<tr>\n<td><code>compact,delete<\/code><\/td>\n<td>Combines both: compacts retained segments AND deletes segments past retention limit.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Retention Configuration Hierarchy (time-based)<\/h3>\n<pre><code>log.retention.ms       → highest priority (null by default)\n    ↓ if null\nlog.retention.minutes  → secondary (null by default)\n    ↓ if null\nlog.retention.hours    → tertiary (default: 168 = 7 days)\n<\/code><\/pre>\n<hr />\n<h2>Topic Replication<\/h2>\n<ul>\n<li><strong>Leader and ISR<\/strong>: One replica is the leader (handles all reads/writes). Others are In-Sync Replicas (ISR).<\/li>\n<li><strong>Eligible Leader Replicas (ELR)<\/strong>: New in Kafka 4.0+ — replicas not in ISR but safe to elect as leader without data loss. Tracked by the KRaft controller.<\/li>\n<li><strong>Out-of-sync<\/strong>: A replica is removed from ISR if it doesn't fetch from the leader within <code>replica.lag.time.max.ms<\/code> (default: 30 seconds).<\/li>\n<li><strong>Replication factor<\/strong> should not exceed the number of brokers.<\/li>\n<\/ul>\n<h3>Epochs (fencing stale state)<\/h3>\n<p>Kafka uses several monotonically increasing numbers called <em>epochs<\/em> to reject requests from &quot;zombies&quot; — nodes that still act on outdated state.<\/p>\n<table>\n<thead>\n<tr>\n<th>Epoch<\/th>\n<th>Scope<\/th>\n<th>Incremented when<\/th>\n<th>Used for<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Broker epoch<\/strong><\/td>\n<td>One broker registration<\/td>\n<td>A broker (re)registers with the controller (start, restart, session expiry)<\/td>\n<td>Controller ignores requests from an <strong>old incarnation<\/strong> of a broker<\/td>\n<\/tr>\n<tr>\n<td><strong>Leader epoch<\/strong><\/td>\n<td>One partition<\/td>\n<td>A new partition leader is elected<\/td>\n<td>Fences stale leaders. Follower log truncation after failover<\/td>\n<\/tr>\n<tr>\n<td><strong>Controller / quorum epoch<\/strong><\/td>\n<td>Whole cluster<\/td>\n<td>A new active KRaft controller is elected<\/td>\n<td>Fences a stale (deposed) controller<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Broker epoch — what it is for<\/strong><\/p>\n<ul>\n<li>Assigned by the <strong>controller<\/strong> each time a broker registers. In KRaft it is the <strong>metadata log offset<\/strong> of that broker's <code>RegisterBrokerRecord<\/code> (in old ZooKeeper clusters it was the zxid of the broker's ephemeral znode), so a restarted broker always gets a <strong>higher<\/strong> epoch.<\/li>\n<li>The broker sends its epoch in controller-bound requests (heartbeat, <code>AlterPartition<\/code>, ...) and the controller includes the target broker's epoch in requests it sends (<code>LeaderAndIsr<\/code>, <code>UpdateMetadata<\/code>, <code>StopReplica<\/code>).<\/li>\n<li>If the epoch in a request is <strong>lower than the current one<\/strong>, it is rejected with <code>STALE_BROKER_EPOCH<\/code>. This prevents a broker that was restarted, partitioned or paused (long GC) from applying or sending outdated leadership / ISR changes after the cluster has moved on.<\/li>\n<li>It is internal bookkeeping: it is not a configuration and clients never see it.<\/li>\n<\/ul>\n<p><strong>Leader epoch — related, more exam-relevant<\/strong><\/p>\n<ul>\n<li>Stored in every record batch and in each log's <code>leader-epoch-checkpoint<\/code> file (<code>epoch → first offset of that epoch<\/code>).<\/li>\n<li>When a follower restarts or a leader changes, the follower asks the new leader for the end offset of its last known epoch (<code>OffsetForLeaderEpoch<\/code>) and <strong>truncates diverging records<\/strong> — this is more reliable than using the high watermark alone, which could cause log divergence or data loss.<\/li>\n<li>Requests carrying an older leader epoch get <code>FENCED_LEADER_EPOCH<\/code>. Consumers also use it to detect stale metadata.<\/li>\n<\/ul>\n<blockquote>\n<p>💡 <strong>Remember:<\/strong> epochs only go up. A higher epoch always wins. Requests with a lower epoch are fenced (rejected).<\/p>\n<\/blockquote>\n<hr />\n<h2>Producer Considerations<\/h2>\n<ul>\n<li><strong><code>acks<\/code><\/strong>: Controls durability guarantee.\n<ul>\n<li><code>acks=0<\/code> — No acknowledgment (fastest, highest risk of loss)<\/li>\n<li><code>acks=1<\/code> — Leader acknowledges (default before 3.0, risk of loss on leader crash)<\/li>\n<li><code>acks=all<\/code> — All ISR replicas acknowledge (safest, use with <code>min.insync.replicas=2<\/code>)<\/li>\n<\/ul>\n<\/li>\n<li><strong><code>message.max.bytes<\/code><\/strong>: Maximum message size (default: 1 MB). Must be coordinated with <code>fetch.max.bytes<\/code> on consumers and <code>replica.fetch.max.bytes<\/code> on brokers.<\/li>\n<li><strong>Message Keys<\/strong>: Same key always routes to the same partition (with default or custom partitioner), enabling ordering by key <strong>as long as partition count does not change<\/strong>.<\/li>\n<li><strong>Idempotent Producer<\/strong>: <code>enable.idempotence=true<\/code> prevents duplicate messages caused by retries (requires <code>acks=all<\/code>, <code>max.in.flight.requests.per.connection ≤ 5<\/code>).<\/li>\n<li><strong>Compression<\/strong>: Set on producer (<code>compression.type=snappy/lz4/zstd/gzip<\/code>). Broker stores AS-IS (zero-copy). Consumer decompresses <strong>automatically<\/strong> — no consumer-side configuration needed.<\/li>\n<\/ul>\n<hr />\n<h2>Consumer Considerations<\/h2>\n<ul>\n<li><strong>Offsets<\/strong>: Consumers track progress via offsets committed to <code>__consumer_offsets<\/code> topic.<\/li>\n<li><strong>Consumer Groups<\/strong>: Created <strong>automatically<\/strong> when a consumer first joins (no CLI command to create them).<\/li>\n<li><strong><code>auto.offset.reset<\/code><\/strong>: Controls behavior when no committed offset exists:\n<ul>\n<li><code>earliest<\/code> — start from oldest available offset<\/li>\n<li><code>latest<\/code> — start from newest offset (default)<\/li>\n<li><code>none<\/code> — throw <code>NoOffsetForPartitionException<\/code><\/li>\n<\/ul>\n<\/li>\n<li><strong>Partition Assignment<\/strong>: Kafka automatically assigns partitions to consumers in a group. One partition → one consumer (never shared within a group). Max active consumers = number of partitions.<\/li>\n<\/ul>\n<hr />\n<h2>Broker Performance Tuning<\/h2>\n<h3>Thread Configuration<\/h3>\n<table>\n<thead>\n<tr>\n<th>Parameter<\/th>\n<th>Default<\/th>\n<th>Description<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>num.network.threads<\/code><\/td>\n<td>3<\/td>\n<td>Threads for network I/O (reading requests, sending responses).<\/td>\n<\/tr>\n<tr>\n<td><code>num.io.threads<\/code><\/td>\n<td>8<\/td>\n<td>Threads for processing requests (disk reads/writes). Should equal CPU count.<\/td>\n<\/tr>\n<tr>\n<td><code>num.replication.fetchers<\/code><\/td>\n<td>1<\/td>\n<td>Threads for replica fetching.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Key Performance Metrics<\/h3>\n<ul>\n<li><strong><code>RequestHandlerAvgIdlePercent<\/code><\/strong>: &lt; 20% = potential problem, &lt; 10% = active problem.<\/li>\n<li><strong><code>NetworkProcessorAvgIdlePercent<\/code><\/strong>: Indicates network thread saturation.<\/li>\n<\/ul>\n<h3>Log Flush — Important Warning<\/h3>\n<pre><code>❌ DO NOT set log.flush.interval.messages or log.flush.interval.ms\n   manually in production!\n\n✅ Instead, rely on:\n   - acks=all\n   - min.insync.replicas=2\n   - replication.factor=3\n   - OS page cache (Linux manages this efficiently)\n<\/code><\/pre>\n<hr />\n<h2>Zero Copy<\/h2>\n<p>Kafka achieves high-throughput message delivery using the <strong>Zero Copy<\/strong> principle:<\/p>\n<ul>\n<li>Data is transferred directly from the filesystem (page cache) to the socket buffer.<\/li>\n<li>Eliminates intermediate CPU copies — significantly reduces CPU usage and latency.<\/li>\n<\/ul>\n<p><strong>⚠️ Zero Copy is disabled when SSL is enabled:<\/strong><\/p>\n<ul>\n<li>With SSL, the broker must decrypt incoming data and re-encrypt outgoing data.<\/li>\n<li>This reintroduces intermediate data copies and increases CPU usage (up to 20-30% overhead).<\/li>\n<li>Implication: SSL listeners have higher CPU requirements than PLAINTEXT listeners.<\/li>\n<\/ul>\n<hr />\n<h2>Security Configurations<\/h2>\n<ul>\n<li><strong>Encryption<\/strong>: SSL/TLS (<code>SASL_SSL<\/code> or <code>SSL<\/code> security protocol) encrypts data in transit.<\/li>\n<li><strong>Authentication<\/strong>: SASL supports <code>GSSAPI<\/code> (Kerberos), <code>PLAIN<\/code>, <code>SCRAM-SHA-256/512<\/code>, <code>OAUTHBEARER<\/code>.<\/li>\n<li><strong>Authorization<\/strong>: ACLs managed by <code>StandardAuthorizer<\/code> (the KRaft authorizer. <code>AclAuthorizer<\/code> was the ZooKeeper-era class) — fine-grained control over read/write/create/delete operations.<\/li>\n<li><strong>Listeners<\/strong>: Multiple listeners can be configured for different security protocols (internal PLAINTEXT, external SASL_SSL).<\/li>\n<\/ul>\n<pre><code class=\"language-properties\"># Example multi-listener setup\nlisteners=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093\nlistener.security.protocol.map=INTERNAL:PLAINTEXT,EXTERNAL:SASL_SSL\ninter.broker.listener.name=INTERNAL\nadvertised.listeners=INTERNAL://broker1.internal:9092,EXTERNAL://broker1.example.com:9093\n<\/code><\/pre>\n<pre><code># ─────────────────────────────────────────────────────────────\n# WHERE the broker BINDS (what it listens on locally)\n# Format: NAME://host:port  (0.0.0.0 = all network interfaces)\n# ─────────────────────────────────────────────────────────────\nlisteners=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093\n#          │                │       │                │\n#          │                │       │                └─ binds port 9093 on all NICs\n#          │                │       └─ second listener named EXTERNAL\n#          │                └─ binds port 9092 on all NICs\n#          └─ first listener named INTERNAL\n#\n# The broker opens TWO server sockets.\n# Names (INTERNAL, EXTERNAL) are arbitrary — they're just labels.\n\n# ─────────────────────────────────────────────────────────────\n# WHAT SECURITY PROTOCOL each listener uses\n# ─────────────────────────────────────────────────────────────\nlistener.security.protocol.map=INTERNAL:PLAINTEXT,EXTERNAL:SASL_SSL\n#                               │         │         │        │\n#                               │         │         │        └─ EXTERNAL uses TLS + SASL auth\n#                               │         │         └─ second mapping\n#                               │         └─ INTERNAL uses plain TCP, no auth\n#                               └─ first mapping\n#\n# PLAINTEXT  = no encryption, no auth  (safe only on private/trusted networks)\n# SASL_SSL   = TLS encryption + SASL authentication (PLAIN, SCRAM, GSSAPI etc.)\n# Other options: SSL (TLS only, no SASL), SASL_PLAINTEXT (SASL but no TLS)\n\n# ─────────────────────────────────────────────────────────────\n# WHICH listener brokers use to talk TO EACH OTHER\n# ─────────────────────────────────────────────────────────────\ninter.broker.listener.name=INTERNAL\n#\n# Broker-to-broker replication (follower fetches from leader) uses\n# the INTERNAL listener → plain TCP on port 9092.\n# This avoids the overhead of TLS + SASL for trusted internal traffic.\n# Must be one of the names defined in listeners above.\n\n# ─────────────────────────────────────────────────────────────\n# WHAT ADDRESS the broker ADVERTISES to clients (via metadata)\n# This is what clients actually connect to — NOT 0.0.0.0\n# ─────────────────────────────────────────────────────────────\nadvertised.listeners=INTERNAL://broker1.internal:9092,EXTERNAL://broker1.example.com:9093\n#                    │          │                  │    │          │                   │\n#                    │          │                  │    │          │                   └─ public DNS, port 9093\n#                    │          │                  │    │          └─ resolvable from internet/external clients\n#                    │          │                  │    └─ external clients use this address\n#                    │          │                  └─ internal DNS, port 9092\n#                    │          └─ resolvable only within the internal network\n#                    └─ internal clients / other brokers use this address\n#\n# When a client connects to ANY broker and asks for metadata,\n# the broker returns advertised.listeners — the client then\n# connects DIRECTLY to those addresses for produce/fetch.\n# 0.0.0.0 must NEVER appear here — clients can't connect to 0.0.0.0.\n<\/code><\/pre>\n<hr />\n<h2>Monitoring and Management<\/h2>\n<h3>Key JMX Metrics<\/h3>\n<table>\n<thead>\n<tr>\n<th>Broker Metric<\/th>\n<th>Description<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>ActiveControllerCount<\/code><\/td>\n<td>Must be exactly 1 across the cluster. 0 = no controller (critical!), 2 = split-brain (critical!).<\/td>\n<\/tr>\n<tr>\n<td><code>RequestHandlerAvgIdlePercent<\/code><\/td>\n<td>% of time request handler threads are idle. &lt;20% = warning, &lt;10% = critical.<\/td>\n<\/tr>\n<tr>\n<td><code>UnderReplicatedPartitions<\/code><\/td>\n<td>Partitions where followers are behind the leader. Should be 0 in healthy clusters.<\/td>\n<\/tr>\n<tr>\n<td><code>OfflinePartitionsCount<\/code><\/td>\n<td>Partitions without an active leader. Should always be 0.<\/td>\n<\/tr>\n<tr>\n<td><code>BytesInPerSec<\/code><\/td>\n<td>Incoming byte rate — used for capacity planning.<\/td>\n<\/tr>\n<tr>\n<td><code>BytesOutPerSec<\/code><\/td>\n<td>Outgoing byte rate — includes replication traffic.<\/td>\n<\/tr>\n<tr>\n<td><code>MessagesInPerSec<\/code><\/td>\n<td>Incoming message rate.<\/td>\n<\/tr>\n<tr>\n<td><code>PartitionCount<\/code><\/td>\n<td>Number of partitions assigned to broker. Should be evenly distributed.<\/td>\n<\/tr>\n<tr>\n<td><code>LeaderCount<\/code><\/td>\n<td>Number of partitions where broker is leader. Should be ~equal across brokers.<\/td>\n<\/tr>\n<tr>\n<td><code>ControllerEventQueueSize<\/code><\/td>\n<td>Size of controller event queue. Sustained high value = controller stuck.<\/td>\n<\/tr>\n<tr>\n<td><code>RequestsPerSec<\/code><\/td>\n<td>Request rate per type (Produce, Fetch, Metadata, etc.).<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Log and Disk Monitoring<\/h3>\n<ul>\n<li>Monitor <code>UnderReplicatedPartitions<\/code> — fluctuating values indicate performance issues. Stable non-zero = broker offline.<\/li>\n<li>Monitor disk usage — Kafka does NOT stop writing when disk is full — it crashes!<\/li>\n<li>Monitor <code>log.dirs<\/code> for I/O wait time.<\/li>\n<\/ul>\n<hr />\n<h2>High Availability Considerations (KRaft)<\/h2>\n<p><strong>Source:<\/strong> kafka.apache.org/42/operations/kraft/<\/p>\n<ul>\n<li><strong>KRaft Controller Quorum<\/strong>: Replaces ZooKeeper entirely. Requires 3 or 5 controller nodes for fault tolerance.\n<ul>\n<li>3 controllers → tolerates 1 controller failure<\/li>\n<li>5 controllers → tolerates 2 controller failures<\/li>\n<\/ul>\n<\/li>\n<li><strong>Metadata Storage<\/strong>: Cluster metadata persisted in <code>__cluster_metadata<\/code> topic on controller nodes' local disk (<code>metadata.log.dir<\/code>).<\/li>\n<li><strong>Broker Metadata Cache<\/strong>: Brokers maintain an <strong>in-memory<\/strong> metadata cache refreshed from the controller via <code>MetadataFetch API<\/code>. NOT persisted on broker disk.<\/li>\n<li><strong>Broker Session<\/strong>: Brokers maintain active session with controller via heartbeats (<code>broker.session.timeout.ms=18s<\/code>).<\/li>\n<\/ul>\n<pre><code>❌ REMOVED from Kafka 4.x:\n   - ZooKeeper dependency\n   - --zookeeper flag in CLI tools\n   - zookeeper.connect broker configuration\n\n✅ REPLACED by KRaft:\n   - controller.quorum.bootstrap.servers\n   - process.roles\n   - node.id\n   - metadata.log.dir\n<\/code><\/pre>\n<hr />\n<h2>Points to Remember for CCDAK<\/h2>\n<pre><code>1. Kafka 4.2 = KRaft ONLY — ZooKeeper completely removed!\n\n2. Essential KRaft configs:\n   node.id, process.roles, log.dirs,\n   controller.quorum.bootstrap.servers\n\n3. Durability formula for production:\n   replication.factor=3\n   min.insync.replicas=2\n   acks=all (producer)\n\n4. unclean.leader.election.enable=false (default)\n   → Consistency over availability\n   → Data loss risk if set to true!\n\n5. Zero Copy disabled with SSL\n   → Higher CPU overhead with encrypted listeners\n\n6. Partition count:\n   → Can only INCREASE, never decrease\n   → Increasing changes key→partition mapping!\n\n7. Active segment is NEVER deleted\n   → Actual retention &gt; configured retention.ms\n     when topic has low throughput\n\n8. Consumer groups created AUTOMATICALLY\n   → No CLI command to create them\n\n9. Compression:\n   → Set on PRODUCER only\n   → Consumer decompresses AUTOMATICALLY\n   → No consumer-side compression config needed\n\n10. log.flush settings:\n    → Do NOT configure in production\n    → Rely on replication for durability\n<\/code><\/pre>\n<h2>Resource Hierarchy (CCDAK)<\/h2>\n<pre><code>Cluster\n ├── Broker (node; in KRaft: broker and/or controller role)\n │    └── hosts partition replicas\n ├── Topic  (logical name, config overrides, ACL resource)\n │    └── Partition  (ordered, immutable log; unit of parallelism)\n │         ├── Replicas (1 leader + followers; ISR = in-sync subset)\n │         └── Segments (files on disk: .log, .index, .timeindex; one active segment)\n │              └── Records (offset, timestamp, key, value, headers)\n └── Consumer Group (tracked by group coordinator. Committed offsets stored in __consumer_offsets)\n<\/code><\/pre>\n<ul>\n<li><strong>Topic<\/strong> = logical <strong>partition<\/strong> = physical unit of ordering, parallelism and replication <strong>segment<\/strong> = unit of retention/deletion (only closed segments are deleted/compacted).<\/li>\n<li>A partition lives on one broker as leader. Each replica is a full copy on a different broker.<\/li>\n<li>ACL resource types: Cluster, Topic, Group, TransactionalId, DelegationToken.<\/li>\n<li>Offsets are unique <strong>per partition<\/strong>, not per topic.<\/li>\n<\/ul>\n<h2>Request Lifecycle in Kafka (CCDAK)<\/h2>\n<ol>\n<li>Client finds the partition leader via a <strong>Metadata request<\/strong> (any broker answers) and caches the metadata. A <code>NOT_LEADER_OR_FOLLOWER<\/code> error triggers a metadata refresh.<\/li>\n<li>Client sends a Produce/Fetch request <strong>to the partition leader<\/strong> over TCP.<\/li>\n<li>A broker <strong>network (acceptor/processor) thread<\/strong> reads the request and puts it on the <strong>request queue<\/strong>.<\/li>\n<li>An <strong>I/O (request handler) thread<\/strong> takes it from the queue, validates it, and:\n<ul>\n<li><strong>Produce<\/strong>: appends to the leader's log (page cache). With <code>acks=all<\/code> the request waits in <strong>purgatory<\/strong> until all ISR replicas have replicated it (<code>min.insync.replicas<\/code> enforced) or it times out.<\/li>\n<li><strong>Fetch<\/strong>: reads from the log (zero-copy <code>sendfile<\/code>). If less than <code>fetch.min.bytes<\/code> is available the request waits in purgatory up to <code>fetch.max.wait.ms<\/code>.<\/li>\n<\/ul>\n<\/li>\n<li>The response is placed on the <strong>response queue<\/strong> and the network thread sends it to the client.<\/li>\n<\/ol>\n<ul>\n<li>Consumers (default) fetch only from the leader. Followers fetch from the leader like consumers. With <code>client.rack<\/code> + <code>replica.selector.class<\/code> consumers can fetch from the closest follower (KIP-392).<\/li>\n<li>Consumers only see records up to the <strong>high watermark<\/strong> (replicated to all ISR). With <code>read_committed<\/code> only up to the Last Stable Offset.<\/li>\n<li>Thread pools: <code>num.network.threads<\/code> (network), <code>num.io.threads<\/code> (request handlers).<\/li>\n<\/ul>\n<img src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxOTYwIiBoZWlnaHQ9IjMwODAiIHZpZXdCb3g9IjAgMCAxNDAwIDIyMDAiPgogIDxkZWZzPgogICAgPG1hcmtlciBpZD0iYXJyb3ciIG1hcmtlcldpZHRoPSIxMCIgbWFya2VySGVpZ2h0PSI3IiByZWZYPSI5IiByZWZZPSIzLjUiIG9yaWVudD0iYXV0byI+CiAgICAgIDxwb2x5Z29uIHBvaW50cz0iMCAwLCAxMCAzLjUsIDAgNyIgZmlsbD0iIzhiOTQ5ZSIvPgogICAgPC9tYXJrZXI+CiAgICA8bWFya2VyIGlkPSJhcnJvdy1ncmVlbiIgbWFya2VyV2lkdGg9IjEwIiBtYXJrZXJIZWlnaHQ9IjciIHJlZlg9IjkiIHJlZlk9IjMuNSIgb3JpZW50PSJhdXRvIj4KICAgICAgPHBvbHlnb24gcG9pbnRzPSIwIDAsIDEwIDMuNSwgMCA3IiBmaWxsPSIjM2ZiOTUwIi8+CiAgICA8L21hcmtlcj4KICAgIDxtYXJrZXIgaWQ9ImFycm93LWJsdWUiIG1hcmtlcldpZHRoPSIxMCIgbWFya2VySGVpZ2h0PSI3IiByZWZYPSI5IiByZWZZPSIzLjUiIG9yaWVudD0iYXV0byI+CiAgICAgIDxwb2x5Z29uIHBvaW50cz0iMCAwLCAxMCAzLjUsIDAgNyIgZmlsbD0iIzU4YTZmZiIvPgogICAgPC9tYXJrZXI+CiAgICA8c3R5bGU+CiAgICAgIEBmb250LWZhY2UgeyBmb250LWZhbWlseTogJ0pldEJyYWlucyBNb25vJzsgZm9udC13ZWlnaHQ6IDQwMDsgc3JjOiB1cmwoZGF0YTpmb250L3dvZmYyO2Jhc2U2NCxkMDlHTWdBQkFBQUFBR0lzQUJFQUFBQUJBL1FBQUdIS0FBSk4wd0FBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBR2pRYklCeUJqQTRHWUFDQmJnaUJLQW1jREJFSUNvTEFlSUtYQXdFMkFpUURpZ3dMaFFnQUJDQUZoV2dISUF5QlZodFM2eVV5dHlrKzBwdFZOVVQ4MkQ4dUl4RjZIQVNuTEpod1krUTlEaUdtdjAzdy8yY2tIV1BJMEcrZ2FtWTluMUlZSVp1Y1BxS1RmYmJGSE5kT0MxNXJRaVJUeXhoTHJnVGRZZnFzZnhlM3dEV21SYTNkNUNsVjNPem9FVEJlSXg1b3hFQWlrWVJqMmNJZmRmNjMyL1dyejhFUFdaQXMrUWdQaWtBZ nJvdykiLz4KICA8dGV4dCB4PSI3NDUiIHk9IjIxMzMiIGZvbnQtc2l6ZT0iMTIiIGZpbGw9IiM4Yjk0OWUiPkZsb3cgLyBkYXRhIGRpcmVjdGlvbjwvdGV4dD4KCiAgPHRleHQgeD0iMTAwMCIgeT0iMjEyOCIgZm9udC1zaXplPSIxMSIgZmlsbD0iIzhiOTQ5ZSI+S2Fma2EgNC54IC8gS1JhZnQgbW9kZSAgfCAgQ0NEQUsgZXhhbSByZWZlcmVuY2U8L3RleHQ+Cgo8L3N2Zz4K\" alt=\"Kafka request lifecycle\" width=\"1960\" height=\"3080\">", "minutes": 15}, {"id": "2", "folder": "2.consumer", "title": "Consumer", "desc": "Consumer groups, assignors, offsets, rebalancing, delivery semantics", "kind": "core", "html": "<blockquote>\n<p>🚫 = outside the CCDAK exam scope (see exam blueprint)<\/p>\n<\/blockquote>\n<h2>Kafka Consumer Overview<\/h2>\n<p>Kafka Consumers read records from Kafka topics. They can subscribe to one or more topics and process the stream of records produced to them. Consumers are part of consumer groups to ensure scalable and fault-tolerant processing.<\/p>\n<h3>Points to Remember for CCDAK on Consumers<\/h3>\n<ul>\n<li><strong>Consumer Groups<\/strong>: Consumers within the same group divide topic partitions among themselves to ensure balanced processing.<\/li>\n<li><strong>Offset Management<\/strong>: Consumers track their offset per partition to manage their position within the stream.<\/li>\n<li><strong>Rebalance Protocol<\/strong>: Ensures partition ownership is balanced across all consumer instances in a group.<\/li>\n<li><strong>Committed offset<\/strong>: the offset of the <em>next<\/em> record to read (last processed offset + 1).<\/li>\n<li><strong>Fault Tolerance<\/strong>: Consumers can recover from failures, continuing processing from their last committed offset.<\/li>\n<\/ul>\n<p>When a consumer wants to join a group, it sends a JoinGroup request to the group coordinator. The first consumer to join becomes the group leader. The leader receives a list of all consumers in the group from the group coordinator (including those that sent a recent heartbeat and are considered alive) and is responsible for assigning a subset of partitions to each consumer.<\/p>\n<h3>Partition Assignors<\/h3>\n<p>A <code>PartitionAssignor<\/code> is a class that, given consumers and the topics they subscribed to, decides which partitions will be assigned to which consumer. Kafka provides four built-in assignment strategies (<code>partition.assignment.strategy<\/code>). Since Kafka 3.0 the default is <code>[RangeAssignor, CooperativeStickyAssignor]<\/code>:<\/p>\n<h4>1. Range Assignor<\/h4>\n<ul>\n<li><strong>How It Works<\/strong>: Divides the sorted list of partitions into contiguous ranges and assigns each range to a consumer. The assignment is sequential based on the sorted order of consumer IDs.<\/li>\n<li><strong>Key Points<\/strong>: Simple and predictable. However, it can lead to imbalanced workloads if the number of partitions is not a multiple of the number of consumers. It is still the first (primary) default assignor.<\/li>\n<li><strong>Example Scenario<\/strong>: Imagine a topic with 12 partitions (P0 to P11) and 3 consumers (C0, C1, C2). The assignment might look like this:<\/li>\n<\/ul>\n<pre><code>C0: P0, P1, P2, P3   \nC1: P4, P5, P6, P7   \nC2: P8, P9, P10, P11\n<\/code><\/pre>\n<h4>2. Round Robin Assignor<\/h4>\n<ul>\n<li><strong>How It Works<\/strong>: Assigns partitions to consumers in a round-robin fashion across all consumers, ensuring each consumer gets a partition before any consumer gets a second one.<\/li>\n<li><strong>Key Points<\/strong>: Provides better load balancing compared to the Range Assignor, especially when the number of partitions is not evenly divisible by the number of consumers. However, it can lead to rebalancing when consumers are added or removed.<\/li>\n<li><strong>Example Scenario<\/strong>: Using the same topic with 12 partitions (P0 to P11) and 3 consumers (C0, C1, C2), the assignment would be:<\/li>\n<\/ul>\n<pre><code>C0: P0, P3, P6, P9\nC1: P1, P4, P7, P10 \nC2: P2, P5, P8, P11\n<\/code><\/pre>\n<h4>3. Sticky Assignor<\/h4>\n<ul>\n<li><strong>How It Works<\/strong>: Aims to maintain a sticky relationship between consumers and partitions across rebalances, minimizing the number of partitions that get reassigned to different consumers.<\/li>\n<li><strong>Key Points<\/strong>: Reduces the amount of data that needs to be re-fetched when partitions are reassigned. Offers a good balance between fairness and stability. It was introduced in Kafka 0.11 and is not the default (the default list is Range + CooperativeSticky).<\/li>\n<li><strong>Example Scenario<\/strong>: After an initial assignment, if a new consumer (C3) joins, the Sticky Assignor would try to minimize partition movement. It might reassign only a few partitions from the existing consumers to the new one, like this:<\/li>\n<\/ul>\n<pre><code>C0: P0, P3, P6\nC1: P1, P4, P7\nC2: P2, P5, P11\nC3: P8, P9, P10\n<\/code><\/pre>\n<h4>4. Cooperative Sticky Assignor<\/h4>\n<ul>\n<li><strong>How It Works<\/strong>: Similar to the Sticky Assignor but allows for more cooperative rebalancing. It minimizes the impact on consumers by only reassigning partitions that need to be moved instead of revoking all partitions and redistributing them.<\/li>\n<li><strong>Key Points<\/strong>: Designed to reduce the impact of rebalancing, allowing consumers to continue consuming while rebalance is in progress, and reducing the time it takes to complete a rebalance. It was introduced in Kafka 2.4 as an improvement over the Sticky Assignor and, since 3.0, is part of the default assignor list (used after Range, so it takes effect only when Range is removed from the list).<\/li>\n<li><strong>Example Scenario<\/strong>: When a consumer leaves the group, the Cooperative Sticky Assignor would only reassign the partitions that were consumed by the leaving consumer, without affecting the assignments of other consumers. This minimizes the rebalancing impact on the consumer group.<\/li>\n<\/ul>\n<blockquote>\n<p>Kafka 4.0 added the new consumer group protocol (KIP-848, <code>group.protocol=consumer<\/code>): assignment is done on the broker side by the group coordinator (server-side assignors such as <code>uniform<\/code> and <code>range<\/code>), with incremental rebalances. The default is still <code>group.protocol=classic<\/code>, described above.<\/p>\n<\/blockquote>\n<h4>Mnemonic to Remember<\/h4>\n<p><strong>&quot;RRSC&quot; - Round, Range, Sticky, Cooperative<\/strong><\/p>\n<ul>\n<li><strong>Round<\/strong> for <strong>Round Robin<\/strong>: Think of a round table where everyone gets a slice of cake one by one.<\/li>\n<li><strong>Range<\/strong> for <strong>Range Assignor<\/strong>: Imagine dividing a chocolate bar into contiguous pieces where each person gets a range of pieces.<\/li>\n<li><strong>Sticky<\/strong> for <strong>Sticky Assignor<\/strong>: Like sticky notes, once a partition is assigned to a consumer, it tries to &quot;stick&quot; with them across rebalances.<\/li>\n<li><strong>Cooperative<\/strong> for <strong>Cooperative Sticky Assignor<\/strong>: Think of a team project where everyone cooperates, making changes only when necessary, thus minimizing disruption.<\/li>\n<\/ul>\n<h3>Important Consumer Properties<\/h3>\n<h4><code>group.initial.rebalance.delay.ms<\/code> (broker config, not a consumer config)<\/h4>\n<ul>\n<li><strong>Default<\/strong>: 3000 (3 seconds)<\/li>\n<li><strong>Description<\/strong>: Delay time before initial rebalance. A higher value can reduce rebalance storms in large clusters.<\/li>\n<li><strong>Trade-offs<\/strong>: Longer delays may slow initial startup time for consumer groups.<\/li>\n<\/ul>\n<h4><code>max.poll.interval.ms<\/code><\/h4>\n<ul>\n<li><strong>Default<\/strong>: 300000 (5 minutes)<\/li>\n<li><strong>Description<\/strong>: Maximum delay between invocations of poll() when using consumer group management. Exceeding this will cause the consumer to <strong>leave the group<\/strong>.<\/li>\n<li><strong>Trade-offs<\/strong>: Higher values provide more leeway for processing, but risk slower recovery from failures.<\/li>\n<\/ul>\n<h4><code>max.poll.records<\/code><\/h4>\n<ul>\n<li><strong>Default<\/strong>: 500<\/li>\n<li><strong>Description<\/strong>: Maximum number of records returned in a single call to poll().<\/li>\n<li><strong>Trade-offs<\/strong>: Lower values improve latency at the cost of throughput, and vice versa.<\/li>\n<\/ul>\n<h4><code>enable.auto.commit<\/code><\/h4>\n<ul>\n<li><strong>Default<\/strong>: true<\/li>\n<li><strong>Description<\/strong>: If true, offsets are committed automatically at intervals.<\/li>\n<li><strong>Trade-offs<\/strong>: Manual offset control can improve accuracy at the cost of convenience.<\/li>\n<\/ul>\n<h4><code>auto.offset.reset<\/code><\/h4>\n<ul>\n<li><strong>Default<\/strong>: latest<\/li>\n<li><strong>Description<\/strong>: Controls the action when no initial offset is found for a consumer's group. Options are <code>earliest<\/code>, <code>latest<\/code>, or <code>none<\/code> (throws an exception). Kafka 4.0 also adds <code>by_duration:&lt;duration&gt;<\/code>.<\/li>\n<li><strong>Trade-offs<\/strong>: <code>earliest<\/code> may result in more data being processed, <code>latest<\/code> might miss messages if the consumer is down.<\/li>\n<\/ul>\n<pre><code>\n1. Consumer has no committed offset (or offset is out of range)\n\n2. auto.offset.reset=by_duration:PT24H triggers\n\n3. Consumer calculates target timestamp:\n   target = System.currentTimeMillis() - duration\n\n4. Consumer calls:\n   consumer.offsetsForTimes({partition → target_timestamp})\n   → broker looks up offset by timestamp index (.timeindex file)\n\n5. Consumer seeks to that offset\n   → starts consuming from ~24 hours ago\n<\/code><\/pre>\n<h4><code>fetch.min.bytes<\/code><\/h4>\n<ul>\n<li><strong>Default<\/strong>: 1<\/li>\n<li><strong>Description<\/strong>: Minimum data the server should return for a fetch request. Helps in controlling the number of updates.<\/li>\n<li><strong>Trade-offs<\/strong>: Larger values can improve throughput but increase latency.<\/li>\n<\/ul>\n<h4><code>max.partition.fetch.bytes<\/code><\/h4>\n<ul>\n<li><strong>Default<\/strong>: 1048576 (1MB)<\/li>\n<li><strong>Description<\/strong>: Maximum amount of data per partition the server will return.<\/li>\n<li><strong>Trade-offs<\/strong>: Larger values increase throughput but can lead to more memory use.<\/li>\n<\/ul>\n<h4><code>fetch.max.bytes<\/code><\/h4>\n<ul>\n<li><strong>Default<\/strong>: 52428800 (50MB)<\/li>\n<li><strong>Description<\/strong>: Maximum amount of data the server will return for a fetch request across all partitions.<\/li>\n<li><strong>Trade-offs<\/strong>: Higher values allow more data to be fetched in a single request, affecting memory usage.<\/li>\n<\/ul>\n<h4><code>session.timeout.ms<\/code><\/h4>\n<ul>\n<li><strong>Default<\/strong>: 45000 (45 seconds. Was 10 seconds before Kafka 3.0)<\/li>\n<li><strong>Description<\/strong>: Time used to detect consumer failures. If no heartbeat is received within this time, the consumer is considered dead.<\/li>\n<li><strong>Trade-offs<\/strong>: Lower values make detection faster but may cause unnecessary rebalances.<\/li>\n<\/ul>\n<h4><code>heartbeat.interval.ms<\/code><\/h4>\n<ul>\n<li><strong>Default<\/strong>: 3000 (3 seconds)<\/li>\n<li><strong>Description<\/strong>: Expected time between heartbeats to the group coordinator.<\/li>\n<li><strong>Trade-offs<\/strong>: Lower values may lead to more frequent rebalances.<\/li>\n<\/ul>\n<h4><code>isolation.level<\/code><\/h4>\n<ul>\n<li><strong>Default<\/strong>: read_uncommitted<\/li>\n<li><strong>Description<\/strong>: Controls visibility of transactional messages. <code>read_committed<\/code> filters out transactions not yet committed.<\/li>\n<li><strong>Trade-offs<\/strong>: <code>read_committed<\/code> ensures cleaner data at the cost of potential latency.<\/li>\n<\/ul>\n<h4><code>partition.assignment.strategy<\/code><\/h4>\n<ul>\n<li><strong>Default<\/strong>: <code>[org.apache.kafka.clients.consumer.RangeAssignor, org.apache.kafka.clients.consumer.CooperativeStickyAssignor]<\/code><\/li>\n<li><strong>Description<\/strong>: Determines the strategy for partition assignment among consumers.<\/li>\n<li><strong>Trade-offs<\/strong>: Different strategies can optimize for fairness or throughput.<\/li>\n<\/ul>\n<h4><code>client.rack<\/code><\/h4>\n<ul>\n<li><strong>Default<\/strong>: Not set<\/li>\n<li><strong>Description<\/strong>: Specifies the client's rack to enable rack-aware partition assignment.<\/li>\n<li><strong>Trade-offs<\/strong>: Can reduce cross-rack traffic at the cost of potential imbalance in local traffic.<\/li>\n<\/ul>\n<h3>Additional Consumer Configurations and Practices<\/h3>\n<h4>Understanding Consumer Behavior<\/h4>\n<ul>\n<li><strong>Subscription Types<\/strong>: Kafka consumers can subscribe to topics in different ways, such as by specific topic names, pattern matching on topic names, or direct partition assignment. (e.g. <code>consumer.subscribe(Pattern.compile(&quot;.*topic&quot;));<\/code> and <code>consumer.subscribe(List.of(&quot;orders-topic&quot;, &quot;customers-topic&quot;, &quot;sales-topic&quot;, &quot;stocks-topic&quot;));<\/code>)<\/li>\n<li><strong>Polling Process<\/strong>: Inside the consumer's <code>poll()<\/code> call, several checks and operations occur, including heartbeat checks, subscription updates, and potentially triggering rebalance if necessary.<\/li>\n<\/ul>\n<h4>Consumer Rebalancing Triggers<\/h4>\n<p>Rebalancing, a critical aspect of Kafka consumer groups for ensuring even data processing distribution, can be triggered by:<\/p>\n<ul>\n<li>Changes in the consumer group (e.g., new consumer joining, existing consumer leaving).<\/li>\n<li>Changes in topic partition counts or in the matching topics of a pattern subscription.<\/li>\n<li>A consumer failing to send heartbeats within <code>session.timeout.ms<\/code> or to call <code>poll()<\/code> within <code>max.poll.interval.ms<\/code>.<\/li>\n<li>Manual rebalance triggers like calling <code>unsubscribe()<\/code>.<\/li>\n<\/ul>\n<p>Consumer group rebalances are coordinated by the group coordinator (a broker) and the group leader (a consumer that computes the assignment), not by the Controller.<\/p>\n<h4>Managing Consumer Offsets<\/h4>\n<ul>\n<li><strong>Auto-Commit Strategy<\/strong>: By default, Kafka consumers automatically commit offsets at regular intervals, but manual offset management can provide finer control over when and how offsets are committed, which is essential for precise processing records management.<\/li>\n<li><strong>Offset Reset Behavior<\/strong>: Determines how consumers behave when no initial offset is found. <code>auto.offset.reset<\/code> can significantly impact consumer startup behavior, especially in scenarios where precise data replay or skipping is required.<\/li>\n<li>The consumer is responsible for committing the offsets to the <code>__consumer_offsets<\/code> topic. However, <strong>the consumer does not directly write the offset information<\/strong> to the topic. Instead, it sends the offset information to the <strong>group coordinator broker<\/strong>, which then writes the offsets to the <code>__consumer_offsets<\/code> topic on behalf of the consumer.<\/li>\n<\/ul>\n<h4>Multi-threading and Consumer Safety<\/h4>\n<ul>\n<li><strong>Single-threaded Nature<\/strong>: Each Kafka consumer instance is not thread-safe. The recommended practice is one consumer per thread to avoid concurrency issues.<\/li>\n<li><strong>Consumer Thread Safety<\/strong>: While the consumer itself is not thread-safe, certain operations like <code>wakeup()<\/code> can be safely called from another thread to interrupt an ongoing operation, such as a long <code>poll()<\/code>.  (<code>WakeupException<\/code> will be thrown)<\/li>\n<\/ul>\n<h4>High Availability and Fault Tolerance<\/h4>\n<ul>\n<li><strong>Consumer Group Coordination<\/strong>: Kafka uses the GroupCoordinator and ConsumerCoordinator components to manage consumer groups' state and rebalancing, ensuring consumers within a group efficiently distribute workload among themselves.<\/li>\n<li><strong>Heartbeats and Session Management<\/strong>: By adjusting <code>heartbeat.interval.ms<\/code> and <code>session.timeout.ms<\/code>, you can fine-tune how quickly Kafka detects failed consumers and rebalances partitions, balancing between responsiveness and stability.<\/li>\n<\/ul>\n<h4>Consumer Polling and Processing Patterns<\/h4>\n<ul>\n<li><strong>Long Processing Times<\/strong>: If your consumer processing time might exceed <code>max.poll.interval.ms<\/code>, consider batching records and processing them more efficiently or adjusting the <code>max.poll.interval.ms<\/code> to allow more time for processing while avoiding unintended group rebalancing.<\/li>\n<li><strong>Batch Processing<\/strong>: Consumers can adjust <code>max.poll.records<\/code> to control the number of records fetched in each poll call, allowing for more predictable processing times and better throughput control.<\/li>\n<\/ul>\n<h4>Offset and Partition Management<\/h4>\n<ul>\n<li><strong>Manual Partition Assignment<\/strong>: Using the <code>assign()<\/code> method allows for direct control over which partitions a consumer processes, bypassing Kafka's consumer group management and rebalance protocol. This approach is suitable for scenarios requiring static partition assignments.<\/li>\n<li><strong>Custom Offset Storage<\/strong>: While Kafka provides built-in offset management through the <code>__consumer_offsets<\/code> topic, consumers can implement custom offset storage mechanisms if needed, allowing for greater flexibility in offset management strategies.<\/li>\n<li>Kafka allows specifying the position using <code>seek(TopicPartition, long)<\/code> to specify the new position (offset) a consumer can read from. Also <code>seekToBeginning(TopicPartition tp)<\/code> and <code>seekToEnd(TopicPartition tp)<\/code>.<\/li>\n<\/ul>\n<h3>Optimizing Consumer Performance<\/h3>\n<ul>\n<li><strong>Tuning Fetch Parameters<\/strong>: Adjust <code>fetch.min.bytes<\/code>, <code>fetch.max.bytes<\/code>, and <code>max.partition.fetch.bytes<\/code> to optimize the balance between latency and throughput based on your application's specific needs.<\/li>\n<li><strong>Consumer Lag Monitoring<\/strong>: Keeping an eye on <code>records-lag-max<\/code> can help identify when a consumer is not keeping up with the producers, allowing for timely adjustments to consumer configurations or scaling out consumers.<\/li>\n<\/ul>\n<h3>High Watermark in Kafka<\/h3>\n<p>The <strong>high watermark (HW)<\/strong> is a critical concept in Kafka, ensuring data consistency and reliability. It represents the offset of the last message that has been successfully replicated to all <strong>In-Sync Replicas (ISR)<\/strong> of a partition.<\/p>\n<h3>Group Coordinator and Group Leader<\/h3>\n<p>The <strong>group coordinator<\/strong> is a designated <strong>broker<\/strong> that receives heartbeats from all <code>consumers<\/code> within a <code>consumer group<\/code>. Each <code>consumer group<\/code> is assigned a single group coordinator. If a consumer fails to send heartbeats, the coordinator initiates a rebalance process.<\/p>\n<p>When a consumer wishes to join a <code>consumer group<\/code>, it sends a <code>JoinGroup<\/code> request to the group coordinator. The first consumer to join the group is appointed as the group leader.<\/p>\n<img src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMjAwIiBoZWlnaHQ9IjE2MDAiIHZpZXdCb3g9IjAgMCAxMjAwIDE2MDAiPgogIDxkZWZzPgogICAgPG1hcmtlciBpZD0iYXJyb3ciIG1hcmtlcldpZHRoPSIxMCIgbWFya2VySGVpZ2h0PSI3IiByZWZYPSI5IiByZWZZPSIzLjUiIG9yaWVudD0iYXV0byI+CiAgICAgIDxwb2x5Z29uIHBvaW50cz0iMCAwLCAxMCAzLjUsIDAgNyIgZmlsbD0iIzU4YTZmZiIvPgogICAgPC9tYXJrZXI+CiAgICA8bWFya2VyIGlkPSJhcnJvdy15ZWxsb3ciIG1hcmtlcldpZHRoPSIxMCIgbWFya2VySGVpZ2h0PSI3IiByZWZYPSI5IiByZWZZPSIzLjUiIG9yaWVudD0iYXV0byI+CiAgICAgIDxwb2x5Z29uIHBvaW50cz0iMCAwLCAxMCA pbkdyb3VwIC8gU3luY0dyb3VwIC8gSGVhcnRiZWF0IC8gT2Zmc2V0Q29tbWl0PC90ZXh0PgogIDx0ZXh0IHg9IjYwMCIgeT0iMTU2MiIgZm9udC1mYW1pbHk9Im1vbm9zcGFjZSIgZm9udC1zaXplPSIxMCIgZmlsbD0iIzhiOTQ5ZSIgdGV4dC1hbmNob3I9Im1pZGRsZSI+a2Fma2EuYXBhY2hlLm9yZy9kb2N1bWVudGF0aW9uLyNpbXBsX2Nvb3JkcHJvdG9jb2w8L3RleHQ+Cjwvc3ZnPgo=\" alt=\"Kafka request lifecycle\" width=\"1200\" height=\"1600\">\n<h4>Key Points:<\/h4>\n<ol>\n<li>\n<p><strong>Definition<\/strong>:<\/p>\n<ul>\n<li>The high watermark is the offset of the last message replicated to all ISR.<\/li>\n<li>It ensures that consumers only read fully replicated messages.<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>In-Sync Replicas (ISR)<\/strong>:<\/p>\n<ul>\n<li>ISR are replicas that are fully caught up with the leader replica.<\/li>\n<li>The leader handles all reads and writes for a partition.<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>Replication and Acknowledgements<\/strong>:<\/p>\n<ul>\n<li>When a producer sends a message, it is written to the leader replica and then replicated to all ISR.<\/li>\n<li>Producers specify the acknowledgment level (<code>acks<\/code>):\n<ul>\n<li><code>acks=0<\/code>: No acknowledgment needed.<\/li>\n<li><code>acks=1<\/code>: Leader acknowledgment only.<\/li>\n<li><code>acks=-1<\/code> or <code>acks=all<\/code>: All ISR acknowledgment (default since Kafka 3.0).<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>Message Visibility<\/strong>:<\/p>\n<ul>\n<li>Consumers can only read messages up to the high watermark.<\/li>\n<li>This ensures that only fully replicated messages are read, maintaining data consistency.<\/li>\n<li>If <code>acks=1<\/code>, the highest offset (latest message) can be greater than the high watermark if the message is not yet replicated.<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<h4>Example Scenario:<\/h4>\n<ul>\n<li>A producer sends a message with offset 10.<\/li>\n<li>With <code>acks=1<\/code> (not the default since Kafka 3.0), the leader acknowledges the write before replication.<\/li>\n<li>The high wate
