rmark may remain at offset 9 until the message at offset 10 is replicated to all ISR.<\/li>\n<li>Consumers will read messages up to offset 9 until offset 10 is fully replicated.<\/li>\n<\/ul>\n<h3>Metadata request<\/h3>\n<p>When a consumer has the wrong partition leader, it sends a metadata request to any Kafka broker. The response includes metadata for each partition, grouped by topic:<\/p>\n<ul>\n<li><strong>Leader<\/strong>: The current leader broker's node ID for the partition (-1 if no leader exists).<\/li>\n<li><strong>Replicas<\/strong>: The alive slave brokers for the partition's leader.<\/li>\n<li><strong>ISR<\/strong>: The subset of caught-up replicas.<\/li>\n<li><strong>Broker<\/strong>: The node ID, hostname, and port of a Kafka broker.<\/li>\n<\/ul>\n<h3>Security Considerations<\/h3>\n<ul>\n<li><strong>Encryption and Authentication<\/strong>: Secure consumer connections to Kafka brokers using <code>SSL/TLS<\/code> for encryption and <code>SASL<\/code> for authentication to protect data in transit and ensure that only authorized consumers can access topic data.<\/li>\n<\/ul>\n<h2><code>subscribe()<\/code> vs <code>assign()<\/code> (CCDAK)<\/h2>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><code>subscribe(topics)<\/code><\/th>\n<th><code>assign(partitions)<\/code><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Partition selection<\/td>\n<td>Automatic, done by group coordinator + assignor<\/td>\n<td>Manual, you choose topic-partitions<\/td>\n<\/tr>\n<tr>\n<td>Rebalancing<\/td>\n<td>Yes (consumer joins/leaves, new partitions)<\/td>\n<td><strong>No<\/strong> rebalance, no group management<\/td>\n<\/tr>\n<tr>\n<td><code>group.id<\/code><\/td>\n<td>Required<\/td>\n<td>Optional (needed only to commit offsets)<\/td>\n<\/tr>\n<tr>\n<td>Failover<\/td>\n<td>Partitions reassigned to other group members<\/td>\n<td>None — if the consumer dies, nobody takes over<\/td>\n<\/tr>\n<tr>\n<td>New partitions added<\/td>\n<td>Picked up automatically (pattern subscribe also picks new topics)<\/td>\n<td>Not picked up<\/td>\n<\/tr>\n<tr>\n<td>Use case<\/td>\n<td>Normal scalable processing<\/td>\n<td>Fixed partition mapping, replay of a specific partition, tooling<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><code>subscribe()<\/code> and <code>assign()<\/code> <strong>cannot be mixed<\/strong> on the same consumer (<code>IllegalStateException<\/code>).<\/li>\n<li>Pattern subscription: <code>subscribe(Pattern)<\/code> re-evaluates matching topics on metadata refresh (<code>metadata.max.age.ms<\/code>).<\/li>\n<\/ul>\n<h2>Delivery Guarantees (consumer side) (CCDAK)<\/h2>\n<table>\n<thead>\n<tr>\n<th>Guarantee<\/th>\n<th>How it happens<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>At-most-once<\/strong><\/td>\n<td>Offset committed <strong>before<\/strong> processing. A crash loses messages<\/td>\n<\/tr>\n<tr>\n<td><strong>At-least-once<\/strong> (default pattern)<\/td>\n<td>Offset committed <strong>after<\/strong> processing. A crash causes reprocessing → duplicates. Make processing idempotent<\/td>\n<\/tr>\n<tr>\n<td><strong>Exactly-once<\/strong><\/td>\n<td>Idempotent producer + transactions (<code>transactional.id<\/code>) with consumers on <code>isolation.level=read_committed<\/code>. Kafka Streams <code>processing.guarantee=exactly_once_v2<\/code>, or idempotent sink writes (offset stored with the result)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><code>enable.auto.commit=true<\/code> commits on <code>poll()<\/code> every <code>auto.commit.interval.ms<\/code> — effectively at-least-once, but can lose data if processing is async/threaded.<\/li>\n<li>Manual: <code>commitSync()<\/code> (blocking, retries) vs <code>commitAsync()<\/code> (non-blocking, no retry, use callback). Common pattern: <code>commitAsync<\/code> in loop, <code>commitSync<\/code> in <code>finally<\/code>/on shutdown.<\/li>\n<\/ul>\n<h2>Deserialization and Error Handling (CCDAK)<\/h2>\n<ul>\n<li>Consumer needs <code>key.deserializer<\/code> and <code>value.deserializer<\/code> (<strong>required<\/strong>) — must match the producer's serializer (e.g. <code>StringDeserializer<\/code>, <code>IntegerDeserializer<\/code>, <code>ByteArrayDeserializer<\/code>, <code>KafkaAvroDeserializer<\/code>).<\/li>\n<li>Custom deserializer: implement <code>org.apache.kafka.common.serialization.Deserializer&lt;T&gt;<\/code> (<code>deserialize(String topic, byte[] data)<\/code>). <code>Serde&lt;T&gt;<\/code> bundles serializer + deserializer (used in Streams).<\/li>\n<li><strong>Poison pill<\/strong>: a record that cannot be deserialized throws <code>RecordDeserializationException<\/code> (older: <code>SerializationException<\/code>) from <code>poll()<\/code> and the consumer gets stuck on that offset. Handle by: catching it and <code>seek()<\/code>-ing past the offset, using <code>ByteArrayDeserializer<\/code> and deserializing manually (send failures to a <strong>dead letter topic<\/strong>), or <code>ErrorHandlingDeserializer<\/code> (Spring).<\/li>\n<li>Typical consumer exceptions:\n<ul>\n<li><code>CommitFailedException<\/code> — group rebalanced (e.g. <code>max.poll.interval.ms<\/code> exceeded) before commit. The partition now belongs to another consumer.<\/li>\n<li><code>OffsetOutOfRangeException<\/code> — requested offset not in log (deleted by retention). behaviour governed by <code>auto.offset.reset<\/code>.<\/li>\n<li><code>WakeupException<\/code> — thrown by <code>poll()<\/code> after <code>consumer.wakeup()<\/code> (only thread-safe method). Used for clean shutdown.<\/li>\n<li><code>RebalanceInProgressException<\/code>, <code>TimeoutException<\/code> (<code>default.api.timeout.ms<\/code>), <code>AuthorizationException<\/code>.<\/li>\n<\/ul>\n<\/li>\n<li>Use a <strong>retry topic + dead-letter topic (DLT)<\/strong> pattern for records that fail processing, instead of blocking the partition.<\/li>\n<\/ul>\n<h2>Static Membership (<code>group.instance.id<\/code>)<\/h2>\n<ul>\n<li>Setting a unique <code>group.instance.id<\/code> makes the member <strong>static<\/strong>: a restart within <code>session.timeout.ms<\/code> does <strong>not<\/strong> trigger a rebalance and the consumer keeps its partitions.<\/li>\n<li>Use with a larger <code>session.timeout.ms<\/code> for rolling restarts. Two members with the same id → the old one is fenced (<code>FencedInstanceIdException<\/code>).<\/li>\n<\/ul>\n", "minutes": 14}, {"id": "3", "folder": "3.producer", "title": "Producer", "desc": "acks, idempotence, transactions, partitioner, serialization, headers", "kind": "core", "html": "<blockquote>\n<p>🚫 = outside the CCDAK exam scope (see exam blueprint)<\/p>\n<\/blockquote>\n<h2>Kafka Producer Configurations<\/h2>\n<p>Kafka producers send records to topics. The efficiency, reliability, and performance of data production can be significantly influenced by how producers are configured.<\/p>\n<h3>Key Points for CCDAK on Producers<\/h3>\n<ul>\n<li><strong>Efficiency and Throughput<\/strong>: Configurations like batch size and compression type can greatly affect the throughput.<\/li>\n<li><strong>Data Integrity<\/strong>: Settings such as <code>acks<\/code> and <code>retries<\/code> ensure data integrity and delivery guarantees.<\/li>\n<li><strong>Latency<\/strong>: Configurations like <code>linger.ms<\/code> can be tuned to balance between latency and throughput.<\/li>\n<li><strong>Reliability<\/strong>: Features like idempotence and transactions ensure reliable data delivery.<\/li>\n<li><strong>Simplicity:<\/strong> Producers are conceptually simpler than consumers since they do not require group coordination.<\/li>\n<li><strong>Broker and Partition Awareness:<\/strong> Producers automatically know which broker and partition to write to.<\/li>\n<li><strong>Partitioning:<\/strong> A producer partitioner maps each message to a topic partition, and the producer sends a produce request to the leader of that partition.<\/li>\n<li><strong>Message Key Guarantee:<\/strong> The partitioners shipped with Kafka ensure that all messages with the same non-empty key are sent to the same partition.<\/li>\n<li><strong>Keyless Sending:<\/strong> If producers send data without a key, the default partitioner spreads records across partitions (sticky partitioning since 2.4: stays on one partition until the batch is full, then switches; older versions used round-robin).<\/li>\n<li><strong>Acknowledgements:<\/strong> Producers can choose to receive acknowledgements of data writes.<\/li>\n<\/ul>\n<h3>Important Producer Properties<\/h3>\n<h4><code>acks<\/code><\/h4>\n<ul>\n<li><strong>Default<\/strong>: all (changed from 1 in Kafka 3.0)<\/li>\n<li><strong>Description<\/strong>: The number of acknowledgments the producer requires from brokers. Options are 0, 1, or 'all' (-1). With <code>all<\/code>, <code>min.insync.replicas<\/code> on the broker/topic sets the minimum ISR size for a write to succeed.<\/li>\n<li><strong>Trade-offs<\/strong>: More <code>acks<\/code> increase reliability but may reduce throughput.<\/li>\n<\/ul>\n<h4><code>linger.ms<\/code><\/h4>\n<ul>\n<li><strong>Default<\/strong>: 5 (ms; was 0 before Kafka 4.0)<\/li>\n<li><strong>Description<\/strong>: The delay to aggregate batches of records. Higher values allow larger and more efficient batches.<\/li>\n<li><strong>Trade-offs<\/strong>: Increases latency but improves throughput and efficiency.<\/li>\n<\/ul>\n<h4><code>batch.size<\/code><\/h4>\n<ul>\n<li><strong>Default<\/strong>: 16384 (16KB)<\/li>\n<li><strong>Description<\/strong>: Maximum batch size in bytes. Larger batches are more efficient but take more memory and may delay transmission.<\/li>\n<li><strong>Trade-offs<\/strong>: Balances memory usage with throughput.<\/li>\n<\/ul>\n<h4><code>max.in.flight.requests.per.connection<\/code><\/h4>\n<ul>\n<li><strong>Default<\/strong>: 5<\/li>\n<li><strong>Description<\/strong>: The maximum number of unacknowledged requests the client will send on a single connection before blocking.<\/li>\n<li><strong>Trade-offs<\/strong>: Higher values can improve throughput but may compromise ordering when retries are used without idempotence (with idempotence ordering is kept up to 5).<\/li>\n<\/ul>\n<h4><code>enable.idempotence<\/code><\/h4>\n<ul>\n<li><strong>Default<\/strong>: true (since Kafka 3.0; requires <code>acks=all<\/code>, <code>retries&gt;0<\/code>, <code>max.in.flight.requests.per.connection&lt;=5<\/code>)<\/li>\n<li><strong>Description<\/strong>: Prevents duplicate records caused by retries (exactly-once per partition within a producer session) and preserves ordering.<\/li>\n<li><strong>Trade-offs<\/strong>: May slightly impact throughput but significantly increases reliability.<\/li>\n<\/ul>\n<h4><code>compression.type<\/code><\/h4>\n<ul>\n<li><strong>Default<\/strong>: none<\/li>\n<li><strong>Description<\/strong>: The compression type for all data generated by the producer. Options are <code>none<\/code>, <code>gzip<\/code>, <code>snappy<\/code>, <code>lz4<\/code>, and <code>zstd<\/code>.<\/li>\n<li><strong>Trade-offs<\/strong>: Compression reduces the size of data sent over the network at the cost of CPU usage.<\/li>\n<\/ul>\n<h4><code>retries<\/code><\/h4>\n<ul>\n<li><strong>Default<\/strong>: 2147483647 (Integer.MAX_VALUE)<\/li>\n<li><strong>Description<\/strong>: Number of retries on transient errors. In practice bounded by <code>delivery.timeout.ms<\/code>.<\/li>\n<li><strong>Trade-offs<\/strong>: Ensures delivery. May reorder or duplicate records if idempotence is disabled and <code>max.in.flight.requests.per.connection<\/code> is greater than 1.<\/li>\n<\/ul>\n<h4><code>delivery.timeout.ms<\/code><\/h4>\n<ul>\n<li><strong>Default<\/strong>: 120000 (2 minutes)<\/li>\n<li><strong>Description<\/strong>: Upper bound on the time between <code>send()<\/code> returning and success/failure being reported. Must be &gt;= <code>linger.ms + request.timeout.ms<\/code>.<\/li>\n<\/ul>\n<h4><code>request.timeout.ms<\/code><\/h4>\n<ul>\n<li><strong>Default<\/strong>: 30000 (30 seconds)<\/li>\n<li><strong>Description<\/strong>: Maximum time the producer waits for a response to a single request.<\/li>\n<\/ul>\n<h4><code>max.block.ms<\/code><\/h4>\n<ul>\n<li><strong>Default<\/strong>: 60000 (1 minute)<\/li>\n<li><strong>Description<\/strong>: How long <code>send()<\/code> blocks when the buffer is full or metadata is unavailable before throwing <code>TimeoutException<\/code>.<\/li>\n<\/ul>\n<h4><code>transaction.timeout.ms<\/code><\/h4>\n<ul>\n<li><strong>Default<\/strong>: 60000 (1 minute)<\/li>\n<li><strong>Description<\/strong>: Maximum time a transaction can remain open. Relevant for exactly-once semantics.<\/li>\n<li><strong>Trade-offs<\/strong>: Longer transactions can hold resources but ensure completeness of operations.<\/li>\n<\/ul>\n<h4><code>max.request.size<\/code><\/h4>\n<ul>\n<li><strong>Default<\/strong>: 1048576 (1MB)<\/li>\n<li><strong>Description<\/strong>: The maximum size of a request (and so of a record batch/message). The broker/topic limits <code>message.max.bytes<\/code>/<code>max.message.bytes<\/code> also apply.<\/li>\n<li><strong>Trade-offs<\/strong>: Larger sizes can improve throughput but risk overwhelming brokers or dropping connections on large messages.<\/li>\n<\/ul>\n<h4><code>buffer.memory<\/code><\/h4>\n<ul>\n<li><strong>Default<\/strong>: 33554432 (32MB)<\/li>\n<li><strong>Description<\/strong>: Total memory available to the producer for buffering. When exhausted, <code>send()<\/code> blocks up to <code>max.block.ms<\/code>.<\/li>\n<li><strong>Trade-offs<\/strong>: More memory allows more batching and in-flight messages, improving throughput but increasing memory usage.<\/li>\n<\/ul>\n<h4><code>transactional.id<\/code><\/h4>\n<ul>\n<li><strong>Default<\/strong>: null<\/li>\n<li><strong>Description<\/strong>: Unique identifier for transactional messages. Necessary for exactly-once semantics.<\/li>\n<li><strong>Trade-offs<\/strong>: Enables transaction support at the cost of additional overhead for maintaining state.<\/li>\n<\/ul>\n<h3>Handling Errors in Kafka Producers<\/h3>\n<p>Kafka classifies errors as <em>retriable<\/em> or <em>non-retriable<\/em>, affecting how producers react to them.<\/p>\n<h4>Retriable Errors<\/h4>\n<p>Retriable errors are temporary and often resolved through retries. Kafka producers automatically retry these errors until the <code>retries<\/code> limit or <code>delivery.timeout.ms<\/code> is reached. Common retriable errors include:<\/p>\n<ul>\n<li><strong>Leader Not Available<\/strong>: Occurs when a new leader is being elected. The producer automatically recovers.<\/li>\n<li><strong>Not Leader for Partition<\/strong>: The targeted leader is not the current leader for the partition. The producer automatically recovers.<\/li>\n<li><strong>Not Enough Replicas<\/strong>: Not enough replicas are available for the producer to satisfy the <code>acks<\/code> configuration.<\/li>\n<\/ul>\n<p>Producers handle these errors by:<\/p>\n<ul>\n<li>Retrying with a delay specified by <code>retry.backoff.ms<\/code>.<\/li>\n<li>Continuing retries until <code>retries<\/code> or <code>delivery.timeout.ms<\/code> is exhausted, then failing the send.<\/li>\n<\/ul>\n<h4>Non-Retriable Errors<\/h4>\n<p>Non-retriable errors indicate issues not resolved by retrying and often require configuration changes or other interventions:<\/p>\n<ul>\n<li><strong>Record Too Large<\/strong>: The record size exceeds <code>max.request.size<\/code> (or the broker/topic message size limit). Requires adjusting the message size or configuration.<\/li>\n<li><strong>Invalid Topic Exception<\/strong>: The specified topic name is invalid.<\/li>\n<li><strong>Topic Authorization Failed<\/strong>: The producer lacks permission to publish to the specified topic.<\/li>\n<li><strong>Serialization Exception<\/strong>: The key or value could not be serialized.<\/li>\n<li><strong>Broker Not Available<\/strong>: The broker is not available for connections.<\/li>\n<li><strong>Invalid Required Acks<\/strong>: The <code>acks<\/code> configuration is set to an invalid value.<\/li>\n<\/ul>\n<p>Non-retriable errors demand an intervention or change in configuration or permissions. They point to conditions that retries alone cannot overcome, often requiring administrative action or code changes.<\/p>\n<p>Handling non-retriable errors requires:<\/p>\n<ul>\n<li>Catching and logging the exception.<\/li>\n<li>Reviewing the error to understand its cause.<\/li>\n<li>Adjusting the configuration or addressing the permission issues as needed.<\/li>\n<\/ul>\n<h4>Best Practices for Error Handling<\/h4>\n<ul>\n<li><strong>Monitoring<\/strong>: Continuously monitor log files for error patterns to proactively address emerging issues.<\/li>\n<li><strong>Smart Retrying<\/strong>: Use the <code>retry.backoff.ms<\/code> setting wisely to avoid overwhelming the system.<\/li>\n<li><strong>Idempotent Producers<\/strong>: Enable <code>enable.idempotence<\/code> to ensure that messages are not duplicated in the event of retries.<\/li>\n<\/ul>\n<h2>Delivery Guarantees (producer side) (CCDAK)<\/h2>\n<table>\n<thead>\n<tr>\n<th>Guarantee<\/th>\n<th>Producer settings<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>At-most-once<\/strong><\/td>\n<td><code>acks=0<\/code> or <code>retries=0<\/code> — no retry, message may be lost, never duplicated<\/td>\n<\/tr>\n<tr>\n<td><strong>At-least-once<\/strong><\/td>\n<td><code>acks=all<\/code> (or 1) + retries (default) — never lost on retriable errors, but retries can create <strong>duplicates<\/strong> (and reordering without idempotence)<\/td>\n<\/tr>\n<tr>\n<td><strong>Exactly-once (per partition, per session)<\/strong><\/td>\n<td><code>enable.idempotence=true<\/code> (default since Kafka 3.0; requires <code>acks=all<\/code>, <code>retries&gt;0<\/code>, <code>max.in.flight&lt;=5<\/code>). Broker de-duplicates using producer id (PID) + per-partition sequence number<\/td>\n<\/tr>\n<tr>\n<td><strong>Exactly-once across topics/partitions<\/strong><\/td>\n<td>Idempotence + <strong>transactions<\/strong>: <code>transactional.id<\/code>, <code>initTransactions()<\/code>, <code>beginTransaction()<\/code>, <code>send()<\/code>, <code>sendOffsetsToTransaction()<\/code>, <code>commitTransaction()<\/code> / <code>abortTransaction()<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>Transactions are atomic over multiple partitions and the consumed offsets (consume-transform-produce loop). Consumers must use <code>isolation.level=read_committed<\/code>. Same <code>transactional.id<\/code> after a restart <strong>fences<\/strong> the old (zombie) producer (<code>ProducerFencedException<\/code>).<\/li>\n<li><code>acks=all<\/code> durability also needs <code>min.insync.replicas&gt;=2<\/code> and <code>replication.factor&gt;=3<\/code>. Otherwise <code>NotEnoughReplicasException<\/code>.<\/li>\n<\/ul>\n<h2>Partitioner (CCDAK)<\/h2>\n<ul>\n<li>The <strong>partitioner<\/strong> decides which partition of the topic a record is sent to. Called inside <code>send()<\/code> before batching.<\/li>\n<li><strong>Default behaviour:<\/strong>\n<ol>\n<li><strong>Partition explicitly set<\/strong> in <code>ProducerRecord<\/code> → used as-is.<\/li>\n<li><strong>Key not null<\/strong> → <code>partition = toPositive(murmur2(keyBytes)) % numPartitions<\/code>. Same key → same partition (as long as the partition count doesn't change!), giving per-key ordering.<\/li>\n<li><strong>Key null<\/strong> → <strong>sticky<\/strong> behaviour: the producer sticks to one partition until the batch is full (<code>batch.size<\/code>) or <code>linger.ms<\/code> expires, then switches (Kafka ≥ 2.4 sticky; ≥ 3.3 built-in uniform sticky/adaptive). Older versions used round-robin per record.<\/li>\n<\/ol>\n<\/li>\n<li>Custom partitioner: implement <code>org.apache.kafka.clients.producer.Partitioner<\/code> and set <code>partitioner.class<\/code> (e.g. to route a hot key or VIP customers to a dedicated partition).<\/li>\n<li><strong>Adding partitions<\/strong> to a topic changes <code>hash % numPartitions<\/code> → same key may land on a different partition. Ordering per key is broken across the change.<\/li>\n<li>The partitioner only chooses the partition. The <strong>leader of that partition<\/strong> receives the data.<\/li>\n<li>Hot keys (skewed key distribution) lead to uneven partitions.<\/li>\n<\/ul>\n<h2>Serialization (CCDAK)<\/h2>\n<ul>\n<li><code>key.serializer<\/code> and <code>value.serializer<\/code> are <strong>required<\/strong> producer configs. The broker only stores <code>byte[]<\/code>.<\/li>\n<li>Built-in: <code>StringSerializer<\/code>, <code>IntegerSerializer<\/code>, <code>LongSerializer<\/code>, <code>DoubleSerializer<\/code>, <code>ByteArraySerializer<\/code>, <code>UUIDSerializer<\/code>, <code>ByteBufferSerializer<\/code>, <code>VoidSerializer<\/code>. Avro/Protobuf/JSON-Schema via Schema Registry (<code>KafkaAvroSerializer<\/code>, etc.).<\/li>\n<li>Custom serializer: implement <code>Serializer&lt;T&gt;<\/code> (<code>byte[] serialize(String topic, T data)<\/code>). Consumers must use the matching deserializer.<\/li>\n<li>A mismatch (e.g. producer <code>StringSerializer<\/code>, consumer <code>IntegerDeserializer<\/code>) → <code>SerializationException<\/code> on the consumer.<\/li>\n<li>Common data formats: <strong>String/JSON<\/strong> (human readable, no schema enforcement, larger), <strong>Avro<\/strong> (compact binary, schema in Schema Registry, best evolution support), <strong>Protobuf<\/strong>, <strong>JSON Schema<\/strong>, raw bytes. Prefer a schema-based format for contracts between teams.<\/li>\n<\/ul>\n<h2>Record Headers (CCDAK)<\/h2>\n<ul>\n<li>Headers are <strong>key (String) → value (byte[])<\/strong> pairs attached to a record, <strong>separate from key and value<\/strong>: <code>record.headers().add(&quot;trace-id&quot;, bytes)<\/code>. Read with <code>record.headers().lastHeader(&quot;trace-id&quot;)<\/code>.<\/li>\n<li>Available since Kafka 0.11. Headers are <strong>not<\/strong> used for partitioning or compaction and are <strong>not<\/strong> part of the key.<\/li>\n<li>Design: use for <strong>metadata<\/strong> — tracing/correlation IDs, source system, content type, schema/version, routing hints, audit info — so the payload stays untouched and consumers can filter or route without deserializing the value.<\/li>\n<li>Keep them small (they count toward message size). Duplicate header keys are allowed (order preserved).<\/li>\n<li>Kafka Connect: SMTs <code>InsertHeader<\/code>, <code>HeaderFrom<\/code>, <code>DropHeaders<\/code>. DLQ can add error context headers.<\/li>\n<li>Console consumer: <code>--property print.headers=true<\/code>.<\/li>\n<\/ul>\n<h2>Key Design for Partition Strategy (CCDAK)<\/h2>\n<ul>\n<li>Same key ⇒ same partition ⇒ <strong>ordering guaranteed per key<\/strong> only (not per topic).<\/li>\n<li>Choose a key with <strong>high cardinality and even distribution<\/strong> (e.g. <code>customerId<\/code>, <code>orderId<\/code>). Avoid skewed keys (country, boolean) → hot partitions.<\/li>\n<li>Need ordering across entities → use a common key (e.g. all events of an account use <code>accountId<\/code>).<\/li>\n<li>No ordering needed → null key for best distribution.<\/li>\n<li>Compacted topics <strong>require<\/strong> a non-null key.<\/li>\n<li>Plan the partition count up front: changing it later remaps keys.<\/li>\n<\/ul>\n", "minutes": 8}, {"id": "4", "folder": "4.topic", "title": "Topic", "desc": "Topic configs, compaction, partitions, modifying topics", "kind": "core", "html": "<h2>Kafka Topic Configurations<\/h2>\n<p>Kafka topics are categorized into partitions for scalability and replicated across brokers for fault tolerance. Topic configuration parameters play a critical role in determining the behavior of topics in terms of performance, durability, and availability.<\/p>\n<h3>Key Points for CCDAK on Topics<\/h3>\n<ul>\n<li><strong>Durability and Fault Tolerance<\/strong>: Configurations like <code>replication.factor<\/code> determine how data is replicated to ensure availability in case of broker failures.<\/li>\n<li><strong>Scalability<\/strong>: The <code>partition<\/code> count of a topic influences how data is distributed across the cluster and impacts parallel processing capabilities.<\/li>\n<li><strong>Data Consistency<\/strong>: The <code>acks<\/code> setting affects how producers receive acknowledgments from brokers, impacting data consistency guarantees.<\/li>\n<li><strong>Order Guarantee:<\/strong> Kafka guarantees that any consumer of a given topic-partition will always read that partition's events in exactly the same order as they were written.\n<ul>\n<li>If maintaining strict order within a partition is critical, set <code>max.in.flight.requests.per.connection<\/code> to 1 (when idempotence is disabled). This ensures that while a message is retrying, no other messages can be sent that might overtake the retried message. With <code>enable.idempotence=true<\/code> (the default since Kafka 3.0) ordering is preserved with up to 5 in-flight requests.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Partition-Specific Order:<\/strong> Order is guaranteed only within a partition, not across partitions.\n<ul>\n<li>Repartitioning can disrupt the order of messages in Kafka, primarily because it changes the way records are assigned to partitions.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Variable Message Count:<\/strong> Partitions do not need to have the same number of messages.<\/li>\n<li><strong>Partition-Specific Offsets:<\/strong> Offsets only have meaning within a specific partition.<\/li>\n<li><strong>Data Retention:<\/strong> Messages are kept only for a limited time in Kafka, with the default being one week (<code>retention.ms<\/code> = 604.800.000, i.e. <code>log.retention.hours=168<\/code>).<\/li>\n<li><strong>Immutability:<\/strong> Once data is written to a partition, it cannot be changed.<\/li>\n<li><strong>Partition Assignment:<\/strong> If a key is provided, the partition is <code>toPositive(murmur2(key)) % numPartitions<\/code>. Records without a key are spread across partitions by the sticky partitioner (batch by batch, since Kafka 2.4), not strictly round-robin per record.<\/li>\n<\/ul>\n<p>After adding partitions later, it cannot be guaranteed that old messages will be on the same partition as new messages with the same key.<\/p>\n<h3>Important Topic Properties<\/h3>\n<h4><code>acks<\/code><\/h4>\n<ul>\n<li><strong>Scope<\/strong>: Producer<\/li>\n<li><strong>Description<\/strong>: Determines the number of acknowledgments the producer requires from brokers before considering a request complete. Valid values are <code>0<\/code>, <code>1<\/code>, or <code>all<\/code> (<code>-1<\/code>). The default is <code>all<\/code> since Kafka 3.0.<\/li>\n<li><strong>Impact<\/strong>: This setting impacts data durability and producer throughput. Setting <code>acks=all<\/code> ensures higher data safety as it waits for all in-sync replicas to acknowledge (combine with topic-level <code>min.insync.replicas<\/code> &gt;= 2 to enforce a minimum ISR size). However, this may lower throughput compared to <code>acks=1<\/code> or <code>acks=0<\/code>, where the latter offers the highest throughput but with potential data loss.<\/li>\n<\/ul>\n<h4><code>replication.factor<\/code><\/h4>\n<ul>\n<li><strong>Scope<\/strong>: Topic<\/li>\n<li><strong>Description<\/strong>: Specifies the number of copies (replicas) of a topic to maintain across the cluster.<\/li>\n<li><strong>Default Value<\/strong>: This is a topic-level configuration set at the time of topic creation and doesn't have a universal default. It often defaults to the cluster's <code>default.replication.factor<\/code>.<\/li>\n<li><strong>Impact<\/strong>: A higher replication factor increases data availability and fault tolerance but requires more disk space and network bandwidth. It is critical for ensuring that even if some brokers are down, your data remains accessible.<\/li>\n<\/ul>\n<h4><code>partitions<\/code><\/h4>\n<ul>\n<li><strong>Scope<\/strong>: Topic<\/li>\n<li><strong>Description<\/strong>: Determines the number of partitions within a topic. Partitions are the basic unit of parallelism in Kafka, with each partition being independently consumed.<\/li>\n<li><strong>Default Value<\/strong>: This is set at the time of topic creation and typically defaults to the cluster's <code>num.partitions<\/code> setting.<\/li>\n<li><strong>Impact<\/strong>: More partitions allow greater parallel processing of data but can increase the overhead on the Kafka cluster (controller metadata, replication, file handles). Finding the right balance is key to optimizing performance and resource utilization.<\/li>\n<\/ul>\n<h3>Essential Kafka Topic Configuration Parameters<\/h3>\n<h4>Durability and Fault Tolerance<\/h4>\n<ul>\n<li><strong><code>replication.factor<\/code><\/strong>: Defines the number of replicated copies of a topic across the cluster, enhancing data availability and fault tolerance. The actual number can be set per topic and is crucial for maintaining data integrity in the event of broker failures.<\/li>\n<\/ul>\n<h4>Scalability Through Partitioning<\/h4>\n<ul>\n<li><strong><code>partitions<\/code><\/strong>: Controls the partition count for a topic, directly influencing data distribution and parallel processing capabilities across consumers. More partitions support higher parallelism but may increase cluster management overhead.<\/li>\n<\/ul>\n<h4>Data Consistency and Throughput<\/h4>\n<ul>\n<li><strong><code>acks<\/code><\/strong>: Configures acknowledgment requirements from brokers to producers, balancing between data consistency and throughput. Values range from <code>0<\/code> (fire and forget), <code>1<\/code> (leader acknowledgment), to <code>all<\/code> (full ISR acknowledgment).<\/li>\n<\/ul>\n<h3>Advanced Topic Configurations for Fine-Tuning<\/h3>\n<h4>Log Compaction and Retention<\/h4>\n<ul>\n<li><strong><code>cleanup.policy<\/code><\/strong>: Supports log compaction (<code>&quot;compact&quot;<\/code>) to retain at least the last known value for each key within a topic, crucial for stateful applications.\n<ul>\n<li>The default <code>cleanup.policy<\/code> for Kafka topics is <code>delete<\/code>. (Kafka will delete records that are older than the retention period specified by <code>retention.ms<\/code>.)<\/li>\n<li>Use <code>kafka-configs.sh --alter<\/code> or the Admin API to change the policy for existing topics (altering configs via <code>kafka-topics.sh<\/code> is no longer supported).<\/li>\n<li>The <code>delete<\/code> policy might also be used in tandem to prevent the state store from growing indefinitely, especially when windowed operations are involved. (Use <code>&quot;compact,delete&quot;<\/code> )<\/li>\n<li>Kafka Streams often requires that the latest state be recoverable even after restarts or rebalancing, making compaction a necessity.<\/li>\n<\/ul>\n<\/li>\n<li><strong><code>min.cleanable.dirty.ratio<\/code><\/strong>: Determines the ratio of log segments eligible for compaction. Lower values trigger compaction sooner, helping maintain a cleaner log with less overhead.<\/li>\n<\/ul>\n<h4>Segment Management and Efficiency<\/h4>\n<ul>\n<li><strong><code>segment.ms<\/code><\/strong>: Configures the time Kafka waits before closing the current log segment and starting a new one. Segment management affects storage and can impact log compaction and retention behavior.<\/li>\n<\/ul>\n<h4>Timestamps and Ordering<\/h4>\n<ul>\n<li><strong><code>message.timestamp.type<\/code><\/strong>: Defines whether Kafka should use the message creation time (<code>CreateTime<\/code> - default) or the time of log append (<code>LogAppendTime<\/code>). This setting can impact message ordering and log retention policies.<\/li>\n<\/ul>\n<pre><code>CreateTime (default):\n  Producer sets ts=10:00:00.000\n  Network delay: 500ms\n  Broker appends at 10:00:00.500\n  Stored timestamp: 10:00:00.000  ← producer's time\n\nLogAppendTime:\n  Producer sets ts=10:00:00.000  (ignored)\n  Broker appends at 10:00:00.500\n  Stored timestamp: 10:00:00.500  ← broker's time\n<\/code><\/pre>\n<h3>Key Considerations for Message Key and Size<\/h3>\n<h4>Message Key Usage<\/h4>\n<ul>\n<li>Utilizing a message key (<code>key!=null<\/code>) ensures that messages with the same key are always sent to the same partition, facilitating message ordering per key. However, modifying the partition count can disrupt this consistency.<\/li>\n<\/ul>\n<h4>Managing Message Sizes<\/h4>\n<ul>\n<li>Kafka's default message size limit is 1MB. Exceeding this without proper configuration adjustments (broker/topic <code>message.max.bytes<\/code> / <code>max.message.bytes<\/code>, <code>replica.fetch.max.bytes<\/code>, producer <code>max.request.size<\/code>, consumer <code>max.partition.fetch.bytes<\/code>) will result in a <code>RecordTooLargeException<\/code> on the producer.<\/li>\n<\/ul>\n<h2>Best Practices for Modifying Topics (CCDAK)<\/h2>\n<ul>\n<li><strong>Partitions can only be increased, never decreased<\/strong> (<code>kafka-topics.sh --alter --partitions N<\/code>). To reduce, create a new topic and migrate data.<\/li>\n<li><strong>Increasing partitions breaks key→partition mapping<\/strong> (<code>murmur2(key) % numPartitions<\/code> changes): new records for an existing key may go to a different partition → per-key ordering and Streams/state co-partitioning are affected, and existing data is <strong>not<\/strong> moved. Preferably create a new topic with the right partition count and copy/replay data to it.<\/li>\n<li><strong>Replication factor<\/strong> cannot be changed with <code>--alter<\/code>. Use <code>kafka-reassign-partitions.sh<\/code> with a JSON reassignment that lists more/fewer replicas (use <code>--throttle<\/code> to limit impact).<\/li>\n<li><strong>Config changes<\/strong> are dynamic and need no restart: <code>kafka-configs.sh --alter --entity-type topics --entity-name T --add-config retention.ms=...<\/code> (use <code>--delete-config<\/code> to fall back to the broker default). Topic-level overrides take priority over broker defaults.<\/li>\n<li>Changing <code>cleanup.policy<\/code> or retention can immediately delete data older than the new retention — check before lowering <code>retention.ms<\/code>.<\/li>\n<li>Deleting a topic requires <code>delete.topic.enable=true<\/code> (default true) and is irreversible. Consumers/producers with auto-create enabled might recreate it.<\/li>\n<li>Partition count sizing: target throughput / per-partition throughput ≥ max number of consumers in a group, but too many partitions increase open files, leader election time and end-to-end latency. Over-provision a bit (e.g. 2–3x) to avoid later increases.<\/li>\n<li>Don't rely on <code>auto.create.topics.enable<\/code> in production — create topics explicitly with deliberate partitions and RF.<\/li>\n<li>Message size changes must be consistent end to end: <code>message.max.bytes<\/code> (broker/topic <code>max.message.bytes<\/code>), <code>replica.fetch.max.bytes<\/code>, producer <code>max.request.size<\/code>, consumer <code>max.partition.fetch.bytes<\/code>.<\/li>\n<\/ul>\n", "minutes": 7}, {"id": "5", "folder": "5.cli", "title": "CLI & Testing", "desc": "CLI tools, testing tools, scaling, deployment frameworks", "kind": "core", "html": "<h1>Kafka CLI Tools Overview<\/h1>\n<blockquote>\n<p><strong>Updated for Apache Kafka 4.2 (KRaft mode only)<\/strong><\/p>\n<p>Source: kafka.apache.org/42 | Kafka: The Definitive Guide 2nd Edition<\/p>\n<p>⚠️ ZooKeeper has been completely removed in Kafka 4.0+. Only KRaft mode is supported.<\/p>\n<\/blockquote>\n<hr />\n<h2>Key CLI Tools<\/h2>\n<h3>1. <code>kafka-topics.sh<\/code><\/h3>\n<p>Used for creating, deleting, describing, or altering topics on a Kafka broker.<\/p>\n<pre><code class=\"language-bash\"># Create a topic\nkafka-topics.sh --bootstrap-server localhost:9092 \\\n  --create --topic my-topic \\\n  --partitions 6 \\\n  --replication-factor 3\n\n# List all topics\nkafka-topics.sh --bootstrap-server localhost:9092 --list\n<\/code><\/pre>\n<h3>Describe a topic<\/h3>\n<pre><code class=\"language-bash\">kafka-topics.sh --bootstrap-server localhost:9092 \\\n  --describe --topic my-topic\n\n# Result:\nTopic: topic-name     TopicId: 4n-O8CRiSYqsQ5qvbeiCgQ PartitionCount: 2       ReplicationFactor: 1    Configs: max.message.bytes=104857600\n        Topic: topic-name     Partition: 0    Leader: 1       Replicas: 1     Isr: 1\n        Topic: topic-name     Partition: 1    Leader: 1       Replicas: 1     Isr: 1\n\n<\/code><\/pre>\n<h3>Alter (increase) partitions — can only be increased, never decreased!<\/h3>\n<pre><code class=\"language-bash\">kafka-topics.sh --bootstrap-server localhost:9092 \\\n  --alter --topic my-topic \\\n  --partitions 12\n<\/code><\/pre>\n<h3>Delete a topic<\/h3>\n<pre><code class=\"language-bash\">kafka-topics.sh --bootstrap-server localhost:9092 \\\n  --delete --topic my-topic\n<\/code><\/pre>\n<h3>Find under-replicated partitions<\/h3>\n<pre><code class=\"language-bash\">kafka-topics.sh --bootstrap-server localhost:9092 \\\n  --describe --under-replicated-partitions\n<\/code><\/pre>\n<h3>Find unavailable partitions<\/h3>\n<pre><code class=\"language-bash\">kafka-topics.sh --bootstrap-server localhost:9092 \\\n  --describe --unavailable-partitions\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Flag<\/th>\n<th>Description<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>--bootstrap-server<\/code><\/td>\n<td>Kafka broker address(es). <strong>Required<\/strong>. Replaces deprecated <code>--zookeeper<\/code>.<\/td>\n<\/tr>\n<tr>\n<td><code>--create<\/code><\/td>\n<td>Creates a new topic.<\/td>\n<\/tr>\n<tr>\n<td><code>--delete<\/code><\/td>\n<td>Deletes an existing topic.<\/td>\n<\/tr>\n<tr>\n<td><code>--alter<\/code><\/td>\n<td>Alters an existing topic (e.g., increase partitions).<\/td>\n<\/tr>\n<tr>\n<td><code>--list<\/code><\/td>\n<td>Lists all available topics.<\/td>\n<\/tr>\n<tr>\n<td><code>--describe<\/code><\/td>\n<td>Describes topic details (partitions, replicas, ISR).<\/td>\n<\/tr>\n<tr>\n<td><code>--topic<\/code><\/td>\n<td>Specifies the topic name.<\/td>\n<\/tr>\n<tr>\n<td><code>--partitions<\/code><\/td>\n<td>Number of partitions (target total, not increment!).<\/td>\n<\/tr>\n<tr>\n<td><code>--replication-factor<\/code><\/td>\n<td>Replication factor for each partition.<\/td>\n<\/tr>\n<tr>\n<td><code>--config<\/code><\/td>\n<td>Topic-level configuration override (e.g., <code>retention.ms=86400000<\/code>).<\/td>\n<\/tr>\n<tr>\n<td><code>--if-exists<\/code><\/td>\n<td>Perform operation only if topic exists.<\/td>\n<\/tr>\n<tr>\n<td><code>--if-not-exists<\/code><\/td>\n<td>Create topic only if it does not already exist.<\/td>\n<\/tr>\n<tr>\n<td><code>--exclude-internal<\/code><\/td>\n<td>Exclude internal topics (e.g., <code>__consumer_offsets<\/code>) from listing.<\/td>\n<\/tr>\n<tr>\n<td><code>--under-replicated-partitions<\/code><\/td>\n<td>Show partitions where replicas are not in sync.<\/td>\n<\/tr>\n<tr>\n<td><code>--unavailable-partitions<\/code><\/td>\n<td>Show partitions with no leader.<\/td>\n<\/tr>\n<tr>\n<td><code>--at-min-isr-partitions<\/code><\/td>\n<td>Show partitions at minimum ISR threshold.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h3>2. <code>kafka-console-producer.sh<\/code><\/h3>\n<p>Produces messages to a Kafka topic from the command line.<\/p>\n<pre><code class=\"language-bash\"># Produce messages (interactive)\nkafka-console-producer.sh \\\n  --bootstrap-server localhost:9092 \\\n  --topic my-topic\n\n# Produce with key (tab-separated key:value)\nkafka-console-producer.sh \\\n  --bootstrap-server localhost:9092 \\\n  --topic my-topic \\\n  --property parse.key=true \\\n  --property key.separator=:\n\n# Produce with acks\nkafka-console-producer.sh \\\n  --bootstrap-server localhost:9092 \\\n  --topic my-topic \\\n  --producer-property acks=all\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Flag<\/th>\n<th>Description<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>--bootstrap-server<\/code><\/td>\n<td>Kafka broker address(es). <strong>Required<\/strong>. ⚠️ NOT <code>--broker-list<\/code> (deprecated/removed)!<\/td>\n<\/tr>\n<tr>\n<td><code>--topic<\/code><\/td>\n<td>Topic to produce messages to.<\/td>\n<\/tr>\n<tr>\n<td><code>--producer-property<\/code><\/td>\n<td>Producer configuration property (e.g., <code>acks=all<\/code>, <code>compression.type=snappy<\/code>).<\/td>\n<\/tr>\n<tr>\n<td><code>--property<\/code><\/td>\n<td>Message formatter property (e.g., <code>parse.key=true<\/code>, <code>key.separator=:<\/code>).<\/td>\n<\/tr>\n<tr>\n<td><code>--compression-codec<\/code><\/td>\n<td>Compression type: <code>none<\/code>, <code>gzip<\/code>, <code>snappy<\/code>, <code>lz4<\/code>, <code>zstd<\/code>.<\/td>\n<\/tr>\n<tr>\n<td><code>--sync<\/code><\/td>\n<td>Send messages synchronously.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h3>3. <code>kafka-console-consumer.sh<\/code><\/h3>\n<p>Consumes messages from a Kafka topic and displays them to standard output.<\/p>\n<h3>Consume from beginning<\/h3>\n<pre><code class=\"language-bash\">kafka-console-consumer.sh \\\n  --bootstrap-server localhost:9092 \\\n  --topic my-topic \\\n  --from-beginning\n<\/code><\/pre>\n<h3>Consume with consumer group<\/h3>\n<pre><code class=\"language-bash\">kafka-console-consumer.sh \\\n  --bootstrap-server localhost:9092 \\\n  --topic my-topic \\\n  --group my-group\n<\/code><\/pre>\n<h3>Print key, value and timestamp<\/h3>\n<pre><code class=\"language-bash\">kafka-console-consumer.sh \\\n  --bootstrap-server localhost:9092 \\\n  --topic my-topic \\\n  --property print.key=true \\\n  --property print.timestamp=true \\\n  --property print.offset=true\n\n#Result:\nCreateTime:1795121930848        Offset:0        key-1   message-1 \nCreateTime:1795121941827        Offset:1        key-2   message-2 \nCreateTime:1795122168692        Offset:0        key-3   message-3 \n<\/code><\/pre>\n<h3>Consume from specific partition and offset<\/h3>\n<pre><code class=\"language-bash\">kafka-console-consumer.sh \\\n  --bootstrap-server localhost:9092 \\\n  --topic my-topic \\\n  --partition 0 \\\n  --offset 100\n<\/code><\/pre>\n<h3>Consume internal __consumer_offsets topic<\/h3>\n<pre><code>kafka-console-consumer.sh \\\n  --bootstrap-server localhost:9092 \\\n  --topic __consumer_offsets \\\n  --formatter &quot;kafka.coordinator.group.GroupMetadataManager\\$OffsetsMessageFormatter&quot; \\\n  --consumer-property exclude.internal.topics=false \\\n  --from-beginning\n\n#Result:\n[console-group-name,test-topic,1]::OffsetAndMetadata(offset=2, leaderEpoch=Optional[0], metadata=, commitTimestamp=1795122258015, expireTimestamp=None)\n[console-group-name,test-topic,0]::OffsetAndMetadata(offset=1, leaderEpoch=Optional[0], metadata=, commitTimestamp=1795122258015, expireTimestamp=None)\n[console-group-name,test-topic,1]::OffsetAndMetadata(offset=2, leaderEpoch=Optional[0], metadata=, commitTimestamp=1795122263014, expireTimestamp=None)\n[console-group-name,test-topic,0]::OffsetAndMetadata(offset=1, leaderEpoch=Optional[0], metadata=, commitTimestamp=1795122263014, expireTimestamp=None)\n\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Flag<\/th>\n<th>Description<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>--bootstrap-server<\/code><\/td>\n<td>Kafka broker address(es). <strong>Required<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td><code>--topic<\/code><\/td>\n<td>Topic to consume from.<\/td>\n<\/tr>\n<tr>\n<td><code>--from-beginning<\/code><\/td>\n<td>Start consuming from the earliest offset.<\/td>\n<\/tr>\n<tr>\n<td><code>--group<\/code><\/td>\n<td>Consumer group ID. Group is <strong>created automatically<\/strong> on first join.<\/td>\n<\/tr>\n<tr>\n<td><code>--partition<\/code><\/td>\n<td>Consume from a specific partition.<\/td>\n<\/tr>\n<tr>\n<td><code>--offset<\/code><\/td>\n<td>Start offset (<code>earliest<\/code>, <code>latest<\/code>, or specific number).<\/td>\n<\/tr>\n<tr>\n<td><code>--max-messages<\/code><\/td>\n<td>Maximum number of messages to consume before exiting.<\/td>\n<\/tr>\n<tr>\n<td><code>--consumer-property<\/code><\/td>\n<td>Consumer configuration property.<\/td>\n<\/tr>\n<tr>\n<td><code>--property<\/code><\/td>\n<td>Message formatter property.<\/td>\n<\/tr>\n<tr>\n<td><code>--formatter<\/code><\/td>\n<td>Message formatter class.<\/td>\n<\/tr>\n<tr>\n<td><code>--skip-message-on-error<\/code><\/td>\n<td>Skip messages that cannot be parsed.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h3>4. <code>kafka-consumer-groups.sh<\/code><\/h3>\n<p>Manages Kafka consumer groups: listing, describing, deleting, and resetting offsets.<\/p>\n<pre><code class=\"language-bash\"># List all consumer groups\nkafka-consumer-groups.sh \\\n  --bootstrap-server localhost:9092 \\\n  --list\n<\/code><\/pre>\n<h3>Describe a consumer group (shows LAG!)<\/h3>\n<pre><code class=\"language-bash\">kafka-consumer-groups.sh \\\n  --bootstrap-server localhost:9092 \\\n  --describe --group my-group\n\n#Result:\nGROUP           TOPIC           PARTITION  CURRENT-OFFSET  LOG-END-OFFSET  LAG             CONSUMER-ID                                           HOST            CLIENT-ID\nconsole-group   topic-name      0          1               1               0               console-consumer-4d473722-3c52-44ce-b661-e2b022485c75 /127.0.0.1      console-consumer\nconsole-group   topic-name      1          2               2               0               console-consumer-4d473722-3c52-44ce-b661-e2b022485c75 /127.0.0.1      console-consumer\n  \n<\/code><\/pre>\n<h3>Delete a consumer group (must be inactive!)<\/h3>\n<pre><code class=\"language-bash\">kafka-consumer-groups.sh \\\n  --bootstrap-server localhost:9092 \\\n  --delete --group my-group\n<\/code><\/pre>\n<h3>Reset offsets - dry-run (preview only)<\/h3>\n<pre><code class=\"language-bash\">kafka-consumer-groups.sh \\\n  --bootstrap-server localhost:9092 \\\n  --group my-group \\\n  --reset-offsets \\\n  --to-earliest \\\n  --topic my-topic\n<\/code><\/pre>\n<h3>Reset offsets - execute (actual reset)<\/h3>\n<pre><code class=\"language-bash\">kafka-consumer-groups.sh \\\n  --bootstrap-server localhost:9092 \\\n  --group my-group \\\n  --reset-offsets \\\n  --to-earliest \\\n  --all-topics \\\n  --execute\n<\/code><\/pre>\n<h3>Reset to specific datetime<\/h3>\n<pre><code class=\"language-bash\">kafka-consumer-groups.sh \\\n  --bootstrap-server localhost:9092 \\\n  --group my-group \\\n  --reset-offsets \\\n  --to-datetime 2024-01-01T00:00:00.000 \\\n  --all-topics \\\n  --execute\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Flag<\/th>\n<th>Description<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>--bootstrap-server<\/code><\/td>\n<td>Kafka broker address(es). <strong>Required<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td><code>--group<\/code><\/td>\n<td>Consumer group ID.<\/td>\n<\/tr>\n<tr>\n<td><code>--list<\/code><\/td>\n<td>List all consumer groups.<\/td>\n<\/tr>\n<tr>\n<td><code>--describe<\/code><\/td>\n<td>Show group details: offsets, lag, consumer IDs, hosts.<\/td>\n<\/tr>\n<tr>\n<td><code>--delete<\/code><\/td>\n<td>Delete a consumer group (must be inactive).<\/td>\n<\/tr>\n<tr>\n<td><code>--reset-offsets<\/code><\/td>\n<td>Reset offsets for a consumer group.<\/td>\n<\/tr>\n<tr>\n<td><code>--execute<\/code><\/td>\n<td><strong>Required<\/strong> to actually perform the reset. Without it: dry-run only.<\/td>\n<\/tr>\n<tr>\n<td><code>--all-topics<\/code><\/td>\n<td>Apply reset to all topics consumed by the group.<\/td>\n<\/tr>\n<tr>\n<td><code>--topic<\/code><\/td>\n<td>Apply reset to a specific topic.<\/td>\n<\/tr>\n<tr>\n<td><code>--to-earliest<\/code><\/td>\n<td>Reset to oldest available offset.<\/td>\n<\/tr>\n<tr>\n<td><code>--to-latest<\/code><\/td>\n<td>Reset to newest offset.<\/td>\n<\/tr>\n<tr>\n<td><code>--to-offset &lt;Long&gt;<\/code><\/td>\n<td>Reset to a specific offset number.<\/td>\n<\/tr>\n<tr>\n<td><code>--to-datetime &lt;YYYY-MM-DDTHH:mm:SS.sss&gt;<\/code><\/td>\n<td>Reset to offset at a specific point in time.<\/td>\n<\/tr>\n<tr>\n<td><code>--shift-by &lt;Long&gt;<\/code><\/td>\n<td>Shift offset by N (positive = forward, negative = backward).<\/td>\n<\/tr>\n<tr>\n<td><code>--by-duration &lt;PnDTnHnMnS&gt;<\/code><\/td>\n<td>Shift offset by ISO 8601 duration (e.g., <code>PT1H<\/code> = 1 hour back).<\/td>\n<\/tr>\n<tr>\n<td><code>--to-current<\/code><\/td>\n<td>Reset to current offset (useful with dry-run).<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Output columns when using <code>--describe<\/code>:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Column<\/th>\n<th>Description<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>GROUP<\/code><\/td>\n<td>Consumer group name.<\/td>\n<\/tr>\n<tr>\n<td><code>TOPIC<\/code><\/td>\n<td>Topic being consumed.<\/td>\n<\/tr>\n<tr>\n<td><code>PARTITION<\/code><\/td>\n<td>Partition ID.<\/td>\n<\/tr>\n<tr>\n<td><code>CURRENT-OFFSET<\/code><\/td>\n<td>Last committed offset by the consumer.<\/td>\n<\/tr>\n<tr>\n<td><code>LOG-END-OFFSET<\/code><\/td>\n<td>Latest offset on the broker.<\/td>\n<\/tr>\n<tr>\n<td><code>LAG<\/code><\/td>\n<td><code>LOG-END-OFFSET - CURRENT-OFFSET<\/code>. 0 = healthy.<\/td>\n<\/tr>\n<tr>\n<td><code>CONSUMER-ID<\/code><\/td>\n<td>Unique consumer instance ID.<\/td>\n<\/tr>\n<tr>\n<td><code>HOST<\/code><\/td>\n<td>Host of the consumer instance.<\/td>\n<\/tr>\n<tr>\n<td><code>CLIENT-ID<\/code><\/td>\n<td>Client ID of the consumer.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h3>5. <code>kafka-configs.sh<\/code><\/h3>\n<p>Manages dynamic configuration for brokers, topics, users, and clients.<\/p>\n<h3>Describe topic configuration overrides<\/h3>\n<pre><code class=\"language-bash\">kafka-configs.sh \\\n  --bootstrap-server localhost:9092 \\\n  --describe \\\n  --entity-type topics \\\n  --entity-name my-topic\n<\/code><\/pre>\n<h3>Set topic retention to 2 weeks<\/h3>\n<pre><code class=\"language-bash\">kafka-configs.sh \\\n  --bootstrap-server localhost:9092 \\\n  --alter \\\n  --entity-type topics \\\n  --entity-name my-topic \\\n  --add-config retention.ms=1209600000\n<\/code><\/pre>\n<h3>Delete topic configuration override (reverts to broker default)<\/h3>\n<pre><code class=\"language-bash\">kafka-configs.sh \\\n  --bootstrap-server localhost:9092 \\\n  --alter \\\n  --entity-type topics \\\n  --entity-name my-topic \\\n  --delete-config retention.ms\n<\/code><\/pre>\n<h3>Modify specific broker configuration<\/h3>\n<pre><code class=\"language-bash\">kafka-configs.sh \\\n  --bootstrap-server localhost:9092 \\\n  --alter \\\n  --entity-type brokers \\\n  --entity-name 0 \\\n  --add-config log.retention.ms=86400000\n<\/code><\/pre>\n<h3>Modify default configuration for ALL brokers<\/h3>\n<pre><code class=\"language-bash\">kafka-configs.sh \\\n  --bootstrap-server localhost:9092 \\\n  --alter \\\n  --entity-type brokers \\\n  --entity-default \\\n  --add-config log.retention.ms=86400000\n<\/code><\/pre>\n<h3>Set producer quota for a client<\/h3>\n<pre><code class=\"language-bash\">kafka-configs.sh \\\n  --bootstrap-server localhost:9092 \\\n  --alter \\\n  --entity-type clients \\\n  --entity-name my-client \\\n  --add-config producer_byte_rate=1048576\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Flag<\/th>\n<th>Description<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>--bootstrap-server<\/code><\/td>\n<td>Kafka broker address(es). <strong>Required<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td><code>--describe<\/code><\/td>\n<td>Show current configuration overrides.<\/td>\n<\/tr>\n<tr>\n<td><code>--alter<\/code><\/td>\n<td>Modify configuration.<\/td>\n<\/tr>\n<tr>\n<td><code>--entity-type<\/code><\/td>\n<td>Type: <code>topics<\/code>, <code>brokers<\/code>, <code>clients<\/code>, <code>users<\/code>.<\/td>\n<\/tr>\n<tr>\n<td><code>--entity-name<\/code><\/td>\n<td>Name/ID of the entity (topic name, broker ID, client ID).<\/td>\n<\/tr>\n<tr>\n<td><code>--entity-default<\/code><\/td>\n<td>Apply to all entities of the given type (broker-wide default).<\/td>\n<\/tr>\n<tr>\n<td><code>--add-config<\/code><\/td>\n<td>Add or update configuration key=value pairs.<\/td>\n<\/tr>\n<tr>\n<td><code>--delete-config<\/code><\/td>\n<td>Remove configuration override (reverts to default).<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h3>6. <code>kafka-reassign-partitions.sh<\/code><\/h3>\n<p>Reassigns partitions across brokers (used for cluster rebalancing, broker decommissioning).<\/p>\n<pre><code class=\"language-bash\"># Step 1: Define topics to move (topics.json)\n# {&quot;topics&quot;: [{&quot;topic&quot;: &quot;my-topic&quot;}], &quot;version&quot;: 1}\n\n# Step 2: Generate reassignment proposal\nkafka-reassign-partitions.sh \\\n  --bootstrap-server localhost:9092 \\\n  --topics-to-move-json-file topics.json \\\n  --broker-list 1,2,3 \\\n  --generate\n\n# Step 3: Execute reassignment\nkafka-reassign-partitions.sh \\\n  --bootstrap-server localhost:9092 \\\n  --reassignment-json-file reassignment.json \\\n  --execute\n\n# Step 4: Verify progress\nkafka-reassign-partitions.sh \\\n  --bootstrap-server localhost:9092 \\\n  --reassignment-json-file reassignment.json \\\n  --verify\n\n# With throttle to limit network impact\nkafka-reassign-partitions.sh \\\n  --bootstrap-server localhost:9092 \\\n  --reassignment-json-file reassignment.json \\\n  --execute \\\n  --throttle 52428800\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Flag<\/th>\n<th>Description<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>--generate<\/code><\/td>\n<td>Generate a reassignment proposal (does NOT execute).<\/td>\n<\/tr>\n<tr>\n<td><code>--execute<\/code><\/td>\n<td>Execute the reassignment.<\/td>\n<\/tr>\n<tr>\n<td><code>--verify<\/code><\/td>\n<td>Check status of an in-progress reassignment.<\/td>\n<\/tr>\n<tr>\n<td><code>--cancel<\/code><\/td>\n<td>Cancel an in-progress reassignment.<\/td>\n<\/tr>\n<tr>\n<td><code>--throttle &lt;bytes/sec&gt;<\/code><\/td>\n<td>Limit replication traffic during reassignment.<\/td>\n<\/tr>\n<tr>\n<td><code>--topics-to-move-json-file<\/code><\/td>\n<td>JSON file with topics to reassign.<\/td>\n<\/tr>\n<tr>\n<td><code>--reassignment-json-file<\/code><\/td>\n<td>JSON file with the reassignment plan.<\/td>\n<\/tr>\n<tr>\n<td><code>--broker-list<\/code><\/td>\n<td>Target broker IDs for the reassignment.<\/td>\n<\/tr>\n<tr>\n<td><code>--disable-rack-aware<\/code><\/td>\n<td>Disable rack-aware assignment.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Full flow — moving leader replica from Broker A → Broker B:<\/h3>\n<pre><code>kafka-reassign-partitions.sh --execute\n        │\n        ▼\nStep 1: ADD Broker B as a new replica (RF temporarily increases)\n        \n        Before:  Leader=A  Replicas=[A, C]  ISR=[A, C]\n        After:   Leader=A  Replicas=[A, C, B]  ISR=[A, C]\n                                          ^^^\n                           B starts replicating from leader A\n        \n        ── Producers/consumers still talk to A (leader) ──\n        ── ZERO interruption ──\n        \n        │\n        ▼\nStep 2: B catches up → joins ISR\n        \n        Leader=A  Replicas=[A, C, B]  ISR=[A, C, B]\n                                               ^^^\n        B is now fully caught up (in ISR)\n        \n        │\n        ▼\nStep 3: Controller triggers preferred leader election\n        \n        Leader switches A → B\n        \n        Leader=B  Replicas=[B, C]  ISR=[B, C]\n        \n        ── Brief leader election: milliseconds ──\n        ── Producers get NOT_LEADER_FOR_PARTITION ──\n        ── Client retries automatically ──\n        \n        │\n        ▼\nStep 4: A is removed from replica list\n        \n        Final:  Leader=B  Replicas=[B, C]  ISR=[B, C]\n<\/code><\/pre>\n<hr />\n<h3>7. <code>kafka-leader-election.sh<\/code><\/h3>\n<p>Triggers preferred or unclean leader election for partitions.<\/p>\n<pre><code class=\"language-bash\"># Trigger preferred leader election for all partitions\nkafka-leader-election.sh \\\n  --bootstrap-server localhost:9092 \\\n  --election-type preferred \\\n  --all-topic-partitions\n\n# Trigger preferred leader election for specific partitions\nkafka-leader-election.sh \\\n  --bootstrap-server localhost:9092 \\\n  --election-type preferred \\\n  --path-to-json-file partitions.json\n\n# Trigger unclean leader election (risk of data loss!)\nkafka-leader-election.sh \\\n  --bootstrap-server localhost:9092 \\\n  --election-type unclean \\\n  --all-topic-partitions\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Flag<\/th>\n<th>Description<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>--election-type<\/code><\/td>\n<td><code>preferred<\/code> (safe) or <code>unclean<\/code> (risk of data loss!).<\/td>\n<\/tr>\n<tr>\n<td><code>--all-topic-partitions<\/code><\/td>\n<td>Apply to all partitions.<\/td>\n<\/tr>\n<tr>\n<td><code>--topic<\/code><\/td>\n<td>Apply to a specific topic.<\/td>\n<\/tr>\n<tr>\n<td><code>--partition<\/code><\/td>\n<td>Apply to a specific partition.<\/td>\n<\/tr>\n<tr>\n<td><code>--path-to-json-file<\/code><\/td>\n<td>JSON file with specific partitions to elect.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h3>8. <code>kafka-acls.sh<\/code><\/h3>\n<p>Manages Access Control Lists (ACLs) for Kafka resources.<\/p>\n<pre><code class=\"language-bash\"># Grant producer access to a topic\nkafka-acls.sh \\\n  --bootstrap-server localhost:9092 \\\n  --add \\\n  --allow-principal User:Alice \\\n  --operation Write \\\n  --topic my-topic\n\n# Grant consumer access to a topic and group\nkafka-acls.sh \\\n  --bootstrap-server localhost:9092 \\\n  --add \\\n  --allow-principal User:Bob \\\n  --operation Read \\\n  --topic my-topic \\\n  --group my-group\n\n# List ACLs for a topic\nkafka-acls.sh \\\n  --bootstrap-server localhost:9092 \\\n  --list \\\n  --topic my-topic\n\n# Remove an ACL\nkafka-acls.sh \\\n  --bootstrap-server localhost:9092 \\\n  --remove \\\n  --allow-principal User:Alice \\\n  --operation Write \\\n  --topic my-topic\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Flag<\/th>\n<th>Description<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>--add<\/code><\/td>\n<td>Add a new ACL.<\/td>\n<\/tr>\n<tr>\n<td><code>--remove<\/code><\/td>\n<td>Remove an existing ACL.<\/td>\n<\/tr>\n<tr>\n<td><code>--list<\/code><\/td>\n<td>List existing ACLs.<\/td>\n<\/tr>\n<tr>\n<td><code>--allow-principal<\/code><\/td>\n<td>Principal to grant access (e.g., <code>User:Alice<\/code>).<\/td>\n<\/tr>\n<tr>\n<td><code>--deny-principal<\/code><\/td>\n<td>Principal to deny access.<\/td>\n<\/tr>\n<tr>\n<td><code>--operation<\/code><\/td>\n<td>Operation: <code>Read<\/code>, <code>Write<\/code>, <code>Create<\/code>, <code>Delete<\/code>, <code>Alter<\/code>, <code>Describe<\/code>, <code>All<\/code>.<\/td>\n<\/tr>\n<tr>\n<td><code>--topic<\/code><\/td>\n<td>Apply ACL to a topic.<\/td>\n<\/tr>\n<tr>\n<td><code>--group<\/code><\/td>\n<td>Apply ACL to a consumer group.<\/td>\n<\/tr>\n<tr>\n<td><code>--cluster<\/code><\/td>\n<td>Apply ACL to the cluster.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h3>9. <code>connect-mirror-maker.sh<\/code> (MirrorMaker 2)<\/h3>\n<p>Replicates data between Kafka clusters. Based on Kafka Connect framework.\n⚠️ Replaces the deprecated <code>kafka-mirror-maker.sh<\/code> (MirrorMaker 1).<\/p>\n<pre><code class=\"language-bash\"># Start MirrorMaker 2\nconnect-mirror-maker.sh \\\n  connect-mirror-maker.properties\n<\/code><\/pre>\n<p><strong>Example <code>connect-mirror-maker.properties<\/code>:<\/strong><\/p>\n<pre><code class=\"language-properties\">clusters = source, target\nsource.bootstrap.servers = source-broker:9092\ntarget.bootstrap.servers = target-broker:9092\nsource-&gt;target.enabled = true\nsource-&gt;target.topics = .*\nreplication.factor = 3\n<\/code><\/pre>\n<hr />\n<h3>10. <code>kafka-dump-log.sh<\/code><\/h3>\n<p>Inspects Kafka log segment files on disk.<\/p>\n<pre><code class=\"language-bash\"># Dump log segment metadata\nkafka-dump-log.sh \\\n  --files /tmp/kafka-logs/my-topic-0/00000000000000000000.log\n\n# Dump with message payload\nkafka-dump-log.sh \\\n  --files /tmp/kafka-logs/my-topic-0/00000000000000000000.log \\\n  --print-data-log\n\n# Dump cluster metadata log (KRaft)\nkafka-dump-log.sh \\\n  --cluster-metadata-decoder \\\n  --files /var/kafka/metadata/__cluster_metadata-0/00000000000000000000.log\n<\/code><\/pre>\n<hr />\n<h2>Important Notes for CCDAK Exam<\/h2>\n<h3>⚠️ Critical Facts<\/h3>\n<pre><code>1. ZooKeeper is COMPLETELY REMOVED in Kafka 4.x\n   → NEVER use --zookeeper flag\n   → ALWAYS use --bootstrap-server\n\n2. --broker-list is DEPRECATED/REMOVED\n   → Use --bootstrap-server in kafka-console-producer.sh\n\n3. Consumer Groups are created AUTOMATICALLY\n   → No CLI command to explicitly create a group\n   → Group is created on first JoinGroup request\n\n4. Partitions can only be INCREASED, never decreased\n   → kafka-topics.sh --alter --partitions &lt;higher-number&gt;\n   → Provide TOTAL number, not increment!\n\n5. --execute is REQUIRED for offset reset\n   → Without --execute: dry-run (preview only)\n   → With --execute: actual reset performed\n\n6. MirrorMaker 2 = connect-mirror-maker.sh\n   → NOT kafka-mirror-maker.sh (MirrorMaker 1, deprecated)\n<\/code><\/pre>\n<h3>Retention Configuration Quick Reference<\/h3>\n<pre><code>TOPIC level (specific topic):\n  retention.ms          → topic config\n  retention.bytes       → topic config\n\nBROKER level (default for all topics):\n  log.retention.ms      → broker config (highest priority)\n  log.retention.minutes → broker config (secondary)\n  log.retention.hours   → broker config (tertiary, default=168h)\n  log.retention.bytes   → broker config\n\n2 weeks = 1,209,600,000 ms\n1 day   = 86,400,000 ms\n1 week  = 604,800,000 ms\n<\/code><\/pre>\n<h3>CLI Tool Quick Reference<\/h3>\n<table>\n<thead>\n<tr>\n<th>Task<\/th>\n<th>Tool<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Create/delete/alter topic<\/td>\n<td><code>kafka-topics.sh<\/code><\/td>\n<\/tr>\n<tr>\n<td>Produce messages<\/td>\n<td><code>kafka-console-producer.sh<\/code><\/td>\n<\/tr>\n<tr>\n<td>Consume messages<\/td>\n<td><code>kafka-console-consumer.sh<\/code><\/td>\n<\/tr>\n<tr>\n<td>Check consumer lag<\/td>\n<td><code>kafka-consumer-groups.sh --describe<\/code><\/td>\n<\/tr>\n<tr>\n<td>Reset consumer offsets<\/td>\n<td><code>kafka-consumer-groups.sh --reset-offsets<\/code><\/td>\n<\/tr>\n<tr>\n<td>Modify topic/broker config<\/td>\n<td><code>kafka-configs.sh<\/code><\/td>\n<\/tr>\n<tr>\n<td>Reassign partitions<\/td>\n<td><code>kafka-reassign-partitions.sh<\/code><\/td>\n<\/tr>\n<tr>\n<td>Trigger leader election<\/td>\n<td><code>kafka-leader-election.sh<\/code><\/td>\n<\/tr>\n<tr>\n<td>Manage ACLs<\/td>\n<td><code>kafka-acls.sh<\/code><\/td>\n<\/tr>\n<tr>\n<td>Cross-cluster replication<\/td>\n<td><code>connect-mirror-maker.sh<\/code><\/td>\n<\/tr>\n<tr>\n<td>Inspect log segments<\/td>\n<td><code>kafka-dump-log.sh<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Best Practices<\/h3>\n<ul>\n<li><strong>Security<\/strong>: Always configure ACLs and SSL/TLS in production environments.<\/li>\n<li><strong>Consumer Lag Monitoring<\/strong>: Use <code>kafka-consumer-groups.sh --describe<\/code> for CLI monitoring. Use <strong>Burrow<\/strong> for continuous automated monitoring.<\/li>\n<li><strong>Configuration Management<\/strong>: Use <code>kafka-configs.sh<\/code> for dynamic configuration changes without broker restarts.<\/li>\n<li><strong>Partition Reassignment<\/strong>: Always use <code>--throttle<\/code> during reassignment to prevent network saturation.<\/li>\n<li><strong>Offset Reset<\/strong>: Always do a dry-run first (without <code>--execute<\/code>) before committing to an offset reset.<\/li>\n<li><strong>Leader Election<\/strong>: Run preferred leader election after broker maintenance to restore balance.<\/li>\n<li><strong>Durability over flush<\/strong>: Do NOT configure <code>log.flush.interval.ms<\/code> manually — rely on replication (<code>acks=all<\/code>, <code>min.insync.replicas=2<\/code>) for durability.<\/li>\n<\/ul>\n<hr />\n<h1>Application Testing, Scaling and Deployment (CCDAK)<\/h1>\n<h2>Common Testing Tools<\/h2>\n<table>\n<thead>\n<tr>\n<th>Tool<\/th>\n<th>Purpose<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>MockProducer&lt;K,V&gt;<\/code> / <code>MockConsumer&lt;K,V&gt;<\/code> (<code>kafka-clients<\/code> test utils)<\/td>\n<td>Unit-test producer/consumer code with <strong>no broker<\/strong>: <code>MockProducer<\/code> records <code>history()<\/code> of sent records and can simulate errors/transactions. <code>MockConsumer<\/code> is fed records via <code>addRecord()<\/code>, <code>assign()/updateBeginningOffsets()<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>TopologyTestDriver<\/code> (<code>kafka-streams-test-utils<\/code>)<\/td>\n<td>Unit-test a Kafka Streams topology without a broker: <code>createInputTopic()<\/code> / <code>createOutputTopic()<\/code>, <code>TestInputTopic.pipeInput()<\/code>, <code>TestOutputTopic.readKeyValue()<\/code>, <code>getKeyValueStore()<\/code>. Synchronous, advance time with <code>advanceWallClockTime<\/code>. Not a full integration (no real consumers/threads/rebalancing)<\/td>\n<\/tr>\n<tr>\n<td><strong>Testcontainers<\/strong> (<code>KafkaContainer<\/code>)<\/td>\n<td>Integration tests against a real Kafka broker in Docker<\/td>\n<\/tr>\n<tr>\n<td>Embedded Kafka (<code>EmbeddedKafkaCluster<\/code>, Spring <code>@EmbeddedKafka<\/code>)<\/td>\n<td>In-JVM broker for integration tests<\/td>\n<\/tr>\n<tr>\n<td><code>kafka-console-producer.sh<\/code> / <code>kafka-console-consumer.sh<\/code><\/td>\n<td>Manual smoke tests / debugging<\/td>\n<\/tr>\n<tr>\n<td><code>kafka-producer-perf-test.sh<\/code> / <code>kafka-consumer-perf-test.sh<\/code><\/td>\n<td><strong>Load / throughput / latency tests<\/strong> (<code>--num-records --record-size --throughput -1 --producer-props acks=all bootstrap.servers=...<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>kafka-verifiable-producer.sh<\/code> / <code>kafka-verifiable-consumer.sh<\/code><\/td>\n<td>Verify delivery (acked / consumed JSON events) during failure tests<\/td>\n<\/tr>\n<tr>\n<td><code>kafka-e2e-latency.sh<\/code><\/td>\n<td>Measure end-to-end latency<\/td>\n<\/tr>\n<tr>\n<td>Trogdor<\/td>\n<td>Fault-injection / workload test framework for clusters<\/td>\n<\/tr>\n<tr>\n<td><code>kafka-dump-log.sh<\/code>, <code>kafka-get-offsets.sh<\/code><\/td>\n<td>Inspect on-disk segments and offsets while debugging<\/td>\n<\/tr>\n<tr>\n<td>Schema Registry / Connect REST (<code>curl<\/code>)<\/td>\n<td>Test schemas, compatibility, connector config validation<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>Unit tests (Mock*, TopologyTestDriver) → fast, no network. Integration tests (Testcontainers/Embedded) → real broker semantics.<\/li>\n<li><code>kafka-topics.sh --describe<\/code> and <code>kafka-consumer-groups.sh --describe<\/code> verify results of a test (partitions, ISR, lag).<\/li>\n<\/ul>\n<h2>Horizontal vs Vertical Scaling<\/h2>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>Horizontal<\/strong> (scale out)<\/th>\n<th><strong>Vertical<\/strong> (scale up)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Meaning<\/td>\n<td>Add more instances/brokers<\/td>\n<td>Bigger machine (CPU, RAM, disk, network)<\/td>\n<\/tr>\n<tr>\n<td><strong>Consumers<\/strong><\/td>\n<td>Add consumers to the group → more partitions processed in parallel. Limited by <strong>partition count<\/strong> (extra consumers idle)<\/td>\n<td>More threads (consumer is single-threaded per instance; use one consumer per thread) / bigger processing power<\/td>\n<\/tr>\n<tr>\n<td><strong>Producers<\/strong><\/td>\n<td>Add producer instances<\/td>\n<td>Tune <code>batch.size<\/code>, <code>linger.ms<\/code>, <code>compression.type<\/code>, <code>buffer.memory<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>Brokers<\/strong><\/td>\n<td>Add brokers, then <strong>reassign partitions<\/strong> (<code>kafka-reassign-partitions.sh<\/code>) — new brokers don't get existing partitions automatically<\/td>\n<td>More RAM (page cache), faster disks/network, <code>num.io.threads<\/code>, <code>num.network.threads<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>Topics<\/strong><\/td>\n<td>More partitions (raises max parallelism, can't be reduced, changes key mapping)<\/td>\n<td>n/a<\/td>\n<\/tr>\n<tr>\n<td><strong>Streams<\/strong><\/td>\n<td>Start more instances with same <code>application.id<\/code> (tasks rebalanced). Max = number of input partitions<\/td>\n<td>Raise <code>num.stream.threads<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>Connect<\/strong><\/td>\n<td>Add workers, raise <code>tasks.max<\/code><\/td>\n<td>Larger worker heap/CPU<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>Kafka favours <strong>horizontal<\/strong> scaling. Consumer group size &gt; partitions is useless.<\/li>\n<li>Scaling consumers when lag grows: first check processing slowness, then add consumers (≤ partitions), then add partitions.<\/li>\n<\/ul>\n<h2>Common Deployment Frameworks<\/h2>\n<ul>\n<li><strong>Docker / Docker Compose<\/strong> — local dev and testing clusters (<code>apache/kafka<\/code>, <code>confluentinc/cp-kafka<\/code> images). Expose <code>advertised.listeners<\/code> correctly for host vs container networks.<\/li>\n<li><strong>Kubernetes<\/strong> — production: StatefulSets with persistent volumes. Operators such as <strong>Strimzi<\/strong> (open source) and <strong>Confluent for Kubernetes (CFK)<\/strong> manage brokers, topics (CRDs: <code>Kafka<\/code>, <code>KafkaTopic<\/code>, <code>KafkaUser<\/code>, <code>KafkaConnect<\/code>), rolling upgrades, TLS certs. <strong>Helm charts<\/strong> for packaging.<\/li>\n<li><strong>Ansible<\/strong> (<code>cp-ansible<\/code>), <strong>Terraform<\/strong> — provisioning bare-metal/VM clusters and managed resources.<\/li>\n<li><strong>Confluent Cloud / managed Kafka<\/strong> (MSK, Aiven) — fully managed.<\/li>\n<li>Stateless apps (producers, consumers, Streams) deploy as normal Deployments. Streams with state benefit from StatefulSets/persistent volumes (faster restore) or standby replicas.<\/li>\n<li>Rolling restarts: one broker at a time, wait until <code>UnderReplicatedPartitions=0<\/code> before restarting the next. Controlled shutdown (<code>controlled.shutdown.enable=true<\/code>) moves leaders first.<\/li>\n<li>KRaft mode (no ZooKeeper) is the default in Kafka 4.x.<\/li>\n<\/ul>\n", "minutes": 13}, {"id": "6", "folder": "6.kafka-streams", "title": "Kafka Streams", "desc": "KStream/KTable, state, EOS, DSL vs Processor API", "kind": "core", "html": "<h2>Kafka Streams: Building Real-Time Applications and Microservices<\/h2>\n<p>Kafka Streams is a client library designed to build real-time applications and microservices, with data both inputted and outputted to Kafka clusters. It marries the simplicity of developing and deploying standard Java and Scala applications with the power of Kafka's server-side capabilities.<\/p>\n<h3>Core Concepts of Kafka Streams<\/h3>\n<ul>\n<li><strong>Stream Processing<\/strong>: Fundamentals of processing records in real-time from Kafka topics.<\/li>\n<li><strong>Topology<\/strong>: A graph of stream processors (nodes) connected by streams (edges), defining the flow of data.<\/li>\n<li><strong>KStreams and KTables<\/strong>: KStreams represent a continuous stream of data, while KTables represent a changelog stream, akin to a table in a database.<\/li>\n<\/ul>\n<h3>Know the Differences between KStream and KTable<\/h3>\n<ul>\n<li>KStream processes each record as an independent event, while KTable treats each record as an update.<\/li>\n<li>KStream is useful for processing individual events, while KTable is suitable for maintaining the latest value for a given key.<\/li>\n<li>KStream supports record-by-record transformations, while KTable allows aggregations and joins based on a key.<\/li>\n<\/ul>\n<h3>Identify the Appropriate Use Cases<\/h3>\n<ul>\n<li>Use KStream when you need to process each record independently, perform stateless transformations, or handle unbounded data.<\/li>\n<li>Use KTable when you need to perform aggregations, joins, or maintain a materialized view of the latest values for each key.<\/li>\n<\/ul>\n<p>Stream-table duality:<\/p>\n<ul>\n<li><strong>Stream as Table:<\/strong> A stream can be viewed as a changelog of a table, where each data record in the stream captures a state change of the table. A stream can be turned into a 'real' table by replaying the changelog from the beginning to reconstruct the table.<\/li>\n<li><strong>Table as Stream:<\/strong> A table can be viewed as a snapshot of the latest value for each key in a stream. A table can be turned into a 'real' stream by iterating over each key-value entry in the table.<\/li>\n<\/ul>\n<h3>Fundamental Components<\/h3>\n<ul>\n<li><strong>Stream Processor<\/strong>: A fundamental unit that processes each incoming record, capable of transforming, filtering, or aggregating data streams.<\/li>\n<li><strong>State Stores<\/strong>: Facilitate storing state for stateful operations, enabling functionalities like windowing and interactive queries.<\/li>\n<\/ul>\n<h3>Permanent State Stores in Kafka Streams:<\/h3>\n<ul>\n<li><strong>Definition:<\/strong> Permanent state stores are used in Kafka Streams to persistently store and manage stateful data across reboots and restarts.<\/li>\n<li><strong>Types:<\/strong> Includes key-value stores, window stores, and session stores.<\/li>\n<li><strong>Usage:<\/strong> Essential for operations like aggregations, joins, and windowing which require maintaining state over time.<\/li>\n<li><strong>Configuration:<\/strong> Defined in the Kafka Streams API using <code>Stores.persistentKeyValueStore()<\/code>, <code>Stores.persistentWindowStore()<\/code>, etc.<\/li>\n<li><strong>Resource Management:<\/strong> Always close Iterators after use to prevent resource leaks and Out-Of-Memory (OOM) issues.<\/li>\n<li><strong>Recovery:<\/strong> State stores support fault tolerance by restoring state from changelog topics on restart.<\/li>\n<li><strong>Performance:<\/strong> Performance can be optimized by configuring RocksDB, the default storage engine for state stores.<\/li>\n<li><strong>Scaling:<\/strong> State stores can be scaled across multiple instances using partitioning and sharding.<\/li>\n<li><strong>Monitoring:<\/strong> Monitor metrics related to state stores, such as cache hit rates and store sizes, to ensure efficient operation.<\/li>\n<\/ul>\n<h3>Key Features<\/h3>\n<ul>\n<li><strong>Time Windowing<\/strong>: Execute operations on data within specific time frames, crucial for temporal data analysis.<\/li>\n<li><strong>Stateful Operations<\/strong>: Perform computations that require maintaining a state, such as joins, aggregations, and windowed computations.<\/li>\n<li><strong>Exactly-Once Semantics<\/strong>: Ensure each record is processed exactly once, crucial for fault-tolerant processing.<\/li>\n<\/ul>\n<h3>Developing with Kafka Streams<\/h3>\n<h4>Building a Stream Processing Application<\/h4>\n<p>Steps include setting up the project, defining the topology, and integrating stream processors with Kafka topics.<\/p>\n<pre><code>StreamsBuilder builder = new StreamsBuilder();\nKStream&lt;String, String&gt; textLines = builder.stream(&quot;inputTopic&quot;);\nKTable&lt;String, Long&gt; wordCounts = textLines\n    .flatMapValues(textLine -&gt; Arrays.asList(textLine.toLowerCase().split(&quot;\\\\W+&quot;)))\n    .groupBy((key, word) -&gt; word)\n    .count(Materialized.as(&quot;countsStore&quot;));\nwordCounts.toStream().to(&quot;outputTopic&quot;, Produced.with(Serdes.String(), Serdes.Long()));\n<\/code><\/pre>\n<h4>Application Configuration<\/h4>\n<p>Critical configurations for Kafka Streams applications include the application ID, bootstrap servers, and key-value serializers/deserializers.<\/p>\n<h3>Advanced Concepts and Operations<\/h3>\n<h4>Stateless and Stateful Operators<\/h4>\n<ul>\n<li><strong>Stateless<\/strong>: Operations like <code>map<\/code>, <code>filter<\/code>, and <code>foreach<\/code> that don't maintain state.<\/li>\n<li><strong>Stateful<\/strong>: Operations such as <code>join<\/code>, <code>aggregate<\/code>, and <code>count<\/code>, which maintain state over time or across keys.<\/li>\n<\/ul>\n<h4>Window Types<\/h4>\n<ul>\n<li><strong>Tumbling Window<\/strong>: Fixed-size, non-overlapping, time-based windows (<code>TimeWindows.ofSizeWithNoGrace(...)<\/code> / <code>ofSizeAndGrace(...)<\/code>; the old <code>TimeWindows.of(...)<\/code> is removed in 4.0).<\/li>\n<\/ul>\n<pre><code>When the advance interval is equal to the window size, it is called a tumbling window.\n[0:00─────5:00][5:00─────10:00][10:00────15:00]\n<\/code><\/pre>\n<ul>\n<li><strong>Hopping Window<\/strong>: Fixed-size, overlapping time windows.<\/li>\n<\/ul>\n<pre><code>Windows for which the size is a fixed time interval are called hopping windows.&quot;\n[0:00────5:00]\n  [1:00────6:00]\n    [2:00────7:00]\n<\/code><\/pre>\n<ul>\n<li><strong>Sliding Window<\/strong>: Overlapping windows based on time difference between records.<\/li>\n<li><strong>Session Window<\/strong>: Dynamically sized, non-overlapping windows based on activity sessions.<\/li>\n<\/ul>\n<pre><code>Gap = 30 min:\nUser1: clik t=1:00, clik t=1:05, clik t=1:20\n       └──────────── session 1 ───────────┘\n                                          (inactive &gt; 30 min)\nUser1: clik t=2:30, clik t=2:45\n       └───── session 2 ─────┘\n\n<\/code><\/pre>\n<h4>SerDes and Streams DSL<\/h4>\n<ul>\n<li><strong>SerDes<\/strong>: Serialization and Deserialization frameworks essential for data interpretation in Kafka Streams.<\/li>\n<li><strong>Streams DSL<\/strong>: High-level domain-specific language to define stream processing topologies, including <code>KStream<\/code>, <code>KTable<\/code>, and <code>GlobalKTable<\/code>.<\/li>\n<\/ul>\n<h4>Join Operations<\/h4>\n<p>Using the Streams API, the following join operations are supported, with joins being either windowed or non-windowed depending on the operands:<\/p>\n<ul>\n<li><strong>KStream-to-KStream (windowed, requires <code>JoinWindows<\/code>):<\/strong> Supports inner join, left join, and outer join.<\/li>\n<li><strong>KTable-to-KTable (non-windowed):<\/strong> Supports inner join, left join, and outer join.<\/li>\n<li><strong>KStream-to-KTable (non-windowed):<\/strong> Supports inner join and left join. Outer join is not supported.<\/li>\n<li><strong>KStream-to-GlobalKTable (non-windowed):<\/strong> Supports inner join and left join. Outer join is not supported.<\/li>\n<\/ul>\n<h3>Message Delivery Guarantees<\/h3>\n<p>Kafka supports three types of message delivery guarantees:<\/p>\n<ul>\n<li><strong>At-most-once:<\/strong> Every message is persisted in Kafka at most once. Message loss is possible if the producer doesn't retry on failures.<\/li>\n<li><strong>At-least-once:<\/strong> Every message is guaranteed to be persisted in Kafka at least once. There is no chance of message loss, but messages can be duplicated if the producer retries after the message is already persisted.<\/li>\n<li><strong>Exactly-once:<\/strong> Every message is guaranteed to be persisted in Kafka exactly once without any duplicates or data loss, even in the event of broker failures or producer retries.<\/li>\n<\/ul>\n<p>Exactly-once processing can be achieved for Kafka-to-Kafka workflows using the Kafka Streams API. For Kafka-to-sink workflows, an idempotent consumer is required.<\/p>\n<p>Stream processing applications written with the Kafka Streams library can enable exactly-once semantics by setting the <code>processing.guarantee<\/code> configuration to <code>exactly_once_v2<\/code> (the default value is <code>at_least_once<\/code>; the older <code>exactly_once<\/code> / <code>exactly_once_beta<\/code> values are deprecated and removed in Kafka 4.0). This change requires no code modifications.<\/p>\n<h3>Co-Partitioning<\/h3>\n<p>Co-partitioning is a concept in Kafka where two or more topics have their partit
