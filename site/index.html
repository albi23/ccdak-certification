ions aligned in such a way that the same partition numbers across these topics contain related data. This alignment is crucial for operations that involve joining data streams, ensuring that related data from different topics can be processed together efficiently. Here are the key rules and considerations for achieving co-partitioning in Kafka:<\/p>\n<ol>\n<li>\n<p><strong>Same Number of Partitions<\/strong>: Co-partitioned topics must have the same number of partitions. This ensures that data which is logically related and keyed similarly ends up in the corresponding partition across these topics.<\/p>\n<\/li>\n<li>\n<p><strong>Consistent Partitioning Strategy<\/strong>: To ensure that related messages from different topics land in the corresponding partitions, a consistent partitioning strategy must be used. This often involves ensuring that messages are produced with the same key and that the default partitioner or a custom partitioner is used consistently across these topics.<\/p>\n<\/li>\n<li>\n<p><strong>Parallel Consumer Processing<\/strong>: When consuming from co-partitioned topics, ensure that the consumer groups are configured to consume in parallel from all the related partitions. This is typically handled naturally by Kafka's consumer group mechanism when the topics are consumed together.<\/p>\n<\/li>\n<li>\n<p><strong>Kafka Streams and KTable<\/strong>: In Kafka Streams, co-partitioning is essential when performing join operations between KStreams and KTables or between KStreams themselves. Kafka Streams does NOT automatically co-partition topics: it only checks that the joined source topics have the same number of partitions (otherwise it throws a <code>TopologyException<\/code>). Co-partitioning is the developer's responsibility (same key, same partitioner, same partition count). Streams only repartitions automatically when the key was changed upstream (e.g. <code>selectKey<\/code>, <code>map<\/code>, <code>groupBy<\/code>), which adds an internal repartition topic. A <code>GlobalKTable<\/code> join does not require co-partitioning.<\/p>\n<\/li>\n<li>\n<p><strong>Use Case for Co-Partitioning<\/strong>: Co-partitioning is often used in scenarios requiring data aggregation or join operations across different data streams that share a logical relationship, such as aggregating user click events with user profile information for real-time analytics.<\/p>\n<\/li>\n<li>\n<p><strong>Management and Maintenance<\/strong>: When scaling out (adding more partitions to topics), ensure that all co-partitioned topics are scaled consistently. This might require manual intervention or custom tooling, as Kafka does not automatically manage the partition count across topics to maintain co-partitioning.<\/p>\n<\/li>\n<li>\n<p><strong>Producing to Co-Partitioned Topics<\/strong>: When producing messages to co-partitioned topics, ensure that the keys used for partitioning are consistent and that messages destined to be joined together use the same keys.<\/p>\n<\/li>\n<\/ol>\n<h3>Parallel processing<\/h3>\n<p>Kafka Streams scales by allowing multiple threads of execution within one instance of the application and by supporting load balancing between distributed instances of the application. You can run the Streams application on one machine with multiple threads or on multiple machines. In either case, all active threads in the application will balance the data processing work.<\/p>\n<p>The Streams engine parallelizes the execution of a topology by splitting it into tasks. The number of tasks is determined by the Streams engine and depends on the number of partitions in the topics that the application processes. Each task is responsible for a subset of the partitions: the task subscribes to those partitions and consumes events from them. For every event it consumes, the task executes all the processing steps that apply to this partition in order before eventually writing the result to the sink. These tasks are the basic unit of parallelism in Kafka Streams, as each task can execute independently of others.<\/p>\n<p>The maximum parallelism equals the number of tasks (driven by the number of input partitions). Set <code>num.stream.threads<\/code> to the desired number of threads per instance. Threads beyond the number of tasks stay idle, so there is no benefit in exceeding the number of partitions.<\/p>\n<h3>Repartitioning<\/h3>\n<p>When Kafka Streams requires repartitioning, it:<\/p>\n<ol>\n<li>Writes the repartitioned data to a new topic with new keys and partitions.<\/li>\n<li>Creates a new set of tasks to read and process events from the new topic.<\/li>\n<\/ol>\n<p>This process divides the topology into two subtopologies, each with its own tasks. The second subtopology depends on the output of the first.<\/p>\n<p>The two sets of tasks can still run independently and in parallel because:<\/p>\n<ul>\n<li>The first set writes data to the new topic at its own pace.<\/li>\n<li>The second set consumes and processes events from the new topic independently.<\/li>\n<\/ul>\n<p>There is no communication or shared resources between the tasks, allowing them to run on separate threads or servers.<\/p>\n<h2>Understand the Available Operations<\/h2>\n<ul>\n<li>KStream operations:<\/li>\n<li><code>map<\/code>: Applies a one-to-one transformation to each record in the stream.\nExample:<pre><code class=\"language-java\">KStream&lt;String, Integer&gt; doubled = stream.map((key, value) -&gt; new KeyValue&lt;&gt;(key, value * 2));\n<\/code><\/pre>\n<\/li>\n<li><code>filter<\/code>: Filters records based on a predicate.\nExample:<pre><code class=\"language-java\">KStream&lt;String, Integer&gt; filtered = stream.filter((key, value) -&gt; value &gt; 100);\n<\/code><\/pre>\n<\/li>\n<li><code>flatMap<\/code>: Applies a one-to-many transformation to each record, flattening the result into a new stream.\nExample:<pre><code class=\"language-java\">KStream&lt;String, String&gt; words = stream.flatMapValues(value -&gt; Arrays.asList(value.split(&quot;\\\\s+&quot;)));\n<\/code><\/pre>\n<\/li>\n<li><code>branch<\/code>: Splits a stream into multiple streams based on predicates.\nExample:<pre><code class=\"language-java\">stream.split()\n      .branch((key, value) -&gt; value &gt; 100, Branched.withConsumer(big -&gt; big.to(&quot;big-topic&quot;)))\n      .defaultBranch(Branched.withConsumer(small -&gt; small.to(&quot;small-topic&quot;)));\n<\/code><\/pre>\n(<code>KStream#branch(Predicate...)<\/code> is deprecated and removed in Kafka 4.0; use <code>split()<\/code>.)<\/li>\n<li><code>merge<\/code>: Merges multiple streams into a single stream.\nExample:<pre><code class=\"language-java\">KStream&lt;String, Integer&gt; merged = stream1.merge(stream2);\n<\/code><\/pre>\n<\/li>\n<li>KTable operations (a KTable is grouped with <code>groupBy<\/code>, which returns a <code>KGroupedTable<\/code> and requires an adder and a subtractor for <code>aggregate<\/code>/<code>reduce<\/code>; <code>groupByKey<\/code> exists only on KStream):<\/li>\n<li><code>aggregate<\/code>: Performs an aggregation on the records of a grouped KTable.\nExample:<pre><code class=\"language-java\">KTable&lt;String, Long&gt; sums = table.groupBy((key, value) -&gt; KeyValue.pair(value.category(), value.amount()), Grouped.with(Serdes.String(), Serdes.Long()))\n    .aggregate(() -&gt; 0L, (aggKey, newValue, aggValue) -&gt; aggValue + newValue, (aggKey, oldValue, aggValue) -&gt; aggValue - oldValue);\n<\/code><\/pre>\n<\/li>\n<li><code>reduce<\/code>: Combines the records of a grouped KTable based on adder and subtractor functions.\nExample:<pre><code class=\"language-java\">KTable&lt;String, Integer&gt; reduced = table.groupBy((key, value) -&gt; KeyValue.pair(key, value)).reduce((agg, v) -&gt; agg + v, (agg, old) -&gt; agg - old);\n<\/code><\/pre>\n<\/li>\n<li><code>join<\/code>: Joins two KTables based on their keys.\nExample:<pre><code class=\"language-java\">KTable&lt;String, String&gt; joined = table1.join(table2, (value1, value2) -&gt; value1 + &quot;-&quot; + value2);\n<\/code><\/pre>\n<\/li>\n<li><code>groupBy<\/code>: Groups the records of a KTable based on a new key.\nExample:<pre><code class=\"language-java\">KGroupedTable&lt;Integer, Integer&gt; grouped = table.groupBy((key, value) -&gt; KeyValue.pair(value % 10, value));\n<\/code><\/pre>\n<\/li>\n<li><code>count<\/code>: Counts the number of records in a KTable.\nExample:<pre><code class=\"language-java\">KTable&lt;Integer, Long&gt; counts = table.groupBy((key, value) -&gt; KeyValue.pair(value % 10, value)).count();\n<\/code><\/pre>\n<\/li>\n<\/ul>\n<h2>Be Familiar with the Syntax and APIs<\/h2>\n<ul>\n<li>Creating a KStream:<\/li>\n<\/ul>\n<pre><code class=\"language-java\">KStream&lt;String, String&gt; stream = builder.stream(&quot;input-topic&quot;);\n<\/code><\/pre>\n<ul>\n<li>Creating a KTable:<\/li>\n<\/ul>\n<pre><code class=\"language-java\">KTable&lt;String, String&gt; table = builder.table(&quot;input-topic&quot;);\n<\/code><\/pre>\n<ul>\n<li>Performing transformations:<\/li>\n<\/ul>\n<pre><code class=\"language-java\">KStream&lt;String, Integer&gt; transformed = stream.mapValues(value -&gt; value.length());\n<\/code><\/pre>\n<ul>\n<li>Aggregating data:<\/li>\n<\/ul>\n<pre><code class=\"language-java\">KTable&lt;String, Long&gt; aggregated = stream.groupByKey().count();\n<\/code><\/pre>\n<ul>\n<li>Joining streams and tables:<\/li>\n<\/ul>\n<pre><code class=\"language-java\">KStream&lt;String, String&gt; joined = stream.leftJoin(table, (streamValue, tableValue) -&gt; streamValue + &quot;-&quot; + tableValue);\n<\/code><\/pre>\n<h3>Best Practices for Kafka Streams<\/h3>\n<ul>\n<li><strong>State Management<\/strong>: Leverage state stores and interactive queries efficiently to manage state.<\/li>\n<li><strong>Scaling and Performance<\/strong>: Apply strategies to scale applications horizontally and optimize performance through tuning and configuration adjustments.<\/li>\n<li>It is recommended to store Kafka Streams application state on a <strong>persistent volume<\/strong> to minimize recovery time by only restoring the missing state upon failure or restart.<\/li>\n<\/ul>\n<p>Kafka Streams offers a comprehensive set of tools and functionalities for building robust, real-time streaming applications, leveraging Kafka's strengths in handling vast streams of data efficiently and reliably.<\/p>\n<h2>Kafka Streams vs Plain Consumer/Producer (CCDAK)<\/h2>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Consumer/Producer API<\/th>\n<th>Kafka Streams<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Nature<\/td>\n<td>Low-level clients<\/td>\n<td>Library on top of them (embedded in your app, no separate cluster)<\/td>\n<\/tr>\n<tr>\n<td>State<\/td>\n<td>You manage it yourself<\/td>\n<td>Built-in <strong>state stores<\/strong> (RocksDB + changelog topics)<\/td>\n<\/tr>\n<tr>\n<td>Operations<\/td>\n<td>Manual<\/td>\n<td>Declarative: map, filter, groupBy, aggregate, join, windowing<\/td>\n<\/tr>\n<tr>\n<td>Scaling<\/td>\n<td>Consumer group<\/td>\n<td>Consumer group underneath. <strong>Tasks<\/strong> = partitions (max parallelism = number of input partitions). Threads (<code>num.stream.threads<\/code>) + more instances<\/td>\n<\/tr>\n<tr>\n<td>Fault tolerance<\/td>\n<td>Manual<\/td>\n<td>Automatic state restore from changelog topics, standby replicas (<code>num.standby.replicas<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Exactly-once<\/td>\n<td>Manual transactions<\/td>\n<td><code>processing.guarantee=exactly_once_v2<\/code><\/td>\n<\/tr>\n<tr>\n<td>Output<\/td>\n<td>Topic-to-anywhere<\/td>\n<td>Kafka topic → Kafka topic only (use Connect for other systems)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Stateless vs Stateful (CCDAK)<\/h2>\n<ul>\n<li><strong>Stateless<\/strong> (no store, record-by-record): <code>map<\/code>, <code>mapValues<\/code>, <code>filter<\/code>, <code>filterNot<\/code>, <code>flatMap<\/code>, <code>flatMapValues<\/code>, <code>peek<\/code>, <code>foreach<\/code>, <code>branch/split<\/code>, <code>selectKey<\/code>, <code>merge<\/code>.<\/li>\n<li><strong>Stateful<\/strong> (need state store): <code>count<\/code>, <code>reduce<\/code>, <code>aggregate<\/code>, joins, windowed aggregations, <code>KTable<\/code> materialization.<\/li>\n<li><code>selectKey<\/code>/<code>map<\/code> can change the key → <strong>repartition topic<\/strong> is created before a later stateful op. <code>mapValues<\/code>/<code>flatMapValues<\/code> don't change the key → no repartition.<\/li>\n<\/ul>\n<h2>Exactly-Once in Kafka Streams (CCDAK)<\/h2>\n<ul>\n<li>Enable: <code>processing.guarantee=exactly_once_v2<\/code> (needs brokers ≥ 2.5; <code>exactly_once<\/code> deprecated and removed in 4.0). Default is <code>at_least_once<\/code>.<\/li>\n<li>Under the hood: idempotent producer + <strong>transactions<\/strong> that atomically commit (1) output records, (2) state-store changelog writes and (3) consumed input offsets (in <code>__consumer_offsets<\/code>) in one transaction per commit interval.<\/li>\n<li>Downstream consumers need <code>isolation.level=read_committed<\/code>.<\/li>\n<li><code>commit.interval.ms<\/code> defaults to <strong>100 ms<\/strong> with EOS (30 000 ms with at-least-once) — lower latency but more transactions.<\/li>\n<li>Requires broker <code>transaction.state.log.replication.factor<\/code> / <code>min.isr<\/code> (3 / 2 by default in production).<\/li>\n<li>EOS covers Kafka → Kafka processing only. Side effects (HTTP calls, DB writes) are not covered.<\/li>\n<\/ul>\n<h2>DSL vs Processor API (CCDAK)<\/h2>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Streams <strong>DSL<\/strong><\/th>\n<th><strong>Processor API<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Level<\/td>\n<td>High-level, declarative (<code>StreamsBuilder<\/code>, <code>KStream<\/code>, <code>KTable<\/code>)<\/td>\n<td>Low-level, imperative (<code>Topology<\/code>, <code>Processor<\/code>, <code>ProcessorContext<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Operations<\/td>\n<td>Predefined operators<\/td>\n<td>Anything: custom logic, custom state-store access<\/td>\n<\/tr>\n<tr>\n<td>Control<\/td>\n<td>Limited<\/td>\n<td>Full control of when records are forwarded, <strong>punctuations<\/strong> (scheduled callbacks by stream-time or wall-clock), manual commits<\/td>\n<\/tr>\n<tr>\n<td>Effort<\/td>\n<td>Less code, recommended default<\/td>\n<td>More code and responsibility<\/td>\n<\/tr>\n<tr>\n<td>State<\/td>\n<td>Managed behind operators<\/td>\n<td>Add/attach <code>StateStore<\/code> to processor explicitly<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>They can be mixed: DSL <code>process()<\/code> / <code>transform()<\/code> (<code>processValues<\/code>) hook a custom <code>Processor<\/code> into a DSL topology.<\/li>\n<li>Use the Processor API when you need custom timing (punctuate), non-standard state access, or logic the DSL can't express.<\/li>\n<li>Topology is a DAG of <strong>source<\/strong> → <strong>processor<\/strong> nodes → <strong>sink<\/strong>. <code>topology.describe()<\/code> prints it.<\/li>\n<\/ul>\n", "minutes": 13}, {"id": "7", "folder": "7.kafka-connect", "title": "Kafka Connect", "desc": "Workers, connectors, SMT, REST API, offsets, scalability", "kind": "core", "html": "<blockquote>\n<p>🚫 = outside the CCDAK exam scope (see exam blueprint)<\/p>\n<\/blockquote>\n<h2>Kafka Connect Overview<\/h2>\n<p>Kafka Connect is a tool specifically designed for streaming data between Apache Kafka and other systems.<\/p>\n<ul>\n<li>A common framework for Kafka connectors.<\/li>\n<li>Distributed and standalone modes.<\/li>\n<li>REST interface.<\/li>\n<li>Automatic offset management.<\/li>\n<li>Distributed and scalable by default.<\/li>\n<li>Streaming/batch integration.<\/li>\n<\/ul>\n<h3>Key Concepts<\/h3>\n<ul>\n<li><strong>Connectors<\/strong>: The components in Kafka Connect that implement the connection to other systems. There are two types of connectors: Source connectors for importing data into Kafka, and Sink connectors for exporting data from Kafka.<\/li>\n<li><strong>Tasks<\/strong>: The actual workers that perform the data import or export. Each connector could be split into multiple tasks that can be distributed over a cluster for scalability and fault tolerance.<\/li>\n<li><strong>Converters<\/strong>: Responsible for converting data between Kafka Connect's internal data format and the format required by external systems.<\/li>\n<\/ul>\n<h3>Core Components<\/h3>\n<ul>\n<li><strong>Worker<\/strong>: The runtime environment where connectors and tasks are executed. Workers can be standalone (single process) or distributed across multiple nodes.<\/li>\n<li><strong>REST API<\/strong>: Kafka Connect provides a REST API for managing connectors and tasks, making it easy to deploy and monitor without writing any code.<\/li>\n<\/ul>\n<h3>Key Connector configurations<\/h3>\n<p>Connector configurations are simple key-value mappings. In standalone mode, these are defined in a properties file and passed to the Connect process on the command line. In distributed mode, they are included in the JSON payload for the request that creates or modifies the connector.<\/p>\n<p>Most configurations are connector-dependent, so they can't be outlined here. However, there are a few common options:<\/p>\n<ul>\n<li><strong>name:<\/strong> Unique name for the connector. Attempting to register again with the same name will fail.<\/li>\n<li><strong>connector.class:<\/strong> The Java class for the connector.<\/li>\n<li><strong>tasks.max:<\/strong> The maximum number of tasks that should be created for this connector. The connector may create fewer tasks if it cannot achieve this level of parallelism.<\/li>\n<li><strong>key.converter:<\/strong> (Optional) Override the default key converter set by the worker.<\/li>\n<li><strong>value.converter:<\/strong> (Optional) Override the default value converter set by the worker.<\/li>\n<\/ul>\n<h3>Important Operations<\/h3>\n<ul>\n<li><strong>Configuring Connectors<\/strong>: Understand how to configure source and sink connectors, including specifying the name of the Kafka topics to use, the key and value converters, and any connector-specific settings.<pre><code class=\"language-json\">{\n  &quot;name&quot;: &quot;example-connector&quot;,\n  &quot;config&quot;: {\n    &quot;connector.class&quot;: &quot;org.example.MyConnector&quot;,\n    &quot;tasks.max&quot;: &quot;1&quot;,\n    &quot;topics&quot;: &quot;my-topic&quot;,\n    &quot;key.converter&quot;: &quot;org.apache.kafka.connect.storage.StringConverter&quot;,\n    &quot;value.converter&quot;: &quot;org.apache.kafka.connect.json.JsonConverter&quot;,\n    &quot;value.converter.schemas.enable&quot;: &quot;false&quot;,\n    ...\n  }\n}\n<\/code><\/pre>\n<\/li>\n<li><strong>Deploying and Scaling<\/strong>: Knowledge on deploying connectors in a distributed mode to leverage Kafka Connect's scalability and fault tolerance.<\/li>\n<li><strong>Monitoring and Managing Connectors<\/strong>: Using the REST API to monitor the health and performance of connectors and tasks, and to dynamically adjust their configuration.<\/li>\n<\/ul>\n<h3>Best Practices<\/h3>\n<ul>\n<li><strong>Error Handling and Retry Policies<\/strong>: Implement robust error handling and retry mechanisms to ensure resilience and reliability.<\/li>\n<li><strong>Offset Management<\/strong>: Proper management of offsets to ensure accurate and reliable data processing.<\/li>\n<li><strong>Securing Kafka Connect<\/strong>: Apply security configurations, including encryption and authentication, to protect data in transit and at rest.<\/li>\n<\/ul>\n<h3>REST API Operations<\/h3>\n<p>Kafka Connect's REST API provides comprehensive control over connectors and tasks, allowing for dynamic management without direct code intervention.<\/p>\n<ul>\n<li><strong>Worker Information<\/strong>: Retrieve details about Kafka Connect workers.<\/li>\n<li><strong>Connectors Management<\/strong>: List, create, update, pause, resume, and delete connectors.<\/li>\n<li><strong>Tasks Management<\/strong>: Monitor and manage the individual tasks of each connector.<\/li>\n<li><strong>Configuration Management<\/strong>: View and update connector configurations.<\/li>\n<\/ul>\n<h3>Internal Topics of Kafka Connect<\/h3>\n<p>In <strong>distributed mode<\/strong>, Kafka Connect maintains its state, configuration, and progress in <strong>three<\/strong> internal Kafka topics. Their names are not fixed by Kafka — you set them with the worker configs below — but there is a widely used convention (also the default in Confluent's sample <code>connect-distributed.properties<\/code>):<\/p>\n<table>\n<thead>\n<tr>\n<th>Worker config<\/th>\n<th>Stores<\/th>\n<th>Conventional name<\/th>\n<th>Recommended settings<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>config.storage.topic<\/code><\/td>\n<td>Connector <strong>and<\/strong> task configurations<\/td>\n<td><code>connect-configs<\/code><\/td>\n<td>1 partition, <code>cleanup.policy=compact<\/code>, RF ≥ 3<\/td>\n<\/tr>\n<tr>\n<td><code>offset.storage.topic<\/code><\/td>\n<td>Source-connector offsets (progress tracking)<\/td>\n<td><code>connect-offsets<\/code><\/td>\n<td>~25 partitions, <code>cleanup.policy=compact<\/code>, RF ≥ 3<\/td>\n<\/tr>\n<tr>\n<td><code>status.storage.topic<\/code><\/td>\n<td>Connector and task state/status<\/td>\n<td><code>connect-status<\/code><\/td>\n<td>~5 partitions, <code>cleanup.policy=compact<\/code>, RF ≥ 3<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Notes:<\/p>\n<ul>\n<li>There is <strong>no separate task-config topic<\/strong>: connector config <em>and<\/em> task config both live in the single <code>config.storage.topic<\/code>.<\/li>\n<li>All three topics are <strong>log-compacted<\/strong> so only the latest value per key is retained.<\/li>\n<li>Set replication factors with <code>config.storage.replication.factor<\/code>, <code>offset.storage.replication.factor<\/code>, and <code>status.storage.replication.factor<\/code> (use ≥ 3 in production).<\/li>\n<li>It is recommended to <strong>create these topics manually<\/strong> so you control the partition count, replication factor, and compaction policy before the workers start.<\/li>\n<li>The Confluent Platform Docker images default these names to <code>connect-configs<\/code>, <code>connect-offsets<\/code>, <code>connect-status<\/code> (sometimes prefixed, e.g. <code>docker-connect-...<\/code>).<\/li>\n<\/ul>\n<p>In <strong>standalone mode<\/strong> there are no such Kafka topics — offsets are kept in a <strong>local file<\/strong> given by <code>offset.storage.file.filename<\/code> (e.g. <code>/tmp/connect.offsets<\/code>), and configuration comes directly from the <code>.properties<\/code> files.<\/p>\n<blockquote>\n<p>Separately, <strong>sink<\/strong> connectors consume via a normal consumer group, so their consumer offsets live in Kafka's <code>__consumer_offsets<\/code> topic — that is a general Kafka internal topic, not a Connect-specific one.<\/p>\n<\/blockquote>\n<p>These internal topics enable Kafka Connect to recover from failures, ensuring robust and reliable data streaming.<\/p>\n<h3>Configuration Options<\/h3>\n<h4>Common Worker Configurations<\/h4>\n<ul>\n<li><strong><code>bootstrap.servers<\/code><\/strong>: The Kafka cluster to connect to.<\/li>\n<li><strong><code>key.converter<\/code><\/strong> and <strong><code>value.converter<\/code><\/strong>: Converters for record keys and values.<\/li>\n<li><strong><code>offset.flush.interval.ms<\/code><\/strong>: Frequency at which to save offsets.<\/li>\n<li><strong><code>plugin.path<\/code><\/strong>: Path to directory containing Kafka Connect plugins.<\/li>\n<\/ul>\n<h4>Additional Configurations<\/h4>\n<ul>\n<li><strong>Standalone mode<\/strong>:<\/li>\n<li><code>offset.storage.file.filename<\/code>: File to store offset data<\/li>\n<li><strong>Distributed mode<\/strong>:<\/li>\n<li><code>group.id<\/code>: Unique name for the cluster<\/li>\n<li><code>config.storage.topic<\/code>: Topic for storing connector and task configurations<\/li>\n<li><code>offset.storage.topic<\/code>: Topic for storing offsets<\/li>\n<li><code>status.storage.topic<\/code>: Topic for storing statuses<\/li>\n<\/ul>\n<h4>Distributed Worker Configurations<\/h4>\n<ul>\n<li><strong><code>group.id<\/code><\/strong>: Unique identifier for the Kafka Connect cluster.<\/li>\n<li><strong><code>config.storage.topic<\/code><\/strong> and <strong><code>offset.storage.topic<\/code><\/strong>: Kafka topics for storing connector and task configurations and offsets.<\/li>\n<\/ul>\n<p>In distributed mode for Kafka Connect, key features include automatic work balancing, dynamic scaling, and fault tolerance. While configuration parameters are similar to standalone mode, the storage locations and classes differ. In distributed mode, Kafka Connect stores offsets, configurations, and task statuses in Kafka topics. It is recommended to manually create these topics to achieve the desired number of partitions and replication factors.<\/p>\n<p>Execution is similar to standalone mode:<\/p>\n<pre><code>bin/connect-distributed.sh config/connect-distributed.properties\n<\/code><\/pre>\n<h4>🚫 JDBC Sink Configuration Options<\/h4>\n<ul>\n<li><strong><code>connection.url<\/code><\/strong>, <strong><code>connection.user<\/code><\/strong>, <strong><code>connection.password<\/code><\/strong>: Database connection details.<\/li>\n<li><strong><code>insert.mode<\/code><\/strong>: Mode of inserting data into the database.<\/li>\n<li><strong><code>auto.create<\/code><\/strong> and <strong><code>auto.evolve<\/code><\/strong>: Automatically create and modify database schemas.<\/li>\n<\/ul>\n<h3>Connector Types<\/h3>\n<ul>\n<li><strong>Source Connectors<\/strong>: Import data from external systems into Kafka.<\/li>\n<li><strong>Sink Connectors<\/strong>: Export data from Kafka to external systems.<\/li>\n<\/ul>\n<h3>🚫 Source Connectors (system-specific connectors)<\/h3>\n<p>These connectors ingest data from external systems into Kafka topics.<\/p>\n<ul>\n<li><strong>JDBC Source Connector<\/strong>: Ingests data from relational databases into Kafka.<\/li>\n<li><strong>File Source Connector<\/strong>: Reads files from a file system and ingests their contents into Kafka topics.<\/li>\n<li><strong>MQTT Source Connector<\/strong>: Integrates IoT device data communicated over MQTT protocol into Kafka.<\/li>\n<li><strong>Twitter Source Connector<\/strong>: Streams live tweets directly into Kafka topics (legacy community connector).<\/li>\n<\/ul>\n<h3>🚫 Sink Connectors (system-specific connectors)<\/h3>\n<p>These connectors export data from Kafka topics to external systems.<\/p>\n<ul>\n<li><strong>JDBC Sink Connector<\/strong>: Exports data from Kafka topics to relational databases.<\/li>\n<li><strong>HDFS Sink Connector<\/strong>: Moves data from Kafka topics into HDFS (Hadoop Distributed File System), commonly used in big data environments.<\/li>\n<li><strong>Elasticsearch Sink Connector<\/strong>: Exports data from Kafka topics into Elasticsearch for search and analytics.<\/li>\n<li><strong>S3 Sink Connector<\/strong>: Stores data from Kafka topics into Amazon S3 for durable, long-term storage.<\/li>\n<\/ul>\n<h3>🚫 MQTT Proxy and Connector<\/h3>\n<ul>\n<li><strong>MQTT (Message Queuing Telemetry Transport)<\/strong> is a lightweight messaging protocol for small sensors and mobile devices optimized for high-latency or unreliable networks.<\/li>\n<li>An <strong>MQTT proxy<\/strong> allows Kafka to directly ingest data from IoT devices using the MQTT protocol.<\/li>\n<li>An <strong>MQTT connector<\/strong> (typically a Kafka Connect connector) serves a similar purpose, facilitating data flow from MQTT-enabled devices into Kafka topics.<\/li>\n<\/ul>\n<h3>🚫 JDBC Connectors<\/h3>\n<ul>\n<li><strong>JDBC (Java Database Connectivity)<\/strong> connectors are used within Kafka Connect for integrating Kafka with relational databases.\n<ul>\n<li>A <strong>JDBC source connector<\/strong> pulls data from a database into Kafka topics.<\/li>\n<li>A <strong>JDBC sink connector<\/strong> moves data from Kafka topics into a database.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>Single Message Transforms (SMT)<\/h3>\n<ul>\n<li><strong>SMTs<\/strong> are Kafka Connect transformations that are applied to data as it passes through a connector, allowing for modification of the data (such as enrichment, filtering, or transformation) before it lands in the destination.<\/li>\n<\/ul>\n<h3>Change Data Capture (CDC)<\/h3>\n<ul>\n<li><strong>CDC<\/strong> captures row-level changes (inserts, updates, deletes) from a database, typically by reading its transaction log (e.g. Debezium), and streams only the changes into Kafka. Compared with query-based ingestion (e.g. JDBC source polling), it has lower latency and load on the database and captures deletes.<\/li>\n<\/ul>\n<h3>Data Enrichment<\/h3>\n<ul>\n<li><strong>Data enrichment<\/strong> in the context of Kafka involves augmenting messages in a stream with additional information. This can be achieved by joining streams with other data sources (e.g., tables or databases) to add context or additional details to the original data.<\/li>\n<\/ul>\n<h3>Error Handling<\/h3>\n<p>Kafka Connect provides error reporting to handle errors encountered at various stages of processing. By default, any error during conversion or transformations causes the connector to fail. Each connector configuration can also enable tolerating such errors by skipping them and optionally writing each error and details of the failed operation and problematic record to the Connect application log.<\/p>\n<p>To report errors within a connector's converter, transforms, or within the sink connector itself to the log, set <code>errors.log.enable=true<\/code> in the connector configuration to log details of each error and the problem record's topic, partition, and offset. For additional debugging purposes, set <code>errors.log.include.messages=true<\/code> to also log the problem record key, value, and headers (note this may log sensitive information).<\/p>\n<p>To report errors within a connector's converter, transforms, or within the sink connector itself to a dead letter queue topic, set <code>errors.deadletterqueue.topic.name<\/code>, and optionally <code>errors.deadletterqueue.context.headers.enable=true<\/code>.<\/p>\n<h2>REST API<\/h2>\n<ul>\n<li>Kafka Connect provides a REST API for managing connectors<\/li>\n<li>Key endpoints include viewing connector configurations, status, and restarting connectors and tasks<\/li>\n<li>Secured clusters require additional configurations for the REST API<\/li>\n<\/ul>\n<h2>🚫 Connector Development<\/h2>\n<ul>\n<li>Connectors are responsible for breaking down a data copying job into tasks and monitoring for changes<\/li>\n<li><code>SourceConnector<\/code>s import data from systems into Kafka, <code>SinkConnector<\/code>s export data from Kafka to systems<\/li>\n<li>Developers must implement the <code>Connector<\/code> and <code>Task<\/code> interfaces<\/li>\n<li>Tasks should have consistent data schemas for the input/output streams and records<\/li>\n<\/ul>\n<h2>🚫 Configuration Validation<\/h2>\n<ul>\n<li>Kafka Connect allows configuration validation using <code>ConfigDef<\/code> and the <code>validate()<\/code> method<\/li>\n<li>Provides feedback about errors and recommended values before running connectors<\/li>\n<\/ul>\n<h2>🚫 Schemas and the Kafka Connect Data API<\/h2>\n<ul>\n<li>More complex data requires using the data API to define schemas using <code>Schema<\/code> and <code>Struct<\/code> classes<\/li>\n<li>Source connectors may have static or dynamic schemas and should avoid recomputing them frequently<\/li>\n<li>Sink connectors should validate that consumed data has the expected schema<\/li>\n<\/ul>\n<h2>Kafka Connect In-Depth<\/h2>\n<h3>1. Connect Architecture<\/h3>\n<ul>\n<li>Kafka Connect runs as a separate process from the Kafka brokers.<\/li>\n<li>It can run in standalone mode (single process) or distributed mode (multiple instances).<\/li>\n<li>In distributed mode, Connect distributes the work of connectors across multiple worker instances.<\/li>\n<li>Workers form a group via Kafka's group protocol and use Kafka topics (<code>config.storage.topic<\/code>, <code>offset.storage.topic<\/code>, <code>status.storage.topic<\/code>) for configuration, source offset storage, and status updates. Connect does not use ZooKeeper.<\/li>\n<li>Connectors are responsible for breaking down data copying tasks and generating task configurations.<\/li>\n<li>Tasks are the actual units of work that perform data copying.<\/li>\n<li>The <code>tasks.max<\/code> parameter determines the maximum number of tasks a connector can create.<\/li>\n<\/ul>\n<p>To understand Kafka Connect's internals, let's define its key concepts:<\/p>\n<ul>\n<li><strong>Connectors<\/strong>: Manage tasks to coordinate data streaming.<\/li>\n<li><strong>Tasks<\/strong>: Define how data is moved between Kafka and external systems.<\/li>\n<li><strong>Workers<\/strong>: Running processes that execute connectors and tasks.<\/li>\n<li><strong>Converters<\/strong>: Translate data between Connect and external systems.<\/li>\n<li><strong>Transforms<\/strong>: Modify messages produced by or sent to a connector.<\/li>\n<li><strong>Dead Letter Queue<\/strong>: Handle connector errors.<\/li>\n<\/ul>\n<p>Connectors in Kafka Connect are responsible for breaking down the data copying job into tasks that can be distributed to workers.<\/p>\n<h3>🚫 2. Connector Development<\/h3>\n<ul>\n<li>Connectors are implemented as Java classes that extend either <code>SourceConnector<\/code> or <code>SinkConnector<\/code>.<\/li>\n<li>The <code>taskClass()<\/code> method returns the class of the <code>Task<\/code> implementation (<code>SourceTask<\/code> or <code>SinkTask<\/code>).<\/li>\n<li>The <code>start()<\/code> method is called when the connector is started and initializes any necessary resources.<\/li>\n<li>The <code>stop()<\/code> method is called when the connector is stopped and cleans up any resources.<\/li>\n<li>The <code>config()<\/code> method returns the configuration definition for the connector.<\/li>\n<li>The <code>taskConfigs()<\/code> method generates task configurations based on the connector's configuration and the maximum number of tasks.<\/li>\n<li><code>SourceTask<\/code> implementations define the <code>poll()<\/code> method to fetch data from the external system and return a list of source records.<\/li>\n<li><code>SinkTask<\/code> implementations define the <code>put()<\/code> method to receive a list of sink records and write them to the external system.<\/li>\n<\/ul>\n<h3>3. Converters and Serialization<\/h3>\n<ul>\n<li>Converters are used to translate between the Connect data format and the serialized form stored in Kafka.<\/li>\n<li>The <code>key.converter<\/code> and <code>value.converter<\/code> properties specify the converter classes for record keys and values, respectively.<\/li>\n<li>Common converters include <code>JsonConverter<\/code>, <code>AvroConverter<\/code>, and <code>StringConverter<\/code>.<\/li>\n<li>Converters can be configured with additional properties, such as <code>schemas.enable<\/code> to include schema information in the serialized data.<\/li>\n<\/ul>\n<h3>4. Single Message Transforms (SMTs)<\/h3>\n<ul>\n<li>SMTs perform lightweight modifications to records as they flow through a connector.<\/li>\n<li>They operate on individual records and should not perform complex operations like joins or aggregations.<\/li>\n<li>SMTs are configured as part of the connector configuration using the <code>transforms<\/code> property.<\/li>\n<li>The <code>transforms<\/code> property specifies a comma-separated list of transform aliases.<\/li>\n<li>Each transform alias is configured with additional properties, such as <code>transforms.&lt;alias&gt;.type<\/code> to specify the transform class.<\/li>\n<li>Common SMTs include <code>MaskField<\/code>, <code>ReplaceField<\/code>, <code>ExtractField<\/code>, and <code>InsertField<\/code>.<\/li>\n<\/ul>\n<h3>5. Error Handling and Dead Letter Queues<\/h3>\n<ul>\n<li>Connectors can define error handling behavior using the <code>errors.tolerance<\/code> property.<\/li>\n<li>The <code>errors.tolerance<\/code> property can be set to <code>none<\/code> (default, fail on any error) or <code>all<\/code> (skip problematic records and continue).<\/li>\n<li>Dead letter queue (DLQ) can be configured to capture failed records using the <code>errors.deadletterqueue.topic.name<\/code> property.<\/li>\n<li>The <code>errors.deadletterqueue.context.headers.enable<\/code> property can be set to <code>true<\/code> to include error context in the DLQ record headers.<\/li>\n<li>Monitoring and handling records in the DLQ is important to identify and resolve issues with connector configuration or data compatibility.<\/li>\n<\/ul>\n<h3>6. Offset Management<\/h3>\n<ul>\n<li>Connectors manage offsets to track the progress of data copying.<\/li>\n<li>Source connectors use offsets to determine where to resume reading from the external system in case of failures or restarts.<\/li>\n<li>Sink connectors use offsets to track the progress of writing records to the external system.<\/li>\n<li>Source connector offsets are stored in a Kafka topic specified by the <code>offset.storage.topic<\/code> property (distributed mode).<\/li>\n<li>The <code>offset.flush.interval.ms<\/code> property controls how frequently offsets are flushed to the offset storage topic.<\/li>\n<li>Sink connector offsets are stored as regular consumer group offsets (<code>__consumer_offsets<\/code>), not in the Connect offsets topic. In standalone mode, source offsets are stored in a file (<code>offset.storage.file.filename<\/code>).<\/li>\n<li>By default, Connect provides at-least-once delivery. Offset management enables fault tolerance and resuming after failures.<\/li>\n<\/ul>\n<h3>7. Exactly-Once Semantics (EOS)<\/h3>\n<ul>\n<li>Kafka Connect delivers at-least-once by default.<\/li>\n<li>Exactly-once for <strong>source connectors<\/strong> is supported since Kafka 3.3 (KIP-618) and must be enabled and supported by the connector:<\/li>\n<li>Worker config: <code>exactly.once.source.support=enabled<\/code> (or <code>preparing<\/code> during a rolling upgrade). Default is <code>disabled<\/code>.<\/li>\n<li>Connector config: <code>exactly.once.support=requested|required<\/code> and optionally <code>transaction.boundary<\/code> (<code>poll<\/code>, <code>interval<\/code>, <code>connector<\/code>).<\/li>\n<li>Source records and offsets are written to Kafka in a transaction by the worker's producer.<\/li>\n<li>For <strong>sink connectors<\/strong>, Connect cannot guarantee exactly-once by itself. It depends on the connector writing idempotently to (or transactionally with offsets in) the external system.<\/li>\n<li>EOS requires careful configuration and compatibility between the connector and the external system.<\/li>\n<\/ul>\n<h3>🚫 8. Schema Evolution<\/h3>\n<ul>\n<li>Kafka Connect supports schema evolution for connectors that use schema-based serialization formats like Avro or Protobuf.<\/li>\n<li>Schema evolution allows the schema of records to change over time while maintaining compatibility with existing data.<\/li>\n<li>The Confluent Schema Registry is often used in conjunction with Kafka Connect to manage and evolve schemas.<\/li>\n<li>Connectors can be configured with the <code>value.converter.schema.registry.url<\/code> property to specify the URL of the Schema Registry.<\/li>\n<li>When consuming records with a schema, the connector retrieves the schema from the Schema Registry based on the schema ID stored with the record.<\/li>\n<li>Schema evolution strategies, such as backward and forward compatibility, need to be considered when making changes to record schemas.<\/li>\n<\/ul>\n<h3>9. Monitoring and Metrics<\/h3>\n<ul>\n<li>Kafka Connect exposes metrics for monitoring the performance and health of connectors and tasks.<\/li>\n<li>Metrics are exposed through JMX (Java Management Extensions) and can be collected using monitoring tools like JMX exporters or Prometheus.<\/li>\n<li>Key metrics to monitor include:<\/li>\n<li><code>connector-destroyed-task-count<\/code>: The number of destroyed tasks for a connector.<\/li>\n<li><code>connector-failed-task-count<\/code>: The number of failed tasks for a connector.<\/li>\n<li><code>connector-paused-task-count<\/code>: The number of paused tasks for a connector.<\/li>\n<li><code>connector-running-task-count<\/code>: The number of running tasks for a connector.<\/li>\n<li><code>connector-unassigned-task-count<\/code>: The number of unassigned tasks for a connector.<\/li>\n<li><code>source-record-poll-total<\/code>: The total number of records polled by a source connector.<\/li>\n<li><code>sink-record-read-total<\/code>: The total number of records read by a sink connector.<\/li>\n<li><code>sink-record-send-total<\/code>: The total number of records sent by a sink connector.<\/li>\n<li>Monitoring metrics helps identify performance bottlenecks, connectivity issues, and resource utilization of Kafka Connect.<\/li>\n<\/ul>\n<h2>Connector Scalability (CCDAK)<\/h2>\n<ul>\n<li><strong>Connector<\/strong> = job definition (config). <strong>Task<\/strong> = unit of parallelism that actually copies data. <strong>Worker<\/strong> = JVM process that runs connectors/tasks.<\/li>\n<li><code>tasks.max<\/code> is the <strong>upper bound<\/strong>. The connector decides the real number via <code>taskConfigs(maxTasks)<\/code> (e.g. JDBC source: max one task per table; sink connectors: bounded by the number of topic partitions — each partition goes to exactly one task).<\/li>\n<li><strong>Scale out<\/strong>: add workers (same <code>group.id<\/code> in distributed mode) → tasks are rebalanced automatically across workers. If a worker fails, its tasks move to the others (fault tolerance). Raising <code>tasks.max<\/code> beyond the data's natural parallelism has no effect.<\/li>\n<li><strong>Standalone mode<\/strong>: single worker, no fault tolerance, offsets in a local file (<code>offset.storage.file.filename<\/code>) — for dev/testing. <strong>Distributed mode<\/strong> for production (config/offset/status stored in internal Kafka topics: <code>config.storage.topic<\/code>, <code>offset.storage.topic<\/code>, <code>status.storage.topic<\/code>).<\/li>\n<li>Sink connector consumer group is named <code>connect-&lt;connector-name&gt;<\/code>. Scaling the tasks beyond partition count leaves tasks idle.<\/li>\n<li>Connect rebalances use incremental cooperative rebalancing (<code>connect.protocol=sessioned<\/code>/<code>compatible<\/code>).<\/li>\n<li>Offsets: source connectors store source offsets in the offsets topic (e.g. DB timestamp/ID, file position). Sink connectors use normal consumer offsets (<code>__consumer_offsets<\/code>).<\/li>\n<\/ul>\n", "minutes": 15}, {"id": "8", "folder": "8.security", "title": "Security", "desc": "SSL, SASL, ACLs, JAAS", "kind": "core", "html": "<blockquote>\n<p>🚫 = outside the CCDAK exam scope (see exam blueprint)<\/p>\n<\/blockquote>\n<h2>Kafka Security Configurations<\/h2>\n<p>Securing Kafka involves configuring encryption, authentication, and authorization mechanisms to protect data in transit and at rest. Properly configuring security settings is crucial for safeguarding sensitive information and ensuring compliance with security standards.<\/p>\n<h3>Key Points for CCDAK on Security<\/h3>\n<ul>\n<li><strong>Encryption<\/strong>: SSL/TLS encryption prevents data eavesdropping between clients and brokers.<\/li>\n<li><strong>Authentication<\/strong>: SASL (PLAIN, SCRAM, GSSAPI/Kerberos, OAUTHBEARER) and SSL/mutual TLS (<code>ssl.client.auth=required<\/code>, default <code>none<\/code>) can be used to authenticate clients and brokers.<\/li>\n<li><strong>Authorization<\/strong>: ACLs (not authentication) control access to Kafka resources, ensuring only authorized users can produce or consume data.<\/li>\n<li><strong>Comprehensive Security<\/strong>: A combination of encryption, authentication, and authorization provides robust security.<\/li>\n<\/ul>\n<h3>Important Security Properties<\/h3>\n<h4><code>ssl.key.password<\/code><\/h4>\n<ul>\n<li><strong>Description<\/strong>: Password for the private key in the key store file. This is optional and used for keys.<\/li>\n<li><strong>Security Impact<\/strong>: Protects the private key integrity, ensuring that only authorized users can access it.<\/li>\n<\/ul>\n<h4><code>ssl.keystore.location<\/code><\/h4>\n<ul>\n<li><strong>Description<\/strong>: Location of the keystore file containing the server certificate and private key.<\/li>\n<li><strong>Security Impact<\/strong>: Enables SSL encryption for data in transit. Proper management ensures identity integrity.<\/li>\n<\/ul>\n<h4><code>ssl.keystore.password<\/code><\/h4>\n<ul>\n<li><strong>Description<\/strong>: Password to access the keystore file.<\/li>\n<li><strong>Security Impact<\/strong>: Secures the keystore content against unauthorized access.<\/li>\n<\/ul>\n<pre><code>┌─────────────────────────────────────────────────┐\n│           KEYSTORE FILE (.jks / .p12)           │\n│         ← ssl.keystore.password protect it →    │\n│                                                 │\n│   ┌──────────────────────────────────────────┐  │\n│   │         CERTIFICATE (public)             │  │\n│   │         broker.example.com               │  │\n│   └──────────────────────────────────────────┘  │\n│                                                 │\n│   ┌──────────────────────────────────────────┐  │\n│   │         PRIVATE KEY                      │  │\n│   │    ← ssl.key.password protect it →       │  │\n│   │         (can have separate password)     │  │\n│   └──────────────────────────────────────────┘  │\n└─────────────────────────────────────────────────┘\n<\/code><\/pre>\n<h4><code>ssl.truststore.location<\/code><\/h4>\n<ul>\n<li><strong>Description<\/strong>: Location of the truststore file containing certificates of trusted CAs (clients use it to verify the broker; brokers use it to verify client certificates with mTLS).<\/li>\n<li><strong>Security Impact<\/strong>: Essential for establishing trust relationships and validating certificate chains during SSL/TLS handshakes.<\/li>\n<\/ul>\n<h4><code>ssl.truststore.password<\/code><\/h4>\n<ul>\n<li><strong>Description<\/strong>: Password to unlock the truststore file.<\/li>\n<li><strong>Security Impact<\/strong>: Protects the integrity of trusted certificates, ensuring they are not tampered with.<\/li>\n<\/ul>\n<h4><code>sasl.mechanism<\/code><\/h4>\n<ul>\n<li><strong>Description<\/strong>: Authentication method — how the client proves its identity . Examples include PLAIN, GSSAPI (Kerberos), SCRAM, etc.<\/li>\n<li><strong>Security Impact<\/strong>: Defines the authentication protocol, directly affecting security strength and compatibility.<\/li>\n<\/ul>\n<h4><code>sasl.jaas.config<\/code><\/h4>\n<ul>\n<li><strong>Description<\/strong>: JAAS configuration for SASL mechanisms specifying login modules and relevant options, set inline (an alternative to a separate JAAS file passed via <code>-Djava.security.auth.login.config<\/code>).<\/li>\n<li><strong>Security Impact<\/strong>: Central to SASL authentication setup, ensuring secure and flexible authentication configurations.<\/li>\n<\/ul>\n<h4><code>security.protocol<\/code><\/h4>\n<ul>\n<li><strong>Description<\/strong>: Transport layer — how the connection is established . Options include PLAINTEXT (default), SSL, SASL_PLAINTEXT, and SASL_SSL.<\/li>\n<li><strong>Security Impact<\/strong>: Determines the level of security for data in transit between clients and brokers.<\/li>\n<\/ul>\n<h4><code>ssl.endpoint.identification.algorithm<\/code><\/h4>\n<ul>\n<li><strong>Description<\/strong>: The algorithm to use for host name verification of server certificates. Defaults to <code>https<\/code> (hostname verification enabled) since Kafka 2.0. An empty string disables it.<\/li>\n<li><strong>Security Impact<\/strong>: Protects against man-in-the-middle attacks by verifying the server's hostname matches its certificate.<\/li>\n<\/ul>\n<h4><code>sasl.login.callback.handler.class<\/code><\/h4>\n<ul>\n<li><strong>Description<\/strong>: Specifies the callback handler class for SASL login if not using the default.<\/li>\n<li><strong>Security Impact<\/strong>: Allows custom handling of authentication challenges and responses, enhancing flexibility in security configurations.<\/li>\n<\/ul>\n<h4><code>sasl.kerberos.service.name<\/code><\/h4>\n<ul>\n<li><strong>Description<\/strong>: The Kerberos principal name (service name, typically <code>kafka<\/code>) that Kafka runs as.<\/li>\n<li><strong>Security Impact<\/strong>: Critical for integrating Kafka with Kerberos for strong authentication, ensuring that services communicate securely under mutual authentication.<\/li>\n<\/ul>\n<h3>Core Principles for Robust Kafka Security<\/h3>\n<h4>Encryption<\/h4>\n<ul>\n<li>Implements SSL/TLS to safeguard data as it moves between Kafka clients and brokers, thwarting eavesdropping attempts.<\/li>\n<\/ul>\n<h4>Authentication<\/h4>\n<ul>\n<li>Utilizes SASL and SSL for verifying client and broker identities, ensuring that only legitimate participants engage in communication.<\/li>\n<\/ul>\n<h4>Authorization<\/h4>\n<p>Apache Kafka ships with a pluggable, out-of-the-box Authorizer. In KRaft mode (the only mode since Kafka 4.0, when ZooKeeper and <code>AclAuthorizer<\/code> were removed) this is <code>StandardAuthorizer<\/code>, which stores ACLs in the cluster metadata log (<code>__cluster_metadata<\/code>). Setting ACLs is crucial because, without them, access to resources is limited to super users when an Authorizer is configured. By default (<code>allow.everyone.if.no.acl.found=false<\/code>), if a resource has no associated ACLs, no one except super users is allowed to access it.<\/p>\n<p>ACLs authorize authenticated principals. They do not authenticate. Operations include Read (consume), Write (produce), Create, Delete, Alter, Describe, DescribeConfigs, AlterConfigs, IdempotentWrite. Resources: Topic, Group, Cluster, TransactionalId, DelegationToken, User (there is no Partition resource). Without a matching allow ACL the client gets an authorization exception (e.g. <code>TopicAuthorizationException<\/code>).<\/p>\n<p>Access Control Lists (ACLs) provide essential authorization controls for your enterprise's Kafka cluster data.<\/p>\n<p>To set the required ACLs to allow a specific user &quot;Andoni&quot; to read and write to the topic &quot;test-topic&quot; from host &quot;test-host,&quot; use the following command:<\/p>\n<pre><code class=\"language-sh\">bin/kafka-acls.sh --bootstrap-server localhost:9092 \n                  --command-config admin.properties  --add \n                  --allow-principal User:Andoni \n                  --allow-host test-host \n                  --operation read \n                  --operation write --topic test-topic\n<\/code><\/pre>\n<h4>Comprehensive Security Model<\/h4>\n<ul>\n<li>A layered approach combining encryption, authentication, and authorization fortifies Kafka's security posture.<\/li>\n<\/ul>\n<h3>Critical Security Configuration Parameters<\/h3>\n<h4>SSL Configuration<\/h4>\n<ul>\n<li><strong><code>ssl.key.password<\/code><\/strong>: Secures the private key, preventing unauthorized access to critical encryption assets.<\/li>\n<li><strong><code>ssl.keystore.location<\/code><\/strong>: Specifies the keystore's path, a fundamental component for SSL encryption, containing server certificates and keys.<\/li>\n<li><strong><code>ssl.keystore.password<\/code><\/strong>: Protects the keystore's integrity, ensuring its contents remain confidential.<\/li>\n<li><strong><code>ssl.truststore.location<\/code><\/strong>: Designates the truststore's path, essential for establishing trust chains during SSL handshakes.<\/li>\n<li><strong><code>ssl.truststore.password<\/code><\/strong>: Guards the truststore against unauthorized alterations, maintaining the trust integrity.<\/li>\n<\/ul>\n<h4>SASL Configuration for Authentication<\/h4>\n<ul>\n<li><strong><code>sasl.mechanism<\/code><\/strong>: Defines the SASL mechanism (e.g., PLAIN, GSSAPI/Kerberos, SCRAM) for client-server authentication, influencing security level and protocol compatibility.<\/li>\n<li><strong><code>sasl.jaas.config<\/code><\/strong>: Central to configuring SASL authentication, specifying login modules and options for various SASL mechanisms.<\/li>\n<li><strong><code>sasl.login.callback.handler.class<\/code><\/strong>: Facilitates custom authentication challenge handling, offering flexibility in security setups.<\/li>\n<li><strong><code>sasl.kerberos.service.name<\/code><\/strong>: Essential for Kerberos integration, ensuring secure mutual authentication between services.<\/li>\n<\/ul>\n<h4>Communication and Protocol Security<\/h4>\n<ul>\n<li><strong><code>security.protocol<\/code><\/strong>: Sets the communication protocol with brokers (e.g., PLAINTEXT, SSL, SASL_PLAINTEXT, SASL_SSL), directly affecting in-transit data security.<\/li>\n<li><strong><code>ssl.endpoint.identification.algorithm<\/code><\/strong>: Enables hostname verification in server certificates to protect against man-in-the-middle attacks.<\/li>\n<\/ul>\n<h3>Kafka JAAS Configuration Example<\/h3>\n<pre><code>KafkaClient {\n    com.sun.security.auth.module.Krb5LoginModule required\n    useKeyTab=true\n    storeKey=true\n    keyTab=&quot;/tmp/reader.user.keytab&quot;\n    principal=&quot;reader@KAFKA.SECURE&quot;;\n};\n<\/code><\/pre>\n<h3>Access Control with ACLs<\/h3>\n<p>Kafka provides ACLs for fine-grained access control, managed via:<\/p>\n<pre><code>authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer\nsuper.users=User:admin;User:kafka\nallow.everyone.if.no.acl.found=false\nsecurity.inter.broker.protocol=SASL_SSL\n<\/code><\/pre>\n<h4>Managing ACLs<\/h4>\n<ul>\n<li><strong>Listing ACLs<\/strong>: <code>kafka-acls.sh --bootstrap-server broker:9092 --list<\/code><\/li>\n<li><strong>Adding ACLs<\/strong>: <code>kafka-acls.sh --bootstrap-server broker:9092 --add --allow-principal User:Bob --allow-principal User:Alice --allow-host Host1 --allow-host Host2 --operation Read --operation Write --topic Test-topic<\/code><\/li>\n<\/ul>\n<h3>Kafka Security Diagram<\/h3>\n<img src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNDAwIiBoZWlnaHQ9IjEzMzguNCIgdmlld0JveD0iMCAwIDEwMDAgOTU2IiByb2xlPSJpbWciPgogIDx0aXRsZT5LYWZrYSBTU0wgYW5kIFNBU0wgc2VjdXJpdHkgc2V0dGluZ3MgZmxvdyBiZXR3ZWVuIGNsaWVudCBhbmQgYnJva2VyPC90aXRsZT4KICA8ZGVzYz5TdHJ1Y3R1cmFsIGRpYWdyYW0gc2hvd2luZyBob3cgc2VjdXJpdHkucHJvdG9jb2wsIHNzbC5rZXlzdG9yZSwgc3NsLnRydXN0c3RvcmUsIHNhc2wubWVjaGFuaXNtLCBzYXNsLmphYXMuY29uZmlnLCBzYXNsLmtlcmJlcm9zLnNlcnZpY2UubmFtZSwgc2FzbC5sb2dpbi5jYWxsYmFjay5oYW5kbGVyLmNsYXNzLCBhbmQgc3NsLmVuZHBvaW50LmlkZW50aWZpY2F0aW9uLmFsZ29yaXRobSByZWxhdGUgYW5kIGZsb3cgYmV0d2VlbiBLYWZrYSBjbGllbnQgYW5kIGJyb2tlcjwvZGVzYz4KICA8ZGVmcz4KICAgIDxtYXJrZXIgaWQ9ImFycm93IiBtYXJrZXJXaWR0aD0iMTAiIG1hcmtlckhlaWdodD0iNyIgcmVmWD0iOSIgcmVmWT0iMy41IiBvcmllbnQ9ImF1dG8iPjxwb2x5Z29uIHBvaW50cz0iMCAwLCAxMCAzLjUsIDAgNyIgZmlsbD0iIzhiOTQ5ZSIvPjwvbWFya2VyPgogICAgPG1hcmtlciBpZD0iYXJyb3ctZ3JlZW4iIG1hcmtlcldpZHRoPSIxMCIgbWFya2VySGVpZ2h0PSI3IiByZWZYPSI5IiByZWZZPSIzLjUiIG9yaWVudD0iYXV0byI+PHBvbHlnb24gcG9pbnRzPSIwIDAsIDEwIDMuNSwgMCA3IiBmaWxsPSIjM2ZiOTUwIi8+PC9tYXJrZXI+CiAgICA8bWFya2VyIGlkPSJhcnJvdy1wdXJwbGUiIG1hcmtlcldpZHRoPSIxMCIgbWFya2VySGVpZ2h0PSI3IiByZWZYPSI5IiByZWZZPSIzLjUiIG9yaWVudD0iYXV0byI+PHBvbHlnb24gcG9pbnRzPSIwIDAsIDEwIDMuNSwgMCA3IiBmaWxsPSIjYmM4Y2ZmIi8+PC9tYXJrZXI+CiAgICA8c3R5bGU+CiAgICAgIEBmb250LWZhY2UgeyBmb250LWZhbWlseTogJ0pldEJyYWlucyBNb25vJzsgZm9udC13ZWlnaHQ6IDQwMDsgc3JjOiB1cmwoZGF0YTpmb250L3dvZmYyO2Jhc2U2NCxkMDlHTWdBQkFBQUFBRG1NQUJFQUFBQUFpbUFBQURrcEFBSk4wd0FBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBR2k0YklCeTRGZ1pnQUlGSUNJRW9DWndNR , "folder": "9.schema-registry", "title": "Schema Registry", "desc": "Avro, compatibility, subjects, REST API", "kind": "core", "html": "<blockquote>\n<p>🚫 = outside the CCDAK exam scope (see exam blueprint)<\/p>\n<\/blockquote>\n<h2>Schema Registry and Avro Overview<\/h2>\n<p>Confluent Schema Registry and Avro serialization provide a robust way to ensure that Kafka messages conform to a schema, enabling schema evolution and ensuring data compatibility. Understanding these components is essential for building resilient and forward-compatible Kafka applications.<\/p>\n<h3>Schema Registry Key Concepts<\/h3>\n<ul>\n<li><strong>Centralized Schema Management<\/strong>: Schema Registry stores and manages Avro, JSON Schema, and Protobuf schemas, ensuring that producers and consumers agree on schema formats.<\/li>\n<li><strong>Schema Evolution<\/strong>: Supports schema evolution with backward, forward, and full compatibility checks, preventing breaking changes.<\/li>\n<li><strong>Integration with Kafka<\/strong>: Integrates with Kafka, enabling schemas to be applied to Kafka messages, ensuring data consistency across the system.<\/li>\n<\/ul>\n<p>The following schema formats are supported out-of-the-box with Confluent Platform, with serializers, deserializers, and command line tools available for each format:<\/p>\n<ul>\n<li><strong>Avro:<\/strong> Relies on schemas. When Avro data is read, the schema used when writing it is always present.<\/li>\n<li><strong>JSON:<\/strong> A lightweight data-interchange format. It's easy for humans to read and write, and it's easy for machines to parse and generate. JSON itself does not rely on schemas. Schema Registry adds validation using JSON Schema.<\/li>\n<li><strong>ProtoBuf:<\/strong> Protocol Buffers (ProtoBuf) are Google's language-neutral, platform-neutral, extensible mechanism for serializing structured data – think XML, but smaller, faster, and simpler.<\/li>\n<\/ul>\n<h3>Avro<\/h3>\n<ul>\n<li><strong>Binary Format<\/strong>: Avro is a compact binary format that enables efficient serialization and deserialization of data.<\/li>\n<li><strong>Schema Evolution<\/strong>: Avro supports schema evolution, allowing schemas to be updated without breaking existing applications.<\/li>\n<\/ul>\n<p>The set of primitive types:<\/p>\n<ul>\n<li>null: no value<\/li>\n<li>boolean: a binary value<\/li>\n<li>int: 32-bit signed integer<\/li>\n<li>long: 64-bit signed integer<\/li>\n<li>float: single precision (32-bit) IEEE 754 floating-point number<\/li>\n<li>double: double precision (64-bit) IEEE 754 floating-point number<\/li>\n<li>bytes: sequence of 8-bit unsigned bytes<\/li>\n<li>string: unicode character sequence<\/li>\n<\/ul>\n<p>Avro supports six types of complex data structures: records, enums, arrays, maps, unions, and fixed.<\/p>\n<p><strong>Records<\/strong> are defined with the type name &quot;record&quot; and include the following attributes:<\/p>\n<ul>\n<li><strong>name:<\/strong> A required JSON string that specifies the record's name.<\/li>\n<li><strong>namespace:<\/strong> A JSON string that qualifies the record's name.<\/li>\n<li><strong>doc:<\/strong> An optional JSON string that provides documentation for the schema.<\/li>\n<li><strong>aliases:<\/strong> An optional JSON array of strings that provides alternate names for the record.<\/li>\n<li><strong>fields:<\/strong> A required JSON array that lists the fields of the record.<\/li>\n<\/ul>\n<h3>Key Advantages of Schema Registry and Avro<\/h3>\n<h4>Centralized Schema Management<\/h4>\n<ul>\n<li>The Schema Registry serves as a centralized repository for storing Avro, JSON Schema, and Protobuf schemas, facilitating schema sharing and enforcement across producers and consumers.<\/li>\n<\/ul>\n<h4>Schema Evolution Support<\/h4>\n<ul>\n<li>Both Schema Registry and Avro support schema evolution, allowing schemas to be updated while maintaining compatibility, thus preventing breaking changes.<\/li>\n<\/ul>\n<p>Backward compatibility: Focus on what the <strong>new system can handle from the old<\/strong>. It’s about not breaking old producers or data.\nForward compatibility: Concentrate on what the <strong>old system can handle from the new<\/strong>. It’s about not breaking old consumers with new data.<\/p>\n<ul>\n<li><strong>Backward<\/strong> (default): New schema can read data written in old schema. This means your applications can read old data even after the schema has been updated. Allowed changes:<\/li>\n<\/ul>\n<ol>\n<li>Removing a field (any field)<\/li>\n<li>Adding a field with a default value<\/li>\n<li>Widening a type via Avro promotion (e.g. int to long)<\/li>\n<\/ol>\n<ul>\n<li><strong>Forward<\/strong>: Old schema can read data written in new schema. This allows applications using an older schema to read data that was produced with a newer schema. Allowed changes:<\/li>\n<\/ul>\n<ol>\n<li>Adding a field (with or without a default)<\/li>\n<li>Removing a field that has a default value<\/li>\n<\/ol>\n<ul>\n<li><strong>Full<\/strong>: both. Only add or remove fields that have default values.<\/li>\n<li><strong>Breaking<\/strong>: Such as changing field types incompatibly, renaming a record or field (without aliases), adding a required field (no default) under BACKWARD, or removing a required field (no default) under FORWARD.<\/li>\n<li><strong>Transitive<\/strong> variants (<code>BACKWARD_TRANSITIVE<\/code>, <code>FORWARD_TRANSITIVE<\/code>, <code>FULL_TRANSITIVE<\/code>) check against all previous versions. The non-transitive modes check only the latest version.<\/li>\n<\/ul>\n<pre><code>┌──────────────────────────┬──────────┬─────────┬──────┐\n│ Change                   │ Backward │ Forward │ Full │\n├──────────────────────────┼──────────┼─────────┼──────┤\n│ Add field WITH default   │ ✅       │ ✅      │ ✅  │\n│ Add field WITHOUT default│ ❌       │ ✅      │ ❌  │ \n│ Remove field WITH default│ ✅       │ ✅      │ ✅  │\n│ Remove field WITHOUT def │ ✅       │ ❌      │ ❌  │\n└──────────────────────────┴──────────┴─────────┴──────┘\n\n<\/code><\/pre>\n<h4>Mnemonic: &quot;CF-PS&quot; (Consumer First, Producer Second)<\/h4>\n<p>In most cases, it's safer to update the consumer first and then the producer. This approach ensures that the consumer can handle both the old and new schema versions, minimizing the risk of disruption.\nTo remember the general rule for updating consumers and producers, use the mnemonic &quot;CF-PS&quot;:<\/p>\n<ul>\n<li><strong>C (Consumer)<\/strong>: Update the Consumer first<\/li>\n<li><strong>F (Forward)<\/strong>: Consumer can handle forward compatible changes<\/li>\n<li><strong>P (Producer)<\/strong>: Update the Producer second<\/li>\n<li><strong>S (Special)<\/strong>: In Special cases, like <strong>backward compatible<\/strong> changes or urgent fixes, update the producer first<\/li>\n<\/ul>\n<p>**Enums: ** Adding enum symbols is backward-compatible. Removing enum symbols is a breaking change. Reordering enum symbols is a breaking change. &quot;Add, Remove (break), Reorder (break)&quot; (ARR)\nSince Avro 1.9.1 (&gt;= 1.9.1): Default value for enums. Writer's symbol not in reader's enum =&gt; Use default value if specified, else error.<\/p>\n<table>\n<thead>\n<tr>\n<th>Compatibility<\/th>\n<th>Change<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Backward<\/td>\n<td>Delete fields<\/td>\n<\/tr>\n<tr>\n<td>Backward<\/td>\n<td>Add optional fields<\/td>\n<\/tr>\n<tr>\n<td>Forward<\/td>\n<td>Add fields<\/td>\n<\/tr>\n<tr>\n<td>Forward<\/td>\n<td>Delete fields with defaults<\/td>\n<\/tr>\n<tr>\n<td>Full<\/td>\n<td>Add fields with defaults<\/td>\n<\/tr>\n<tr>\n<td>Full<\/td>\n<td>Delete fields with defaults<\/td>\n<\/tr>\n<tr>\n<td>Transitive<\/td>\n<td>Backward/Forward/Full compatibility<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Backward: Deleting fields, Adding optional fields  - Upgrade first: Consumers.   (Default for topics, for Streams only Backward is allowed)\nForward: Adding fields, Deleting fields with defaults - Upgrade first: Producers.\nFull: Upgrade order does not matter.<\/p>\n<h4>Efficient Data Serialization<\/h4>\n<ul>\n<li>Avro provides a compact, fast, binary data format, significantly reducing the payload size and improving data serialization and deserialization efficiency.<\/li>\n<\/ul>\n<h3>Implementing Schema Registry and Avro<\/h3>\n<h4>Schema Registration<\/h4>\n<ul>\n<li>Register schemas via the Schema Registry's REST API to enforce schema consistency across messages.<pre><code># Command to register a schema\ncurl -X POST -H &quot;Content-Type: application/vnd.schemaregistry.v1+json&quot; \\\n     --data '{ &quot;schema&quot;: &quot;{\\&quot;type\\&quot;:\\&quot;record\\&quot;,\\&quot;name\\&quot;:\\&quot;Test\\&quot;,\\&quot;fields\\&quot;:[{\\&quot;name\\&quot;:\\&quot;field1\\&quot;,\\&quot;type\\&quot;:\\&quot;string\\&quot;}]}&quot; }' \\\n     http://localhost:8081/subjects/test-topic-value/versions\n<\/code><\/pre>\n<\/li>\n<\/ul>\n<h4>Avro in Kafka Producers and Consumers<\/h4>\n<ul>\n<li>Utilize Avro serializers and deserializers in Kafka clients, integrating seamlessly with the Schema Registry for schema management.<\/li>\n<\/ul>\n<h3>Essential Schema Registry and Avro Operations<\/h3>\n<h4>Viewing and Managing Schemas<\/h4>\n<ul>\n<li>List registered schemas or test schema compatibility using the Schema Registry's REST API.<pre><code># List all subjects\ncurl -X GET http://localhost:8081/subjects\n# Test schema compatibility\ncurl -X POST -H &quot;Content-Type: application/vnd.schemaregistry.v1+json&quot; \\\n     --data '{ &quot;schema&quot;: &quot;{\\&quot;type\\&quot;:\\&quot;record\\&quot;,\\&quot;name\\&quot;:\\&quot;TestNew\\&quot;,\\&quot;fields\\&quot;:[{\\&quot;name\\&quot;:\\&quot;field1\\&quot;,\\&quot;type\\&quot;:\\&quot;string\\&quot;}]}&quot; }' \\\n     http://localhost:8081/compatibility/subjects/test-topic-value/versions/latest\n<\/code><\/pre>\n<\/li>\n<\/ul>\n<h3>Avro Serialization Details<\/h3>\n<ul>\n<li><strong>Data Types<\/strong>: Supports both primitive (e.g., int, string) and complex types (e.g., enums, arrays, maps), enabling diverse data representation.<\/li>\n<li><strong>Schema Evolution<\/strong>: Avro allows for backward, forward, and full compatibility modes, facilitating flexible schema updates.<\/li>\n<\/ul>\n<h3>Schema Registry Integration with Kafka<\/h3>\n<ul>\n<li><strong>Schema Storage<\/strong>: Schemas are stored in a Kafka topic (<code>_schemas<\/code>), managed by the Schema Registry, separating schema management from data storage.<\/li>\n<li><strong>Security and Efficiency<\/strong>: Reduces message size by sending schema IDs instead of full schemas with each message, while also supporting secure client communication protocols (HTTP, HTTPS).<\/li>\n<\/ul>\n<h3>Important Operations and Concepts<\/h3>\n<ul>\n<li><strong>Registering Schemas<\/strong>:<pre><code># Example command to register a schema using the Schema Registry REST API\ncurl -X POST -H &quot;Content-Type: application/vnd.schemaregistry.v1+json&quot; \\\n  --data '{ &quot;schema&quot;: &quot;{\\&quot;type\\&quot;:\\&quot;record\\&quot;,\\&quot;name\\&quot;:\\&quot;Test\\&quot;,\\&quot;fields\\&quot;:[{\\&quot;name\\&quot;:\\&quot;field1\\&quot;,\\&quot;type\\&quot;:\\&quot;string\\&quot;}]}&quot; }' \\\n  http://localhost:8081/subjects/test-topic-value/versions\n<\/code><\/pre>\n<\/li>\n<li><strong>Schema Compatibility<\/strong>: Configuring compatibility settings in Schema Registry to ensure that schema updates are compatible with consumer expectations.<\/li>\n<li><strong>Using Avro with Kafka Producers and Consumers<\/strong>: Implementing Kafka producers and consumers using Avro serialization requires using specific serializers and deserializers that integrate with Schema Registry.<\/li>\n<\/ul>\n<h3>Useful Commands<\/h3>\n<ul>\n<li><strong>Viewing Registered Schemas<\/strong>:<pre><code># List all subjects\ncurl -X GET http://localhost:8081/subjects\n<\/code><\/pre>\n<\/li>\n<li><strong>Checking Schema Compatibility<\/strong>:<pre><code># Test compatibility of a schema with the latest schema under a subject\ncurl -X POST -H &quot;Content-Type: application/vnd.schemaregistry.v1+json&quot; \\\n  --data '{ &quot;schema&quot;: &quot;{\\&quot;type\\&quot;:\\&quot;record\\&quot;,\\&quot;name\\&quot;:\\&quot;TestNew\\&quot;,\\&quot;fields\\&quot;:[{\\&quot;name\\&quot;:\\&quot;field1\\&quot;,\\&quot;type\\&quot;:\\&quot;string\\&quot;}]}&quot; }' \\\n  http://localhost:8081/compatibility/subjects/test-topic-value/versions/latest\n<\/code><\/pre>\n<\/li>\n<\/ul>\n<h3>Schema Registry In-Depth<\/h3>\n<h4>1. Overview<\/h4>\n<ul>\n<li>Schema Registry is a centralized service for storing and managing schemas used for serializing and deserializing data in Kafka.<\/li>\n<li>It provides a RESTful API for storing and retrieving schemas, as well as enforcing schema compatibility rules.<\/li>\n<li>Schema Registry integrates with Kafka clients, allowing them to retrieve schemas for serialization and deserialization.<\/li>\n<li>It supports multiple serialization formats, including Avro, Protobuf, and JSON Schema.<\/li>\n<li>Schema Registry ensures data compatibility between producers and consumers by:<\/li>\n<li>Storing a schema for each unique topic-key or topic-value combination.<\/li>\n<li>Allowing producers and consumers to retrieve schemas based on the topic and key/value type.<\/li>\n<li>Enforcing compatibility rules to ensure that producers and consumers use compatible schemas.<\/li>\n<li>Rejecting incompatible schemas and ensuring that data can be deserialized correctly by consumers.<\/li>\n<\/ul>\n<h4>2. Schema Compatibility<\/h4>\n<ul>\n<li>Schema compatibility defines which schema changes are allowed, so that producers and consumers using different schema versions can still read each other's data.<\/li>\n<li>Schema Registry supports seven compatibility types: <code>BACKWARD<\/code> (default), <code>FORWARD<\/code>, <code>FULL<\/code>, their <code>_TRANSITIVE<\/code> variants, and <code>NONE<\/code>. The core four are:<\/li>\n<li><code>BACKWARD<\/code>: Consumers using the new schema can read data produced with the last schema.\n<ul>\n<li>Allows adding new fields that have a default value.<\/li>\n<li>Allows removing fields (with or without a default).<\/li>\n<li>Check is against the latest version only (<code>BACKWARD_TRANSITIVE<\/code>: all versions). Default mode.<\/li>\n<\/ul>\n<\/li>\n<li><code>FORWARD<\/code>: Consumers using the last schema can read data produced with the new schema.\n<ul>\n<li>Allows adding new fields (with or without a default).<\/li>\n<li>Allows removing only fields that have a default value.<\/li>\n<\/ul>\n<\/li>\n<li><code>FULL<\/code>: Both <code>BACKWARD<\/code> and <code>FORWARD<\/code> compatibilities are maintained.\n<ul>\n<li>Allows adding new optional fields.<\/li>\n<li>Allows removing fields with default values.<\/li>\n<li>Adding or removing fields without defaults is not allowed.<\/li>\n<\/ul>\n<\/li>\n<li><code>NONE<\/code>: No compatibility checks are performed.<\/li>\n<li>Compatibility can be configured globally or per subject (topic-key or topic-value).<\/li>\n<li>Schema evolution is supported by allowing compatible schema changes, such as adding optional fields or removing fields with default values.<\/li>\n<li>When a producer tries to register an incompatible schema:<\/li>\n<li>Schema Registry rejects the registration request.<\/li>\n<li>The producer receives an error indicating that the schema is incompatible.<\/li>\n<li>The producer must update its schema to be compatible with the existing schema before successfully registering the schema and producing data.<\/li>\n<\/ul>\n<p>Think of &quot;BA&quot; in &quot;BAckward&quot; as standing for &quot;Adding&quot;. (Adding, optional, defaults.)\n<code>FORWARD<\/code>: &quot;FORward is for FOllowing defaults&quot; (Adding, defaults.)<\/p>\n<h4>3. Subject Naming Strategies<\/h4>\n<ul>\n<li>Subjects in Schema Registry represent a unique combination of a topic and a key or value schema.<\/li>\n<li>Schema Registry supports three subject naming strategies:<\/li>\n<li><code>TopicNameStrategy<\/code> (default): The subject name is the topic name suffixed with <code>-key<\/code> or <code>-value<\/code>.\n<ul>\n<li>All messages in a topic must have the same schema.<\/li>\n<li>Suitable when all messages in a topic have the same schema.<\/li>\n<\/ul>\n<\/li>\n<li><code>RecordNameStrategy<\/code>: The subject name is the fully-qualified name of the record schema.\n<ul>\n<li>Allows different topics to use the same schema.<\/li>\n<li>All topics with the same record name must have the same schema version.<\/li>\n<li>Useful when multiple topics share the same schema.<\/li>\n<\/ul>\n<\/li>\n<li><code>TopicRecordNameStrategy<\/code>: The subject name is the topic name concatenated with the record name.\n<ul>\n<li>Allows different topics to have different schemas for the same record name.<\/li>\n<li>Provides flexibility for schema evolution per topic.<\/li>\n<\/ul>\n<\/li>\n<li>The subject naming strategy determines how schemas are grouped and evolved within Schema Registry.<\/li>\n<\/ul>\n<h4>4. Schema Registry REST API<\/h4>\n<ul>\n<li>Schema Registry exposes a RESTful API for interacting with schemas and subjects.<\/li>\n<li>Key endpoints include:<\/li>\n<li><code>POST /subjects/(string: subject)/versions<\/code>: Register a new schema version under the specified subject.<\/li>\n<li><code>GET /subjects/(string: subject)/versions/(versionId: version)<\/code>: Retrieve a specific version of the schema registered under the given subject.<\/li>\n<li><code>POST /compatibility/subjects/(string: subject)/versions/(versionId: version)<\/code>: Test schema compatibility against a specified version.<\/li>\n<li><code>GET /schemas/ids/(int: id)<\/code>: Retrieve the schema string associated with the given schema ID.<\/li>\n<li><code>GET /subjects/(string: subject)/versions/latest<\/code>: Retrieve the latest version of a schema for a given subject.<\/li>\n<li><code>GET /subjects/(string: subject)/versions<\/code>: List all version numbers registered under a given subject.<\/li>\n<li><code>PUT /config/(string: subject)<\/code>: Set the compatibility level for a subject (<code>PUT /config<\/code> sets the global level).<\/li>\n<li>The API allows registering schemas, retrieving schemas by ID or version, and testing schema compatibility.<\/li>\n<\/ul>\n<h4>5. Serializers and Deserializers<\/h4>\n<ul>\n<li>Schema Registry provides serializers and deserializers for Avro, Protobuf, and JSON Schema.<\/li>\n<li>Serializers and deserializers are used by Kafka producers and consumers to convert between Java objects and Kafka's byte[] (serializers write a magic byte plus the 4-byte schema ID before the payload).<\/li>\n<li>Key classes include:<\/li>\n<li><code>KafkaAvroSerializer<\/code> and <code>KafkaAvroDeserializer<\/code> for Avro.<\/li>\n<li><code>KafkaProtobufSerializer<\/code> and <code>KafkaProtobufDeserializer<\/code> for Protobuf.<\/li>\n<li><code>KafkaJsonSchemaSerializer<\/code> and <code>KafkaJsonSchemaDeserializer<\/code> for JSON Schema.<\/li>\n<li>Serializers and deserializers are configured with the Schema Registry URL and handle schema registration and retrieval automatically.<\/li>\n<li>When a serializer tries to serialize data with an unregistered schema:<\/li>\n<li>By default (<code>auto.register.schemas=true<\/code>) the serializer automatically registers the schema with Schema Registry before serializing the data.<\/li>\n<li>The serializer makes a call to the Schema Registry API to register the schema and retrieve the schema ID.<\/li>\n<li>If the schema registration is successful, the serializer proceeds with serializing the data using the registered schema.<\/li>\n<li>If the schema registration fails (e.g., due to incompatibility), the serializer throws an exception, and the data is not serialized.<\/li>\n<\/ul>\n<h4>6. 🚫 Multi-Datacenter Setup<\/h4>\n<ul>\n<li>Schema Registry supports multi-datacenter deployments for high availability and disaster recovery.<\/li>\n<li>In a multi-datacenter setup, each datacenter has its own Schema Registry instances, but only the primary datacenter accepts writes. The secondary instances are configured as not leader-eligible (<code>leader.eligibility=false<\/code>).<\/li>\n<li>The <code>_schemas<\/code> topic is copied from the primary to the secondary Kafka cluster with a cross-cluster tool (Confluent Replicator or MirrorMaker), not by Kafka's internal replication.<\/li>\n<li>Producers and consumers in each datacenter interact with their local Schema Registry cluster for schema registration and retrieval.<\/li>\n<li>Schema replication in a multi-datacenter setup works as follows:<\/li>\n<li>One datacenter is designated as the primary (or master) datacenter, and the others are secondary (or slave) datacenters.<\/li>\n<li>When a schema is registered or updated in the primary datacenter, the Schema Registry cluster in the primary datacenter writes the schema to a special Kafka topic (<code>_schemas<\/code> by default).<\/li>\n<li>The Schema Registry instances in the secondary datacenters consume the replicated <code>_schemas<\/code> topic and apply the changes locally.<\/li>\n<li>Replication is asynchronous, so secondary datacenters are eventually consistent. On primary failure an operator must promote a secondary.<\/li>\n<\/ul>\n<h4>7. 🚫 Schema Registry Security<\/h4>\n<ul>\n<li>Schema Registry supports authentication and authorization to secure access to schemas and the API.<\/li>\n<li>Authentication mechanisms include:<\/li>\n<li>Basic Auth: Username and password-based authentication.<\/li>\n<li>SSL/TLS: Encryption and authentication using certificates.<\/li>\n<li>OAuth/OIDC (in newer Confluent Platform versions).<\/li>\n<li>Authorization of subjects/API endpoints is provided by Confluent add-ons (e.g. RBAC, Schema Registry ACL authorizer), which are outside the exam scope.<\/li>\n<li>Securing Schema Registry's own connection to Kafka is configured with the <code>kafkastore.*<\/code> properties (e.g. <code>kafkastore.security.protocol<\/code>, <code>kafkastore.sasl.*<\/code>, <code>kafkastore.ssl.*<\/code>).<\/li>\n<li>Securing the REST API is configured separately (e.g. <code>listeners<\/code> with <code>https://<\/code>, <code>authentication.method=BASIC<\/code>).<\/li>\n<li>Clients provide credentials with <code>basic.auth.credentials.source<\/code> and <code>basic.auth.user.info<\/code> (or SSL key/trust stores).<\/li>\n<\/ul>\n<h4>8. 🚫 Confluent Control Center Integration<\/h4>\n<ul>\n<li>Schema Registry integrates with Confluent Control Center, a web-based user interface for managing and monitoring Kafka clusters.<\/li>\n<li>Control Center provides a graphical interface for viewing and managing schemas, subject compatibility, and schema evolution.<\/li>\n<li>It allows searching for schemas, viewing schema details, and testing schema compatibility.<\/li>\n<li>Control Center also provides monitoring and alerting capabilities for Schema Registry, including metrics on schema registration, retrieval, and compatibility checks.<\/li>\n<li>To view the schema history for a subject in Confluent Control Center:<\/li>\n<li>Navigate to the &quot;Schema Registry&quot; section.<\/li>\n<li>Select the desired subject from the list of available subjects.<\/li>\n<li>In the subject details page, the schema history is displayed, including the version number, schema, and timestamp of each registered schema version.<\/li>\n<li>Different versions of the schema can be compared to see the changes between them.<\/li>\n<li>Control Center provides a user-friendly interface to explore the schema history and track the evolution of schemas over time.<\/li>\n<\/ul>\n<h4>9. Best Practices<\/h4>\n<ul>\n<li>Use a meaningful and consistent subject naming convention based on your use case and subject naming strategy.<\/li>\n<li>Define schemas with appropriate compatibility rules to allow for schema evolution while maint
