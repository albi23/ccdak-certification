aining compatibility.<\/li>\n<li>Use Avro, Protobuf, or JSON Schema for strong typing and schema validation.<\/li>\n<li>Ensure that producers and consumers are configured with the correct serializers and deserializers that match the schemas.<\/li>\n<li>Monitor Schema Registry metrics and logs to identify any issues or performance bottlenecks.<\/li>\n<li>Implement proper security measures, such as authentication and authorization, to protect sensitive schema information.<\/li>\n<li>Use Schema Registry in conjunction with Kafka Connect (and Kafka Streams) to enable seamless data integration and stream processing with schema validation.<\/li>\n<li>Common schema evolution use cases include:<\/li>\n<li>Adding a new optional field to a schema: Producers can start including the new field in the data, while consumers can handle data with or without the field.<\/li>\n<li>Removing an existing field from a schema: Producers can stop including the field in the data, and consumers can handle data with or without the field (assuming a default value is provided).<\/li>\n<li>Renaming a field: Add a new field with the new name and mark the old field as deprecated. Consumers can handle both the old and new field names until the old field is completely removed.<\/li>\n<li>Changing the data type of a field: This requires careful consideration and may involve a multi-step process, such as adding a new field with the new data type and gradually migrating producers and consumers to use the new field.<\/li>\n<li>Evolving schemas in a backward or forward compatible manner allows for smooth updates and reduces the risk of data incompatibility between producers and consumers.<\/li>\n<\/ul>\n<h3>Additional Key Concepts<\/h3>\n<h4>Schema Validation<\/h4>\n<ul>\n<li><strong>Validation<\/strong>: Ensure that the schema conforms to the expected structure and data types.\n<ul>\n<li>The Schema Registry provides a way to validate schemas before registering them.<\/li>\n<li>Validation helps to catch errors early and enforce schema correctness.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Schema References<\/strong>: Use schema references to manage shared schemas and reduce redundancy.\n<ul>\n<li>Particularly useful for complex schema structures.<\/li>\n<li>References can help maintain consistency and ease of schema updates.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h4>Advanced Avro Features<\/h4>\n<ul>\n<li><strong>Logical Types<\/strong>: Utilize logical types in Avro for precise representations of specific data types.\n<ul>\n<li>Examples: dates, times, decimal values.<\/li>\n<li>Improves readability and interoperability of data.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Default Values<\/strong>: Define default values for fields to handle missing data gracefully.\n<ul>\n<li>Important for schema evolution and backward compatibility.<\/li>\n<li>Helps ensure that older consumers can still process newer data.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>Implementing Schema Registry and Avro<\/h3>\n<h4>Configuration Tips<\/h4>\n<ul>\n<li><strong>Global Compatibility Setting<\/strong>: Configure a global compatibility level for the Schema Registry.\n<ul>\n<li>Ensures consistent schema evolution policies across all subjects.<\/li>\n<li>Reduces the risk of introducing breaking changes.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Caching<\/strong>: Enable caching for schema lookups to improve performance.\n<ul>\n<li>Particularly beneficial in high-throughput environments.<\/li>\n<li>Reduces latency in schema retrievals.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h4>Monitoring and Metrics<\/h4>\n<ul>\n<li><strong>Metrics Collection<\/strong>: Use monitoring tools to track metrics related to schema operations.\n<ul>\n<li>Confluent Control Center is a recommended tool.<\/li>\n<li>Metrics to track: schema registrations, retrievals, compatibility checks.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Alerting<\/strong>: Set up alerts for common issues.\n<ul>\n<li>Schema compatibility violations.<\/li>\n<li>High latency in schema retrievals.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>Kafka Streams and Schema Registry Integration<\/h3>\n<ul>\n<li><strong>Kafka Streams<\/strong>: Integrate Schema Registry with Kafka Streams for stream processing.\n<ul>\n<li>Use <code>SpecificAvroSerde<\/code> or <code>GenericAvroSerde<\/code> for serialization and deserialization.<\/li>\n<li>Ensure schema compatibility to avoid runtime errors.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>Avro Serialization Details<\/h3>\n<h4>Custom Avro Conversions<\/h4>\n<ul>\n<li><strong>Custom Conversions<\/strong>: Implement custom conversions for complex data types.\n<ul>\n<li>Useful for types not natively supported by Avro.<\/li>\n<li>Can include certain Java objects or third-party library types.<\/li>\n<li>Enhances flexibility in handling diverse data formats.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>🚫 Security and Governance<\/h3>\n<h4>Data Governance<\/h4>\n<ul>\n<li><strong>Schema Governance<\/strong>: Implement schema governance policies.\n<ul>\n<li>Manage schema lifecycle, access control, and audit logging.<\/li>\n<li>Maintains data quality and ensures compliance with regulations.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Schema Evolution Strategies<\/strong>: Plan and document schema evolution strategies.\n<ul>\n<li>Include versioning conventions and deprecation policies.<\/li>\n<li>Ensures smooth transitions and minimizes disruptions.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>Common Issues and Troubleshooting<\/h3>\n<h4>Debugging Tips<\/h4>\n<ul>\n<li><strong>Schema Not Found<\/strong>: Ensure correct configuration for producer and consumer.\n<ul>\n<li>Verify the Schema Registry URL.<\/li>\n<li>Check that schemas are correctly registered.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Serialization Errors<\/strong>: Common issues and resolutions.\n<ul>\n<li>Missing schemas: Ensure schemas are registered before producing data.<\/li>\n<li>Incompatible schema changes: Review schema compatibility settings.<\/li>\n<li>Incorrect data types: Validate data against the schema.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>Additional Useful Commands<\/h3>\n<h4>Schema Deletion<\/h4>\n<ul>\n<li><strong>Deleting Schemas<\/strong>: Use Schema Registry API for schema deletion.\n<ul>\n<li>Ensure deletion does not impact existing consumers.<\/li>\n<\/ul>\n<pre><code># Delete a specific schema version\ncurl -X DELETE http://localhost:8081/subjects/test-topic-value/versions/1\n<\/code><\/pre>\n<\/li>\n<\/ul>\n<h4>Bulk Operations<\/h4>\n<ul>\n<li><strong>Bulk Schema Retrieval<\/strong>: Retrieve all versions of a schema.\n<ul>\n<li>Useful for auditing or migration purposes.<\/li>\n<\/ul>\n<pre><code># Retrieve all versions of a schema\ncurl -X GET http://localhost:8081/subjects/test-topic-value/versions\n<\/code><\/pre>\n<\/li>\n<\/ul>\n", "minutes": 17}, {"id": "10", "folder": "10.rest-proxy", "title": "REST Proxy", "desc": "HTTP access to Kafka (outside exam scope)", "kind": "extra", "html": "<blockquote>\n<p>🚫 = outside the CCDAK exam scope (see exam blueprint)<\/p>\n<\/blockquote>\n<h2>Kafka REST Proxy Overview 🚫<\/h2>\n<p>The Kafka REST Proxy provides a RESTful interface to a Kafka cluster, enabling the production and consumption of Kafka messages over HTTP. It's a critical component for integrating non-JVM applications with Kafka.<\/p>\n<h3>Key Points for CCDAK on REST Proxy<\/h3>\n<ul>\n<li><strong>Accessibility<\/strong>: Allows applications that cannot use Kafka's native client libraries to interact with Kafka topics via HTTP requests.<\/li>\n<li><strong>Integration<\/strong>: Simplifies integration with web-based applications and services, enabling a broader range of technologies to connect with Kafka.<\/li>\n<\/ul>\n<h3>Important Features of Kafka REST Proxy<\/h3>\n<h4>HTTP-Based Interaction<\/h4>\n<ul>\n<li><strong>Scope<\/strong>: Client-Server Communication<\/li>\n<li><strong>Description<\/strong>: Facilitates the production and consumption of messages through standard HTTP methods, making Kafka accessible from any language that can make HTTP requests.<\/li>\n<li><strong>Impact<\/strong>: Broadens Kafka's usability beyond traditional back-end systems to front-end and external systems without native Kafka support.<\/li>\n<\/ul>\n<h4>Consumer Group Management<\/h4>\n<ul>\n<li><strong>Scope<\/strong>: Consumption<\/li>\n<li><strong>Description<\/strong>: Supports the creation and management of consumer groups via RESTful endpoints, allowing detailed control over message consumption.<\/li>\n<li><strong>Impact<\/strong>: Enables efficient message processing and load balancing across multiple consumers using standard web technologies.<\/li>\n<\/ul>\n<h3>Essential REST Proxy Configuration Parameters<\/h3>\n<h4>Proxy Server Settings<\/h4>\n<ul>\n<li><strong><code>listeners<\/code><\/strong>: Configures the network address the REST Proxy listens on, defining how clients connect to the proxy.<\/li>\n<li><strong><code>host.name<\/code><\/strong> (deprecated in favour of <code>listeners<\/code>/<code>advertised.listeners<\/code>): Host name advertised to clients, e.g. in consumer instance base URIs.<\/li>\n<li><strong><code>bootstrap.servers<\/code><\/strong> / <strong><code>schema.registry.url<\/code><\/strong>: Kafka cluster and Schema Registry the proxy connects to. Settings prefixed with <code>producer.<\/code>, <code>consumer.<\/code>, <code>client.<\/code> are passed to the embedded clients.<\/li>\n<\/ul>\n<h4>Security and Authentication<\/h4>\n<ul>\n<li>🚫 <strong><code>authentication.method<\/code><\/strong>: <code>NONE<\/code> (default) or <code>BASIC<\/code> (with <code>authentication.roles<\/code> and <code>authentication.realm<\/code> and a JAAS login module) to control access to the REST Proxy.<\/li>\n<li>🚫 <strong>HTTPS<\/strong>: Use an <code>https://<\/code> URL in <code>listeners<\/code> plus <code>ssl.keystore.*<\/code> settings (there is no <code>ssl.enabled<\/code> property). Proxy-to-broker security uses <code>client.*<\/code> settings.<\/li>\n<\/ul>\n<h3>Advanced REST Proxy Configurations for Fine-Tuning<\/h3>\n<h4>Request and Consumer Settings<\/h4>\n<ul>\n<li><strong><code>consumer.request.timeout.ms<\/code><\/strong>: Maximum time a consume request waits for records if <code>consumer.request.max.bytes<\/code> has not been reached (default 1000 ms).<\/li>\n<li><strong><code>consumer.instance.timeout.ms<\/code><\/strong>: Idle time after which a consumer instance is automatically destroyed if no further requests are received (default 300000 ms). Helps manage server load and resource allocation.<\/li>\n<\/ul>\n<h4>Producing and Consuming Enhancements<\/h4>\n<ul>\n<li><strong><code>consumer.request.max.bytes<\/code><\/strong>: Maximum number of bytes of message data returned in a single consume response.<\/li>\n<li><strong><code>consumer.fetch.min.bytes<\/code><\/strong> (and other <code>consumer.<\/code>-prefixed settings): Passed through to the embedded Kafka consumers.<\/li>\n<li>Legacy: the old v1 API and its simple consumer settings (e.g. <code>simple.consumer.pool.size.max<\/code>) are deprecated. Use the v2 (and v3) APIs.<\/li>\n<\/ul>\n<h3>Key Considerations for Scalability and Reliability<\/h3>\n<h4>Load Balancing<\/h4>\n<ul>\n<li>Utilizing multiple REST Proxy instances behind a load balancer can help distribute client requests evenly, improving throughput and reducing latency.<\/li>\n<\/ul>\n<h4>High Availability<\/h4>\n<ul>\n<li>Deploying REST Proxy instances in different physical locations or availability zones can increase fault tolerance and ensure continuous availability of services.<\/li>\n<\/ul>\n<h4>Monitoring and Management<\/h4>\n<ul>\n<li>Monitoring the REST Proxy's performance and logs is crucial for maintaining an efficient and reliable system, enabling proactive management of potential issues.<\/li>\n<\/ul>\n<h3>Additional Points for CCDAK on REST Proxy<\/h3>\n<h4>Data Formats<\/h4>\n<ul>\n<li>The REST Proxy supports various embedded data formats for producing and consuming messages, including JSON, binary, Avro, Protobuf and JSON Schema. The format is chosen via the <code>Content-Type<\/code> header when producing (e.g. <code>application/vnd.kafka.json.v2+json<\/code>) and the <code>format<\/code> field when creating a consumer instance.<\/li>\n<li>It integrates with the Confluent Schema Registry for schema-based serialization and deserialization (<code>value_schema<\/code> / <code>value_schema_id<\/code> fields).<\/li>\n<li>For the binary format the data must be base64 encoded by the producer (and is returned base64 encoded to consumers). JSON and schema-based formats are sent as plain JSON.<\/li>\n<li>Produce requests use <code>POST /topics/{topic}<\/code>. Consumers are created with <code>POST /consumers/{group}<\/code>, then subscribed, polled with <code>GET .../records<\/code>, and offsets committed explicitly or automatically. Offsets are stored by the Kafka brokers in <code>__consumer_offsets<\/code>.<\/li>\n<li>The REST Proxy is a Confluent component (also reimplemented by Karapace), not part of Apache Kafka.<\/li>\n<\/ul>\n<h4>Authentication and Authorization<\/h4>\n<ul>\n<li>🚫 The REST Proxy supports HTTP Basic authentication and TLS (HTTPS, optionally client certificates) for access control at the HTTP layer.<\/li>\n<li>🚫 Towards Kafka, the proxy uses its own configured principal, so Kafka ACLs apply to the proxy's identity. Per-user principal propagation requires Confluent security plugins (RBAC, out of exam scope).<\/li>\n<\/ul>\n<h4>Error Handling and Response Codes<\/h4>\n<ul>\n<li>The REST Proxy handles errors and returns appropriate HTTP response codes for different scenarios, such as invalid requests, authentication failures, or Kafka-related errors.<\/li>\n<li>Clients can handle and interpret these response codes to effectively deal with errors and take appropriate actions.<\/li>\n<\/ul>\n<h4>Performance Considerations<\/h4>\n<ul>\n<li>Using the REST Proxy introduces some performance overhead compared to using Kafka's native client libraries directly.<\/li>\n<li>It's important to consider the trade-offs between ease of use and performance when deciding to use the REST Proxy.<\/li>\n<\/ul>\n<h4>Monitoring and Metrics<\/h4>\n<ul>\n<li>The REST Proxy provides metrics and monitoring endpoints for tracking its health and performance.<\/li>\n<li>These metrics can be integrated with monitoring tools and dashboards for effective monitoring and alerting.<\/li>\n<\/ul>\n<h4>Integration with Confluent Platform<\/h4>\n<ul>\n<li>The REST Proxy integrates with the Confluent Schema Registry for schema-based formats.<\/li>\n<li>🚫 Confluent Platform-specific management features (e.g. Control Center, RBAC) are outside the exam scope.<\/li>\n<\/ul>\n", "minutes": 4}, {"id": "11", "folder": "11.monitoring-metrics", "title": "Monitoring & Metrics", "desc": "JMX metrics, lag, logging, errors, alerts", "kind": "core", "html": "<blockquote>\n<p>🚫 = outside the CCDAK exam scope (see exam blueprint)<\/p>\n<\/blockquote>\n<h2>Monitoring and Metrics in Kafka<\/h2>\n<p>Monitoring and Metrics in Kafka Kafka exposes rich metrics to monitor the health, performance, and utilization metrics of Kafka brokers, producers, and consumers. The ability to obtain these metrics quickly and at scale is vital for troubleshooting and optimizing Kafka cluster .<\/p>\n<h3>Points to Remember for CCDAK on Monitoring and Metrics<\/h3>\n<ul>\n<li><strong>JMX Integration<\/strong>: Kafka metrics can be exposed via JMX, allowing integration with monitoring tools.<\/li>\n<li><strong>Custom Reporters<\/strong>: Kafka supports pluggable metrics reporters for flexibility in how metrics are reported and consumed.<\/li>\n<li><strong>Performance Tuning<\/strong>: Metrics are key to identifying bottlenecks and tuning Kafka for optimal performance.<\/li>\n<li><strong>Operational Insight<\/strong>: Monitoring provides insights into Kafka's operational status, including throughput, latency, and resource utilization.<\/li>\n<\/ul>\n<h3>Important Monitoring and Metrics Properties<\/h3>\n<h4><code>kafka.metrics.reporters<\/code> (legacy, broker-side Yammer metrics)<\/h4>\n<ul>\n<li><strong>Default<\/strong>: &quot;&quot;<\/li>\n<li><strong>Description<\/strong>: Comma-separated list of classes to report Kafka's <strong>Yammer<\/strong> (server-side) metrics. These reporters implement the <code>kafka.metrics.KafkaMetricsReporter<\/code> interface. This is the older broker-only mechanism. Most modern monitoring uses <code>metric.reporters<\/code> (the Kafka Metrics framework) plus the built-in <code>JmxReporter<\/code>.<\/li>\n<li><strong>Trade-offs<\/strong>: Adding custom reporters can enhance monitoring capabilities but might introduce additional overhead.<\/li>\n<\/ul>\n<h4><code>metric.reporters<\/code><\/h4>\n<ul>\n<li><strong>Default<\/strong>: <code>org.apache.kafka.common.metrics.JmxReporter<\/code> (since Kafka 4.0; in older versions the default was &quot;&quot; but the built-in <code>JmxReporter<\/code> was always enabled). Note: <code>auto.include.jmx.reporter<\/code> was removed in 4.0, and the <code>metrics.jmx.whitelist<\/code>/<code>metrics.jmx.blacklist<\/code> configs were renamed to <code>metrics.jmx.include<\/code>/<code>metrics.jmx.exclude<\/code>.<\/li>\n<li><strong>Description<\/strong>: Comma-separated list of classes to report metrics (brokers, producers, consumers, Streams). These reporters implement the <code>org.apache.kafka.common.metrics.MetricsReporter<\/code> interface.<\/li>\n<li><strong>Trade-offs<\/strong>: Enables detailed monitoring of producer and consumer metrics, with the trade-off of potential performance impact due to monitoring overhead.<\/li>\n<\/ul>\n<h4><code>metrics.num.samples<\/code><\/h4>\n<ul>\n<li><strong>Default<\/strong>: 2<\/li>\n<li><strong>Description<\/strong>: The number of samples maintained to compute metrics.<\/li>\n<li><strong>Trade-offs<\/strong>: Higher values provide more accurate metrics but can consume more memory.<\/li>\n<\/ul>\n<h4><code>metrics.sample.window.ms<\/code><\/h4>\n<ul>\n<li><strong>Default<\/strong>: 30000 (30 seconds)<\/li>\n<li><strong>Description<\/strong>: The time window associated with each sample. Affects how metrics are calculated over time.<\/li>\n<li><strong>Trade-offs<\/strong>: Larger windows provide smoother metrics over time but may delay detection of spikes or drops in metric values.<\/li>\n<\/ul>\n<h4><code>metrics.recording.level<\/code><\/h4>\n<ul>\n<li><strong>Default<\/strong>: INFO<\/li>\n<li><strong>Description<\/strong>: The highest recording level for metrics in clients. Options are INFO, DEBUG or TRACE.<\/li>\n<li><strong>Trade-offs<\/strong>: DEBUG provides more granular metrics but can significantly increase the amount of data collected, impacting performance and storage.<\/li>\n<\/ul>\n<h3>Broker Metrics:<\/h3>\n<ul>\n<li><code>UnderReplicatedPartitions<\/code>: Number of partitions that are under-replicated. Use case: Identifying replication issues. Alert if greater than 0.<\/li>\n<li><code>ActiveControllerCount<\/code>: Number of active controllers in the cluster. Use case: Ensuring controller failover is working correctly. Should be 1. Alert if not 1. (The <strong>unique<\/strong> controller takes care of Leader Election, Cluster Metadata, Rebalancing Partitions and Handling Broker Failures)<\/li>\n<li><code>OfflinePartitionsCount<\/code>: Number of partitions without an active leader. Use case: Detecting availability issues. Should be 0. Alert if greater than 0.<\/li>\n<li><code>RequestHandlerAvgIdlePercent<\/code>: Average idle percentage of the request handler thread pool. Use case: Monitoring request handling capacity. Low values may indicate resource contention.<\/li>\n<li><code>NetworkProcessorAvgIdlePercent<\/code>: Average idle percentage of the network thread pool. Use case: Monitoring network processing capacity. Low values suggest potential network bottlenecks.<\/li>\n<li><code>IsrExpandsPerSec<\/code>: Rate at which the in-sync replica set is expanding. Use case: Tracking replica synchronization.<\/li>\n<li><code>IsrShrinksPerSec<\/code>: Monitors the rate at which replicas are removed from the ISR list per second. Use case: Tracking replica synchronization issues.<\/li>\n<li><code>BytesInPerSec<\/code> and <code>BytesOutPerSec<\/code>: Inbound and outbound byte rate of brokers. Use case: Monitoring data throughput.<\/li>\n<li><code>MessagesInPerSec<\/code>: Rate at which messages are being produced to brokers. Use case: Tracking message production rate.<\/li>\n<li><code>UnderMinIsrPartitionCount<\/code>: Number of partitions with insufficient in-sync replicas. Use case: Identifying replication issues.<\/li>\n<li><code>PartitionCount<\/code>: Total number of partitions across all topics in the cluster. Use case: Monitoring cluster capacity.<\/li>\n<li><code>LeaderCount<\/code>: Number of partitions for which a broker is the leader. Use case: Monitoring leadership distribution.<\/li>\n<li><code>RequestQueueSize<\/code> and <code>ResponseQueueSize<\/code>: Size of request and response queues. Use case: Ensuring brokers can keep up with client requests.<\/li>\n<li><code>TotalTimeMs<\/code> (<code>kafka.network:type=RequestMetrics<\/code>, tagged <code>request=Produce<\/code>, <code>FetchConsumer<\/code>, <code>FetchFollower<\/code>, ...): Total time taken to process a request, broken down into <code>RequestQueueTimeMs<\/code>, <code>LocalTimeMs<\/code>, <code>RemoteTimeMs<\/code> (waiting for followers, e.g. <code>acks=all<\/code>), <code>ResponseQueueTimeMs<\/code> and <code>ResponseSendTimeMs<\/code>. High values may indicate performance issues. Use case: Monitoring request latency.<\/li>\n<li><code>RequestsPerSec<\/code>: Rate of requests per request type. Use case: Monitoring broker load.<\/li>\n<li><code>FetchMessageConversionsPerSec<\/code>: Rate of message format conversions during fetch requests. Use case: Tracking message format compatibility.<\/li>\n<li>🚫 <code>ZooKeeperRequestLatencyMs<\/code>: Latency of ZooKeeper requests made by Kafka. Use case: Monitoring ZooKeeper performance. (Legacy: ZooKeeper was removed in Kafka 4.0; KRaft clusters use <code>kafka.controller<\/code> / <code>kafka.server:type=raft-metrics<\/code> instead.)<\/li>\n<li><code>ControllerState<\/code>: State of the controller (e.g. idle or running a particular operation) - it does not tell whether a node is the active controller. <code>ActiveControllerCount<\/code> (1 if active, 0 if not) does. Use case: Monitoring controller health.<\/li>\n<li><code>LogFlushRateAndTimeMs<\/code>: Monitors the rate and time of log flushes. High values can indicate I/O bottlenecks. Use case: Identifying disk performance issues.<\/li>\n<li><code>LeaderElectionRateAndTimeMs<\/code>: Monitors the rate and time taken for leader election. High values may indicate issues with the controller or network. Use case: Tracking controller performance and stability.<\/li>\n<li><code>HeapMemoryUsage<\/code> (JVM MBean <code>java.lang:type=Memory<\/code>, not a Kafka-defined metric): Tracks heap usage, helping to identify potential memory leaks or insufficient heap sizes. Use case: Monitoring broker memory utilization.<\/li>\n<li><code>CollectionTime<\/code> / <code>CollectionCount<\/code> (JVM MBean <code>java.lang:type=GarbageCollector,name=*<\/code>): Time spent in garbage collection. High values can indicate potential performance issues. Use case: Identifying JVM garbage collection overhead.<\/li>\n<li>🚫 <code>ZooKeeperDisconnectsPerSec<\/code>: Rate of disconnects from ZooKeeper. Legacy (ZooKeeper removed in Kafka 4.0).<\/li>\n<li><code>Size<\/code> (<code>kafka.log:type=Log,name=Size<\/code>): On-disk size of each partition log. Kafka does not expose free disk space over JMX. Monitor it at OS level.<\/li>\n<\/ul>\n<h3>Consumer Metrics:<\/h3>\n<ul>\n<li><code>records-lag-max<\/code>: Maximum lag in terms of number of records for any partition in this window. Use case: Monitoring consumer lag.<\/li>\n<li><code>fetch-latency-avg<\/code>: Average time taken for a fetch request. Use case: Monitoring consumer performance.<\/li>\n<li><code>records-consumed-rate<\/code>: The average number of records consumed per second. Use case: Tracking consumer throughput.<\/li>\n<li><code>fetch-rate<\/code>: Number of fetch requests per second. Use case: Monitoring consumer activity (broker side: <code>TotalFetchRequestsPerSec<\/code>).<\/li>\n<li><code>records-lag<\/code> (per partition) / consumer lag: how many messages the consumer is behind. Lag is not a single broker JMX bean. It is also available from <code>kafka-consumer-groups.sh --describe<\/code> or tools such as Burrow.<\/li>\n<\/ul>\n<h3>Producer Metrics:<\/h3>\n<ul>\n<li><code>record-send-rate<\/code>: The average number of records sent per second. Use case: Monitoring producer throughput.<\/li>\n<li><code>request-latency-avg<\/code>: The average request latency in ms. Use case: Monitoring producer latency.<\/li>\n<li><code>outgoing-byte-rate<\/code>: The average number of outgoing bytes sent per second to all servers. Use case: Monitoring producer network utilization.<\/li>\n<li><code>request-rate<\/code>: Number of requests sent per second. Use case: Monitoring producer activity (broker side: <code>TotalProduceRequestsPerSec<\/code>).<\/li>\n<\/ul>\n<h3>Topic Metrics:<\/h3>\n<ul>\n<li><code>BrokerTopicMetrics<\/code>: Monitors topic-specific metrics such as bytes in/out, messages in/out, etc. Use case: Analyzing performance at the topic level.<\/li>\n<\/ul>\n<h3>Confluent-Specific Metrics (🚫 vendor-specific, outside exam scope):<\/h3>\n<ul>\n<li>Schema Registry: <code>schema-registry.registered.count<\/code>: Number of registered schemas. Use case: Monitoring schema usage.<\/li>\n<li>Kafka Connect: <code>connect-worker.connector-started-task-count<\/code>: Number of tasks started for a connector. Use case: Monitoring connector health.<\/li>\n<li>🚫 ksqlDB: <code>ksql-server.query-stats.bytes-consumed-total<\/code>: Total bytes consumed by ksqlDB queries. Use case: Monitoring ksqlDB resource usage.<\/li>\n<\/ul>\n<h3>Important Kafka Metrics<\/h3>\n<h4><code>UnderReplicatedPartitions<\/code><\/h4>\n<ul>\n<li><strong>Description<\/strong>: Represents the number of partitions that are under-replicated, meaning they have fewer in-sync replicas (ISRs) than the desired replication factor.<\/li>\n<li><strong>Importance<\/strong>: This metric is crucial for monitoring the health and reliability of the Kafka cluster. A non-zero value indicates that some partitions are at risk of data loss if a broker fails.<\/li>\n<li><strong>Monitoring Recommendations<\/strong>:<\/li>\n<li>Alert if the value is consistently greater than 0.<\/li>\n<li>Investigate the root cause of under-replication, such as broker failures, network issues, or insufficient disk space.<\/li>\n<li>Ensure that the replication factor is set appropriately based on the desired fault tolerance.<\/li>\n<\/ul>\n<h4><code>ActiveControllerCount<\/code><\/h4>\n<ul>\n<li><strong>Description<\/strong>: Indicates the number of active controllers in the Kafka cluster. In a healthy cluster, there should be exactly one active controller.<\/li>\n<li><strong>Importance<\/strong>: The controller is responsible for managing partition leader elections and maintaining the overall state of the cluster. Having multiple active controllers can lead to conflicts and instability.<\/li>\n<li><strong>Monitoring Recommendations<\/strong>:<\/li>\n<li>Alert if the value deviates from 1.<\/li>\n<li>If multiple controllers are detected, investigate the root cause, such as network partitions or issues with the KRaft controller quorum (ZooKeeper in pre-4.0 clusters).<\/li>\n<\/ul>\n<h4><code>OfflinePartitionsCount<\/code><\/h4>\n<ul>\n<li><strong>Description<\/strong>: Represents the number of partitions without an active leader. These partitions are unavailable for producing or consuming messages.<\/li>\n<li><strong>Importance<\/strong>: Offline partitions indicate a problem with the Kafka cluster and can impact data availability and processing.<\/li>\n<li><strong>Monitoring Recommendations<\/strong>:<\/li>\n<li>Alert if the value is greater than 0.<\/li>\n<li>Investigate the reasons for offline partitions, such as broker failures, network issues, or insufficient replicas.<\/li>\n<\/ul>\n<h4><code>BytesInPerSec<\/code> and <code>BytesOutPerSec<\/code><\/h4>\n<ul>\n<li><strong>Description<\/strong>: Measures the inbound and outbound byte rate of Kafka brokers, indicating the amount of data being produced to and consumed from the cluster.<\/li>\n<li><strong>Importance<\/strong>: Monitoring these metrics helps in understanding the data throughput and identifying potential bottlenecks or performance issues.<\/li>\n<li><strong>Monitoring Recommendations<\/strong>:<\/li>\n<li>Set appropriate thresholds based on the expected data volume and network capacity.<\/li>\n<li>Monitor trends over time to detect anomalies or sudden spikes in data throughput.<\/li>\n<li>Correlate with other metrics like <code>MessagesInPerSec<\/code> and <code>TotalProduceRequestsPerSec<\/code> to gain insights into producer and consumer behavior.<\/li>\n<\/ul>\n<h4>Consumer lag (<code>records-lag-max<\/code>)<\/h4>\n<ul>\n<li><strong>Description<\/strong>: Represents the lag of consumers, indicating how many messages they are behind the latest offset in the partition they are consuming from.<\/li>\n<li><strong>Importance<\/strong>: Consumer lag is a critical metric for monitoring the health and performance of Kafka consumers. High consumer lag can indicate issues like slow processing, insufficient consumer resources, or problems with the consumer application.<\/li>\n<li><strong>Monitoring Recommendations<\/strong>:<\/li>\n<li>Set appropriate lag thresholds based on the acceptable delay in message processing.<\/li>\n<li>Alert if the lag exceeds the defined thresholds consistently.<\/li>\n<li>Investigate the root cause of high consumer lag, such as slow processing logic, resource contention, or network issues.<\/li>\n<\/ul>\n<h4><code>TotalTimeMs<\/code> (<code>request=Produce<\/code> / <code>request=Fetch*<\/code>)<\/h4>\n<ul>\n<li><strong>Description<\/strong>: Measures the total time taken for produce and fetch requests, respectively. These metrics provide insights into the latency of producer and consumer operations.<\/li>\n<li><strong>Importance<\/strong>: Monitoring these metrics helps in identifying performance bottlenecks and ensuring that produce and fetch operations are within acceptable latency ranges.<\/li>\n<li><strong>Monitoring Recommendations<\/strong>:<\/li>\n<li>Set appropriate latency thresholds based on the requirements of the application.<\/li>\n<li>Alert if the latency consistently exceeds the defined thresholds.<\/li>\n<li>Analyze trends over time to detect degradation in performance and investigate the underlying causes.<\/li>\n<\/ul>\n<h2>Logging and log4j Configuration (CCDAK)<\/h2>\n<ul>\n<li>Kafka brokers and tools use <strong>Log4j<\/strong> (Kafka ≤ 3.x: <code>config/log4j.properties<\/code>; Kafka 4.0+ moved to <strong>Log4j2<\/strong>: <code>config/log4j2.yaml<\/code>). Clients (producer/consumer) use <strong>SLF4J<\/strong> — you supply the binding (log4j/logback) in your application.<\/li>\n<li>Key broker log files / appenders: <code>server.log<\/code> (general), <code>controller.log<\/code>, <code>state-change.log<\/code> (partition/replica state changes — useful for leader-election debugging), <code>kafka-request.log<\/code> (per request, <code>TRACE<\/code>/<code>DEBUG<\/code> only for debugging), <code>log-cleaner.log<\/code> (compaction), <code>kafka-authorizer.log<\/code> (ACL allow/deny audit).<\/li>\n<li>Appenders usually <code>DailyRollingFileAppender<\/code>/rolling file. Levels: <code>TRACE &lt; DEBUG &lt; INFO &lt; WARN &lt; ERROR &lt; FATAL<\/code>.<\/li>\n<li><strong>Change at runtime<\/strong> (no restart): <code>kafka-configs.sh --bootstrap-server ... --entity-type broker-loggers --entity-name 0 --alter --add-config kafka.server.KafkaApis=DEBUG<\/code> (dynamic logger levels via the Admin API / JMX <code>Log4jController<\/code>).<\/li>\n<li>Select the config at startup with <code>KAFKA_LOG4J_OPTS=&quot;-Dlog4j.configuration=file:/path/log4j.properties&quot;<\/code> (Log4j2: <code>-Dlog4j2.configurationFile=<\/code>). <code>LOG_DIR<\/code> env var sets the log directory.<\/li>\n<li><strong>Don't confuse<\/strong>: <code>server.log<\/code> (application logs, <code>LOG_DIR<\/code>) ≠ <strong>data/commit logs<\/strong> (<code>log.dirs<\/code>, the topic segments).<\/li>\n<li>Kafka Connect: <code>connect-log4j.properties<\/code>. Connect REST API can change logger levels at runtime: <code>PUT /admin/loggers/{logger}<\/code> with <code>{&quot;level&quot;:&quot;DEBUG&quot;}<\/code>, and <code>GET /admin/loggers<\/code>. Connect adds connector context (<code>[connector|task-0]<\/code>) to log lines (<code>connector.client.config.override.policy<\/code>, MDC).<\/li>\n<li>Kafka Streams: log level for <code>org.apache.kafka.streams<\/code> — use <code>DEBUG<\/code> to see task assignment / state restoration.<\/li>\n<li>Avoid <code>DEBUG<\/code>/<code>TRACE<\/code> globally in production (volume and latency).<\/li>\n<\/ul>\n<h2>Common Errors (CCDAK)<\/h2>\n<table>\n<thead>\n<tr>\n<th>Error / exception<\/th>\n<th>Meaning / typical cause<\/th>\n<th>Fix<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>NotEnoughReplicasException<\/code> / <code>NotEnoughReplicasAfterAppendException<\/code><\/td>\n<td>ISR size &lt; <code>min.insync.replicas<\/code> with <code>acks=all<\/code><\/td>\n<td>Restore brokers. Check <code>min.insync.replicas<\/code> vs RF<\/td>\n<\/tr>\n<tr>\n<td><code>NotLeaderOrFollowerException<\/code> (formerly <code>NotLeaderForPartition<\/code>)<\/td>\n<td>Request sent to a broker that is no longer leader (retriable)<\/td>\n<td>Metadata refresh happens automatically. Retries<\/td>\n<\/tr>\n<tr>\n<td><code>LeaderNotAvailableException<\/code><\/td>\n<td>Leader election in progress / no leader (retriable)<\/td>\n<td>Wait/retry<\/td>\n<\/tr>\n<tr>\n<td><code>TimeoutException<\/code> (e.g. &quot;Topic not present in metadata after max.block.ms&quot;, &quot;Expiring N records... delivery.timeout.ms&quot;)<\/td>\n<td>Broker unreachable, wrong <code>bootstrap.servers<\/code>/<code>advertised.listeners<\/code>, topic missing, or batch not delivered in time<\/td>\n<td>Check connectivity/listeners, <code>delivery.timeout.ms<\/code>, <code>max.block.ms<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>RecordTooLargeException<\/code> / <code>MessageSizeTooLargeException<\/code><\/td>\n<td>Record &gt; <code>max.request.size<\/code> / <code>message.max.bytes<\/code><\/td>\n<td>Raise limits consistently or reduce size/compress<\/td>\n<\/tr>\n<tr>\n<td><code>SerializationException<\/code> / <code>RecordDeserializationException<\/code><\/td>\n<td>Wrong or mismatched serializer/deserializer, bad data (poison pill)<\/td>\n<td>Align serdes. Skip/DLQ bad record<\/td>\n<\/tr>\n<tr>\n<td><code>CommitFailedException<\/code><\/td>\n<td>Consumer lost partitions (rebalance, <code>max.poll.interval.ms<\/code> exceeded) before committing<\/td>\n<td>Reduce <code>max.poll.records<\/code>, speed processing, raise <code>max.poll.interval.ms<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>RebalanceInProgressException<\/code><\/td>\n<td>Commit/operation during a rebalance<\/td>\n<td>Retry after rebalance<\/td>\n<\/tr>\n<tr>\n<td><code>OffsetOutOfRangeException<\/code><\/td>\n<td>Offset deleted by retention or beyond end<\/td>\n<td><code>auto.offset.reset<\/code> or seek<\/td>\n<\/tr>\n<tr>\n<td><code>UnknownTopicOrPartitionException<\/code><\/td>\n<td>Topic doesn't exist (and auto-create disabled)<\/td>\n<td>Create topic<\/td>\n<\/tr>\n<tr>\n<td><code>TopicAuthorizationException<\/code> / <code>GroupAuthorizationException<\/code> / <code>SaslAuthenticationException<\/code><\/td>\n<td>Missing ACL or bad credentials<\/td>\n<td>Add ACLs. Check <code>sasl.jaas.config<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>SSLHandshakeException<\/code> / &quot;unable to find valid certification path&quot;<\/td>\n<td>Bad truststore/keystore or hostname mismatch (<code>ssl.endpoint.identification.algorithm<\/code>)<\/td>\n<td>Fix certs/SANs<\/td>\n<\/tr>\n<tr>\n<td><code>ProducerFencedException<\/code> / <code>InvalidProducerEpochException<\/code><\/td>\n<td>Another producer with the same <code>transactional.id<\/code> took over<\/td>\n<td>Close fenced producer<\/td>\n<\/tr>\n<tr>\n<td><code>InvalidTopicException<\/code>, <code>InvalidReplicationFactorException<\/code><\/td>\n<td>RF &gt; number of alive brokers, bad topic name<\/td>\n<td>Fix request<\/td>\n<\/tr>\n<tr>\n<td><code>FencedInstanceIdException<\/code><\/td>\n<td>Duplicate <code>group.instance.id<\/code><\/td>\n<td>Unique ids per instance<\/td>\n<\/tr>\n<tr>\n<td>Consumer stuck / constant rebalances<\/td>\n<td>Processing time &gt; <code>max.poll.interval.ms<\/code>, or heartbeat/<code>session.timeout.ms<\/code> too low<\/td>\n<td>Tune poll/heartbeat settings<\/td>\n<\/tr>\n<tr>\n<td>&quot;Connection to node -1 could not be established&quot;<\/td>\n<td>Cannot reach bootstrap server / wrong listener<\/td>\n<td>Check <code>advertised.listeners<\/code>, network, security protocol<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>Retriable<\/strong> errors (<code>NotLeaderOrFollower<\/code>, <code>LeaderNotAvailable<\/code>, <code>NotEnoughReplicas<\/code>, timeouts) are retried by the producer. <strong>Non-retriable<\/strong> (<code>RecordTooLarge<\/code>, <code>Serialization<\/code>, authorization) fail immediately.<\/li>\n<\/ul>\n<h2>Configuring Alerts (CCDAK)<\/h2>\n<p>Alert on symptoms in these metrics (JMX / Prometheus / Burrow / Confluent Control Center):<\/p>\n<table>\n<thead>\n<tr>\n<th>Metric<\/th>\n<th>Alert condition<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>UnderReplicatedPartitions<\/code><\/td>\n<td><strong>&gt; 0<\/strong> for a sustained period<\/td>\n<td>Followers are lagging / broker down — most important broker alert<\/td>\n<\/tr>\n<tr>\n<td><code>ActiveControllerCount<\/code><\/td>\n<td><strong>≠ 1<\/strong> (sum across cluster)<\/td>\n<td>0 = no controller; &gt;1 = split brain<\/td>\n<\/tr>\n<tr>\n<td><code>OfflinePartitionsCount<\/code><\/td>\n<td><strong>&gt; 0<\/strong><\/td>\n<td>Partitions with no leader — unavailable for read/write<\/td>\n<\/tr>\n<tr>\n<td><code>UnderMinIsrPartitionCount<\/code><\/td>\n<td><strong>&gt; 0<\/strong><\/td>\n<td>Producers with <code>acks=all<\/code> will fail<\/td>\n<\/tr>\n<tr>\n<td><code>IsrShrinksPerSec<\/code> / <code>IsrExpandsPerSec<\/code><\/td>\n<td>Frequent shrinks without expands<\/td>\n<td>Unstable replicas / slow disks / network<\/td>\n<\/tr>\n<tr>\n<td><code>UncleanLeaderElectionsPerSec<\/code><\/td>\n<td><strong>&gt; 0<\/strong><\/td>\n<td>Possible data loss<\/td>\n<\/tr>\n<tr>\n<td><code>records-lag-max<\/code> / group lag (<code>kafka-consumer-groups.sh --describe<\/code>, Burrow)<\/td>\n<td>Lag <strong>growing<\/strong> over time (not just high)<\/td>\n<td>Consumers can't keep up<\/td>\n<\/tr>\n<tr>\n<td><code>RequestHandlerAvgIdlePercent<\/code> / <code>NetworkProcessorAvgIdlePercent<\/code><\/td>\n<td>&lt; ~20–30 %<\/td>\n<td>Broker thread pools saturated<\/td>\n<\/tr>\n<tr>\n<td><code>RequestQueueSize<\/code>, <code>TotalTimeMs<\/code> (Produce/Fetch)<\/td>\n<td>Rising / above SLA<\/td>\n<td>Latency problem<\/td>\n<\/tr>\n<tr>\n<td><code>BytesInPerSec<\/code> / <code>BytesOutPerSec<\/code><\/td>\n<td>Deviation from baseline / near NIC limit<\/td>\n<td>Capacity<\/td>\n<\/tr>\n<tr>\n<td>Disk usage of <code>log.dirs<\/code>, open file descriptors, JVM heap/GC pause<\/td>\n<td>&gt; 80 % / near limit<\/td>\n<td>Resource exhaustion<\/td>\n<\/tr>\n<tr>\n<td>Producer <code>record-error-rate<\/code>, <code>record-retry-rate<\/code><\/td>\n<td>Above 0 / rising<\/td>\n<td>Delivery problems<\/td>\n<\/tr>\n<tr>\n<td>Connect <code>connector-status<\/code>/ task <code>FAILED<\/code>, <code>deadletterqueue-produce-requests<\/code><\/td>\n<td>Task failed or DLQ growing<\/td>\n<td>Pipeline errors<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>Alert on <strong>rate of change / duration<\/strong> (e.g. &quot;URP &gt; 0 for 5 min&quot;) instead of single spikes to avoid noise.<\/li>\n<li>Tools: Prometheus + JMX exporter + Alertmanager, Grafana, Datadog, Burrow (lag evaluation, status OK/WARN/ERR), Confluent Control Center.<\/li>\n<\/ul>\n", "minutes": 12}, {"id": "12", "folder": "12.cluster-administration", "title": "Cluster Admin", "desc": "Controller, leader balancing, internal topics (outside exam scope)", "kind": "extra", "html": "<blockquote>\n<p>🚫 = outside the CCDAK exam scope (see exam blueprint)<\/p>\n<\/blockquote>\n<h2>Kafka Cluster Administration Configurations 🚫<\/h2>\n<p>Effective Kafka cluster management involves tuning various configurations to ensure optimal operation, fault tolerance, and efficient resource utilization. Key administrative settings help in maintaining balance across the cluster, managing topic lifecycle, and ensuring leadership distribution for resilience.<\/p>\n<h3>Key Points for CCDAK on Cluster Administration<\/h3>\n<ul>\n<li><strong>Cluster Balance and Efficiency<\/strong>: Settings related to leader election and rebalance are crucial for evenly distributing the load across the cluster.<\/li>\n<li><strong>Fault Tolerance<\/strong>: Proper configuration ensures the cluster remains operational even when certain nodes or partitions fail.<\/li>\n<li><strong>Topic Management<\/strong>: Ability to dynamically manage topics, including deletion, is essential for operational flexibility.<\/li>\n<li>Kafka uses a binary protocol over TCP.<\/li>\n<\/ul>\n<h3>APIs<\/h3>\n<p>There are five key APIs in Kafka:<\/p>\n<ul>\n<li><strong>Producer API:<\/strong> Enables applications to send streams of data to topics within the Kafka cluster.<\/li>\n<li><strong>Consumer API:<\/strong> Allows applications to read streams of data from topics within the Kafka cluster.<\/li>\n<li><strong>Streams API:<\/strong> Facilitates the transformation of data streams from input topics to output topics.<\/li>\n<li><strong>Connect API:<\/strong> Provides the capability to implement connectors that continuously pull data from source systems into Kafka or push data from Kafka to sink systems.<\/li>\n<li><strong>Admin API:<\/strong> Offers tools for managing and inspecting topics, brokers, and other Kafka objects.<\/li>\n<\/ul>\n<h3>🚫 Important Cluster Administration Properties<\/h3>\n<h4><code>controller.socket.timeout.ms<\/code><\/h4>\n<ul>\n<li><strong>Description<\/strong>: Timeout for controller-to-broker sockets. This setting impacts how long the controller waits for a response from a broker.<\/li>\n<li><strong>Default Value<\/strong>: 30000 milliseconds (30 seconds).<\/li>\n<li><strong>Impact<\/strong>: Affects the responsiveness and reliability of controller commands. Lower values may cause premature timeouts, while higher values can delay cluster reconfiguration in case of broker failures.<\/li>\n<\/ul>\n<h4><code>leader.imbalance.check.interval.seconds<\/code><\/h4>\n<ul>\n<li><strong>Description<\/strong>: Frequency at which the leader imbalance checker runs. This tool assesses if leaders are evenly distributed across the brokers.<\/li>\n<li><strong>Default Value<\/strong>: 300 seconds (5 minutes).<\/li>\n<li><strong>Impact<\/strong>: Adjusting this interval affects how quickly the cluster reacts to imbalances. More frequent checks can lead to a more balanced cluster but at the cost of increased control-plane traffic.<\/li>\n<\/ul>\n<h4><code>leader.imbalance.per.broker.percentage<\/code><\/h4>\n<ul>\n<li><strong>Description<\/strong>: The allowed percentage of leader imbalance on a broker before triggering a leader rebalance.<\/li>\n<li><strong>Default Value<\/strong>: 10 (percent).<\/li>\n<li><strong>Impact<\/strong>: Defines the threshold for triggering rebalances. Lower thresholds aim for stricter balance but might lead to more frequent leadership changes, potentially impacting performance.<\/li>\n<\/ul>\n<h4><code>auto.leader.rebalance.enable<\/code><\/h4>\n<ul>\n<li><strong>Description<\/strong>: Enables automatic leader rebalancing to evenly distribute leader partitions across brokers in the cluster.<\/li>\n<li><strong>Default Value<\/strong>: true.<\/li>\n<li><strong>Impact<\/strong>: When enabled, it helps in maintaining balance and can improve overall cluster performance and fault tolerance. However, frequent rebalancing can sometimes cause temporary performance dips.<\/li>\n<\/ul>\n<h4><code>delete.topic.enable<\/code><\/h4>\n<ul>\n<li><strong>Description<\/strong>: Allows topics to be deleted. When enabled, topics can be deleted, and their resources reclaimed.<\/li>\n<li><strong>Default Value<\/strong>: true (since Kafka 1.0).<\/li>\n<li><strong>Impact<\/strong>: Provides flexibility in managing topics but requires careful consideration to avoid accidental data loss. Ensuring this is enabled allows for better topic lifecycle management.<\/li>\n<\/ul>\n<h3>Internal Kafka Topics<\/h3>\n<p>Only <code>__consumer_offsets<\/code> and <code>__transaction_state<\/code> are Apache Kafka internal topics (and <code>__cluster_metadata<\/code> in KRaft mode, an internal metadata log not visible as a normal topic). The <code>connect-*<\/code> topic names are user-configurable (<code>config.storage.topic<\/code>, <code>offset.storage.topic<\/code>, <code>status.storage.topic<\/code>; <code>connect-configs<\/code>/<code>-offsets<\/code>/<code>-status<\/code> are only conventional names). <code>_schemas<\/code> is the default Schema Registry topic (<code>kafkastore.topic<\/code>). All <code>_confluent*<\/code> / <code>__confluent*<\/code> topics below are Confluent Platform specific and out of exam scope.<\/p>\n<p>Here are the important internal topics:<\/p>\n<ol>\n<li><code>__consumer_offsets<\/code>:<\/li>\n<\/ol>\n<ul>\n<li>Stores the offsets of consumer groups.<\/li>\n<li>Contains information about the last committed offset for each partition consumed by a consumer group.<\/li>\n<li>Helps in tracking the progress of consumers and enables them to resume from the last committed offset in case of failures or restarts.<\/li>\n<\/ul>\n<ol start=\"2\">\n<li><code>__transaction_state<\/code>:<\/li>\n<\/ol>\n<ul>\n<li>Stores the state of ongoing transactions in Kafka.<\/li>\n<li>Used by the Kafka transactional producer to ensure atomic writes across multiple partitions and topics.<\/li>\n<li>Enables transaction coordination and ensures data integrity in transactional messaging.<\/li>\n<\/ul>\n<ol start=\"3\">\n<li>🚫 <code>__confluent.support.metrics<\/code>:<\/li>\n<\/ol>\n<ul>\n<li>A topic used by Confluent's Proactive Support (telemetry) feature to collect support metrics about the cluster (not by Control Center).<\/li>\n<\/ul>\n<ol start=\"4\">\n<li><code>_schemas<\/code>:<\/li>\n<\/ol>\n<ul>\n<li>A topic used by the Confluent Schema Registry to store schema information.<\/li>\n<li>Contains versioned schemas associated with Kafka topics.<\/li>\n<li>Enables schema evolution and compatibility checks for Kafka producers and consumers.<\/li>\n<\/ul>\n<ol start=\"5\">\n<li><code>connect-configs<\/code>:<\/li>\n<\/ol>\n<ul>\n<li>A topic used by Kafka Connect to store connector and task configurations.<\/li>\n<li>Contains the configuration settings for Kafka Connect connectors and their associated tasks.<\/li>\n<li>Allows dynamic configuration updates and management of Kafka Connect deployments.<\/li>\n<\/ul>\n<ol start=\"6\">\n<li><code>connect-offsets<\/code>:<\/li>\n<\/ol>\n<ul>\n<li>A topic used by Kafka Connect to store the offsets of connector tasks.<\/li>\n<li>Contains information about the last processed offset for each partition by a connector task.<\/li>\n<li>Enables fault tolerance and resumption of connector tasks from the last processed offset.<\/li>\n<\/ul>\n<ol start=\"7\">\n<li><code>connect-status<\/code>:<\/li>\n<\/ol>\n<ul>\n<li>A topic used by Kafka Connect to store status information about connector tasks.<\/li>\n<li>Contains status updates and metadata related to the execution of connector tasks.<\/li>\n<li>Allows monitoring and tracking the health and progress of Kafka Connect tasks.<\/li>\n<\/ul>\n<ol start=\"8\">\n<li>🚫 <code>_confluent-command<\/code>:<\/li>\n<\/ol>\n<ul>\n<li>A topic used by Confluent Control Center to store and manage command requests.<\/li>\n<li>Enables sending and receiving control commands between Control Center and other Confluent components.<\/li>\n<li>Facilitates actions like starting/stopping connectors, modifying configurations, and triggering rebalances.<\/li>\n<\/ul>\n<ol start=\"9\">\n<li>🚫 <code>_confluent-monitoring<\/code>:<\/li>\n<\/ol>\n<ul>\n<li>A topic used by Confluent Control Center for monitoring purposes.<\/li>\n<li>Contains monitoring data and metrics related to the Confluent Platform components.<\/li>\n<li>Helps in collecting and analyzing health and performance data for the Confluent ecosystem.<\/li>\n<\/ul>\n<ol start=\"10\">\n<li>🚫 <code>_confluent-secrets<\/code>:<\/li>\n<\/ol>\n<ul>\n<li>A topic used by Confluent Control Center to store and manage secrets securely.<\/li>\n<li>Enables secure storage and retrieval of sensitive configuration values, such as passwords and API keys.<\/li>\n<li>Provides a centralized and encrypted storage for secrets used across the Confluent Platform.<\/li>\n<\/ul>\n<ol start=\"11\">\n<li>\n<p>(removed) <code>__consumer_timestamps<\/code> is not an Apache Kafka or Confluent internal topic. Consumer progress is tracked only via committed offsets in <code>__consumer_offsets<\/code>.<\/p>\n<\/li>\n<li>\n<p>🚫 <code>_confluent-metrics<\/code>:<\/p>\n<\/li>\n<\/ol>\n<ul>\n<li>A topic used by Confluent Control Center to store and manage metrics data.<\/li>\n<li>Contains metrics related to the performance and health of Kafka clusters, topics, and clients.<\/li>\n<li>Enables data visualization, alerting, and monitoring in Control Center.<\/li>\n<\/ul>\n<ol start=\"13\">\n<li>🚫 <code>_confluent-telemetry-metrics<\/code>:<\/li>\n<\/ol>\n<ul>\n<li>A topic used by Confluent Control Center to store and manage telemetry data.<\/li>\n<li>Contains usage and analytics data related to the Confluent Platform components.<\/li>\n<li>Helps in understanding platform usage, adoption, and performance trends.<\/li>\n<\/ul>\n<ol start=\"14\">\n<li>🚫 <code>ksql-clusterksql_processing_log<\/code>:<\/li>\n<\/ol>\n<ul>\n<li>A topic used by Confluent ksqlDB for storing processing logs.<\/li>\n<li>Contains information about the processing of ksqlDB queries, including errors and status updates.<\/li>\n<li>Helps in monitoring and troubleshooting ksqlDB processing pipelines.<\/li>\n<\/ul>\n<ol start=\"15\">\n<li>🚫 <code>_confluent-license<\/code>:<\/li>\n<\/ol>\n<ul>\n<li>A topic used by Confluent Control Center to store and manage license information.<\/li>\n<li>Contains data related to the Confluent Platform license, including expiration and feature entitlements.<\/li>\n<li>Helps in tracking and enforcing license compliance across the platform.<\/li>\n<\/ul>\n<h3>🚫 Default Ports<\/h3>\n<ul>\n<li>\n<p><strong>Broker<\/strong>: 9092<\/p>\n<\/li>\n<li>\n<p><strong>Schema Registry<\/strong>: 8081<\/p>\n<\/li>\n<li>\n<p><strong>REST Proxy<\/strong>: 8082<\/p>\n<\/li>\n<li>\n<p><strong>KSQL<\/strong>: 8088<\/p>\n<\/li>\n<li>\n<p><strong>Zookeeper Client Port<\/strong>: 2181<\/p>\n<\/li>\n<li>\n<p><strong>Zookeeper Leader Port<\/strong> (followers connect to leader): 2888<\/p>\n<\/li>\n<li>\n<p><strong>Zookeeper Election Port<\/strong>: 3888<\/p>\n<\/li>\n<li>\n<p><strong>KRaft Controller Listener<\/strong>: 9093 (conventional, set via <code>controller.listener.names<\/code>/<code>listeners<\/code>; ZooKeeper was removed in Kafka 4.0)<\/p>\n<\/li>\n<\/ul>\n", "minutes": 6}], "domains": [{"n": 1, "title": "Apache Kafka Fundamentals", "items": [{"text": "Connect to a secured Apache Kafka cluster", "modules": ["8", "1"]}, {"text": "Understand delivery guarantees", "modules": ["3", "2", "6"]}, {"text": "Demonstrate how consumer groups and partitions interact", "modules": ["2", "1"]}, {"text": "Define topics configurations", "modules": ["4", "1"]}, {"text": "Handle consumer group offsets", "modules": ["2", "5"]}, {"text": "Understand the purpose of a producer partitioner and how the default partitioner works", "modules": ["3", "4"]}, {"text": "Explain the difference between consumer assign and subscribe", "modules": ["2"]}, {"text": "Understand the relationship of the Apache Kafka resource hierarchy", "modules": ["1"]}, {"text": "Explain the lifecycle of a request in Apache Kafka", "modules": ["1"]}]}, {"n": 2, "title": "Apache Kafka Application Development", "items": [{"text": "Identify producer configurations", "modules": ["3"]}, {"text": "Understand serialization and deserialization", "modules": ["3", "2", "9"]}, {"text": "Serialize and deserialize messages", "modules": ["3", "2", "9"]}, {"text": "Describe transactions", "modules": ["3", "2", "6"]}, {"text": "Configure consumer groups", "modules": ["2"]}, {"text": "Design keys for partition strategies", "modules": ["3", "4"]}, {"text": "Design headers", "modules": ["3"]}, {"text": "Consume messages from an Apache Kafka® topic", "modules": ["2"]}, {"text": "Identify common data formats", "modules": ["3", "9"]}, {"text": "Apply error handling", "modules": ["3", "2", "7", "11"]}, {"text": "Understand best practices for modifying topics", "modules": ["4"]}, {"text": "Define data partitioning requirements", "modules": ["4", "3", "6"]}]}, {"n": 3, "title": "Apache Kafka Streams", "items": [{"text": "Differentiate Apache Kafka streams from consumer/producers", "modules": ["6"]}, {"text": "Describe stateful and stateless processes", "modules": ["6"]}, {"text": "Explain exactly once specifically for KStreams", "modules": ["6"]}, {"text": "Compare streams and tables", "modules": ["6"]}, {"text": "Compare DSL and processor API", "modules": ["6"]}]}, {"n": 4, "title": "Kafka Connect", "items": [{"text": "Create and configure connectors", "modules": ["7"]}, {"text": "Design source and sink connector properties", "modules": ["7"]}, {"text": "Define worker properties", "modules": ["7"]}, {"text": "Explain connector scalability", "modules": ["7"]}, {"text": "Understand connect offsets", "modules": ["7"]}, {"text": "Explain Single Message Transforms (SMT)", "modules": ["7"]}, {"text": "Utilize the Connect REST interface", "modules": ["7"]}]}, {"n": 5, "title": "Application Testing", "items": [{"text": "Understand common testing tools", "modules": ["5"]}, {"text": "Use CLI tools", "modules": ["5"]}, {"text": "Apply horizontal and vertical scaling", "modules": ["5", "6", "7"]}, {"text": "Understand common deployment frameworks", "modules": ["5"]}]}, {"n": 6, "title": "Application Observability", "items": [{"text": "Understand lag", "modules": ["11", "2"]}, {"text": "Understand performance metrics", "modules": ["11", "1"]}, {"text": "Configure logging / log4j", "modules": ["11"]}, {"text": "Understand common errors", "modules": ["11", "3"]}, {"text": "Configure alerts", "modules": ["11"]}]}]}</script>
<script>
    const DATA = JSON.parse(document.getElementById('data').textContent);
    const M = DATA.modules, byId = Object.fromEntries(M.map(m => [m.id, m]));
    const $ = s => document.querySelector(s);
    const store = {
        get: (k, d) => {
            try {
                return JSON.parse(localStorage.getItem(k)) ?? d
            } catch (e) {
                return d
            }
        }, set: (k, v) => localStorage.setItem(k, JSON.stringify(v))
    };
    let done = store.get('ccdak_done', {});
    let currentId = null;

    /* ---------- theme ---------- */
    function setTheme(t) {
        document.documentElement.dataset.theme = t;
        $('#theme').textContent = t === 'dark' ? '☀️' : '🌙';
        store.set('ccdak_theme', t)
    }

    setTheme(store.get('ccdak_theme', 'light'));
    $('#theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    $('#menu').onclick = () => document.body.classList.toggle('menu');

    /* ---------- sidebar ---------- */
    function renderSide() {
        const core = M.filter(m => m.kind === 'core'), extra = M.filter(m => m.kind === 'extra');
        const doneCount = core.filter(m => done[m.id]).length, pct = Math.round(doneCount / core.length * 100);
        const item = m => `<button class="nav ${m.kind} ${currentId === m.id ? 'active' : ''} ${done[m.id] ? 'done' : ''}" title="${m.id}. ${m.title}" onclick="go('m/${m.id}')"><span class="n">${m.id}</span><span class="t">${m.title}</span><span class="ck">✔</span></button>`;
        $('#side').innerHTML = `
    <button class="nav ${currentId === null ? 'active' : ''}" title="Overview &amp; exam scope" onclick="go('home')"><span class="n">⌂</span><span class="t">Overview &amp; exam scope</span></button>
    <h4>Progress</h4><div class="progress">${doneCount} of ${core.length} exam modules studied<div class="bar"><div style="width:${pct}%"></div></div></div>
    <h4>Exam modules</h4>${core.map(item).join('')}
    <h4>Supplementary</h4>${extra.map(item).join('')}
    <h4>Practice</h4><button class="nav" title="Practice exam" onclick="go('exam')"><span class="n">✎</span><span class="t">Practice exam</span></button>
    <button class="collapse-btn" title="Collapse / expand sidebar" onclick="setSide(!document.body.classList.contains('side-collapsed'))"><svg class="ico-collapse" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2v12M14 8H6M10 4L6 8l4 4"/></svg><svg class="ico-expand" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2v12M6 8h8M10 4l4 4-4 4"/></svg><span class="lbl">Collapse sidebar</span></button>`;
    }

    function setSide(collapsed) {
        document.body.classList.toggle('side-collapsed', collapsed);
        store.set('ccdak_side_collapsed', collapsed)
    }

    document.body.classList.toggle('side-collapsed', !!store.get('ccdak_side_collapsed', false));

    /* ---------- views ---------- */
    function home() {
        currentId = null;
        const core = M.filter(m => m.kind === 'core'), mins = core.reduce((a, m) => a + m.minutes, 0);
        const items = DATA.domains.reduce((a, d) => a + d.items.length, 0);
        const chips = ids => ids.map(i => `<a class="chip" href="#/m/${i}" title="${byId[i].title}">${i} · ${byId[i].title}</a>`).join('');
        $('#content').innerHTML = `
  <div class="hero"><h1>CCDAK Study Hub</h1>
    <p>Condensed, interactive summaries for the Confluent Certified Developer for Apache Kafka exam — mapped to every item of the official exam scope, with a full practice exam in its own view.</p>
    <div class="cta"><button class="btn primary" onclick="go('m/${(core.find(m => !done[m.id]) || core[0]).id}')">Continue studying →</button><button class="btn ghost" onclick="go('exam')">Take practice exam</button></div></div>
  <div class="stats">
    <div class="stat"><b>${M.length}</b><span>module summaries</span></div>
    <div class="stat"><b>${DATA.domains.length}</b><span>exam domains</span></div>
    <div class="stat"><b>${items}</b><span>scope topics covered</span></div>
    <div class="stat"><b>~${Math.round(mins / 60 * 10) / 10} h</b><span>total reading time</span></div>
    <div class="stat"><b>${Object.keys(done).filter(k => byId[k] && byId[k].kind === 'core').length}/${core.length}</b><span>modules completed</span></div>
  </div>
  <h2 class="sec">Modules</h2><div class="grid">${M.map(m => `<div class="card ${m.kind}" onclick="go('m/${m.id}')">${done[m.id] ? '<span class="tag">✔ studied</span>' : ''}<div class="n">${m.id}</div><h3>${m.title}</h3><p>${m.desc}</p><p style="margin-top:8px;font-size:12px">⏱ ~${m.minutes} min read</p></div>`).join('')}</div>
  <h2 class="sec">Exam scope coverage</h2><p class="sub">Each topic from the official exam outline, with the modules that cover it.</p>
  ${DATA.domains.map(d => `<div class="domain"><h3><em>${d.n}</em>${d.title}</h3>${d.items.map(i => `<div class="item"><span>${i.text}</span><span class="chips">${chips(i.modules)}</span></div>`).join('')}</div>`).join('')}
  <p class="legend">🚫 in a heading marks material outside the exam scope. Modules 10 and 12 are supplementary.</p>`;
        $('#toc').innerHTML = '';
        renderSide();
        scrollTo(0, 0);
    }

    function module(id) {
        const m = byId[id];
        if (!m) return home();
        currentId = id;
        const i = M.indexOf(m), prev = M[i - 1], next = M[i + 1];
        $('#content').innerHTML = `
  <div class="mhead"><div class="crumb">Module ${m.id} · ${m.kind === 'core' ? 'Exam scope' : 'Supplementary'}</div><h1>${m.title}</h1><p>${m.desc}</p>
    <div class="meta"><span class="pill">⏱ ~${m.minutes} min</span><span class="pill">📁 ${m.folder}</span><button class="mbtn ${done[id] ? 'done' : ''}" id="markbtn">${done[id] ? '✔ Studied' : 'Mark as studied'}</button></div></div>
  <div class="md" id="md">${m.html}</div>
  <div class="pager">${prev ? `<button onclick="go('m/${prev.id}')"><small>← Previous</small>${prev.id}. ${prev.title}</button>` : '<span style="flex:1"></span>'}
  ${next ? `<button class="next" onclick="go('m/${next.id}')"><small>Next →</small>${next.id}. ${next.title}</button>` : `<button class="next" onclick="go('exam')"><small>Finished →</small>Take the practice exam</button>`}</div>`;
        $('#markbtn').onclick = () => {
            done[id] = !done[id];
            if (!done[id]) delete done[id];
            store.set('ccdak_done', done);
            module(id)
        };
        decorate();
        renderSide();
        scrollTo(0, 0);
    }

    function decorate() {
        const md = $('#md'), heads = [...md.querySelectorAll('h1,h2,h3')], seen = {};
        heads.forEach(h => {
            let id = h.textContent.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'section';
            seen[id] = (seen[id] || 0) + 1;
            if (seen[id] > 1) id += '-' + seen[id];
            h.id = id
        });
        $('#toc').innerHTML = '<b>On this page</b>' + heads.filter(h => h.tagName !== 'H1' || heads.length < 40).map(h => `<a href="#" data-id="${h.id}" class="${h.tagName === 'H3' ? 'l3' : ''}">${h.textContent}</a>`).join('');
        $('#toc').querySelectorAll('a').forEach(a => a.onclick = e => {
            e.preventDefault();
            document.getElementById(a.dataset.id).scrollIntoView({behavior: 'smooth'})
        });
        md.querySelectorAll('pre').forEach(pre => {
            const b = document.createElement('button');
            b.className = 'copy';
            b.textContent = 'Copy';
            b.onclick = () => {
                navigator.clipboard.writeText(pre.querySelector('code')?.innerText ?? pre.innerText);
                b.textContent = 'Copied ✔';
                setTimeout(() => b.textContent = 'Copy', 1200)
            };
            pre.appendChild(b)
        });
        md.querySelectorAll('img').forEach(img => {
            const w = document.createElement('span');
            w.className = 'imgwrap';
            img.replaceWith(w);
            w.appendChild(img);
            const b = document.createElement('button');
            b.className = 'expand';
            b.title = 'View full size';
            b.textContent = '⛶';
            b.onclick = () => openImg(img.src, img.alt);
            w.appendChild(b)
        });
        md.querySelectorAll('a[href^="http"]').forEach(a => {
            a.target = '_blank';
            a.rel = 'noopener'
        });
    }

    addEventListener('scroll', () => {
        const links = [...document.querySelectorAll('#toc a')];
        if (!links.length) return;
        let cur = links[0];
        for (const a of links) {
            const el = document.getElementById(a.dataset.id);
            if (el && el.getBoundingClientRect().top < 120) cur = a
        }
        links.forEach(a => a.classList.toggle('on', a === cur));
    }, {passive: true});

    /* ---------- exam ---------- */
    function showExam() {
        document.body.classList.add('view-exam');
        const f = $('#examframe');
        if (!f.getAttribute('src')) f.setAttribute('src', 'exam.html');
    }

    /* ---------- routing ---------- */
    function go(r) {
        location.hash = '#/' + r;
        document.body.classList.remove('menu')
    }

    function route() {
        const r = location.hash.replace(/^#\/?/, '') || 'home';
        const isExam = r === 'exam';
        document.body.classList.toggle('view-exam', isExam);
        $('#tab-exam').classList.toggle('active', isExam);
        $('#tab-study').classList.toggle('active', !isExam);
        if (isExam) return showExam();
        if (r.startsWith('m/')) module(r.slice(2)); else home();
        document.title = (currentId ? byId[currentId].title + ' · ' : '') + 'CCDAK Study Hub';
    }

    addEventListener('hashchange', route);

    /* ---------- search ---------- */
    let index = null;

    function buildIndex() {
        index = [];
        for (const m of M) {
            const doc = new DOMParser().parseFromString('<div>' + m.html + '</div>', 'text/html').body.firstChild;
            let head = m.title, buf = [];
            const flush = () => {
                if (buf.length) index.push({m, head, text: buf.join(' ')});
                buf = []
            };
            for (const el of doc.children) {
                if (/^H[1-4]$/.test(el.tagName)) {
                    flush();
                    head = el.textContent.trim()
                } else buf.push(el.textContent.replace(/\s+/g, ' '))
            }
            flush();
        }
    }

    const esc = s => s.replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));

    function search(q) {
        const box = $('#results');
        q = q.trim().toLowerCase();
        if (q.length < 2) {
            box.style.display = 'none';
            return
        }
        if (!index) buildIndex();
        const terms = q.split(/\s+/), out = [];
        for (const s of index) {
            const hay = (s.head + ' ' + s.text).toLowerCase();
            if (!terms.every(t => hay.includes(t))) continue;
            const score = terms.reduce((a, t) => a + (s.head.toLowerCase().includes(t) ? 5 : 0) + (hay.split(t).length - 1), 0);
            const p = hay.indexOf(terms[0]), full = s.head + ' — ' + s.text;
            const at = full.toLowerCase().indexOf(terms[0]);
            let snip = esc(full.slice(Math.max(0, at - 50), at + 110));
            terms.forEach(t => snip = snip.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), x => '<mark>' + x + '</mark>'));
            out.push({s, score, snip});
        }
        out.sort((a, b) => b.score - a.score);
        box.innerHTML = out.slice(0, 25).map(o => `<a class="r" href="#/m/${o.s.m.id}" data-h="${esc(o.s.head)}"><b>${o.s.m.id}. ${o.s.m.title} › ${esc(o.s.head)}</b><span>…${o.snip}…</span></a>`).join('') || '<div class="r"><span>No results</span></div>';
        box.style.display = 'block';
        box.querySelectorAll('a.r').forEach(a => a.onclick = () => {
            box.style.display = 'none';
            const h = a.dataset.h, id = a.getAttribute('href').slice(4);
            setTimeout(() => {
                const t = [...document.querySelectorAll('#md h1,#md h2,#md h3,#md h4')].find(e => e.textContent.trim() === h);
                if (t) t.scrollIntoView({behavior: 'smooth'})
            }, currentId === id ? 0 : 80);
        });
    }

    $('#q').addEventListener('input', e => search(e.target.value));
    $('#q').addEventListener('focus', e => search(e.target.value));
    document.addEventListener('click', e => {
        if (!e.target.closest('.search')) $('#results').style.display = 'none'
    });
    addEventListener('keydown', e => {
        if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
            e.preventDefault();
            $('#q').focus()
        }
        if (e.key === 'Escape') {
            $('#results').style.display = 'none';
            $('#q').blur()
        }
        if (!/INPUT|TEXTAREA/.test(document.activeElement.tagName) && currentId) {
            const i = M.findIndex(m => m.id === currentId);
            if (e.key === 'ArrowRight' && M[i + 1]) go('m/' + M[i + 1].id);
            if (e.key === 'ArrowLeft' && M[i - 1]) go('m/' + M[i - 1].id);
        }
    });
    const modal = $('#imgmodal'), modalImg = modal.querySelector('img');

    function openImg(src, alt) {
        modalImg.src = src;
        modalImg.alt = alt || '';
        modal.classList.remove('full');
        modal.classList.add('open');
        modal.scrollTop = 0;
        document.body.style.overflow = 'hidden'
    }

    function closeImg() {
        modal.classList.remove('open');
        document.body.style.overflow = ''
    }

    modalImg.onclick = () => modal.classList.toggle('full');
    modal.querySelector('.close').onclick = closeImg;
    modal.onclick = e => {
        if (e.target === modal) closeImg()
    };
    addEventListener('keydown', e => {
        if (!modal.classList.contains('open')) return;
        e.stopImmediatePropagation();
        if (e.key === 'Escape') closeImg()
    }, true);

    route();
</script>
</body>
</html>
