name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install markdown-it-py

      - name: Build exams and site
        run: bash build-all.sh

      - id: pages
        uses: actions/configure-pages@v6

      - name: Stage site
        run: |
          mkdir _site
          cp site/index.html site/exam.html _site/
          touch _site/.nojekyll
          cat <<'EOF' > _site/404.html
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="robots" content="noindex, nofollow">
            <meta http-equiv="refresh" content="0; url=${{ steps.pages.outputs.base_path }}/">
            <title>Redirecting…</title>
            <script>location.replace('${{ steps.pages.outputs.base_path }}/');</script>
          </head>
          <body>
            <p>Redirecting to <a href="${{ steps.pages.outputs.base_path }}/">home page</a>…</p>
          </body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
